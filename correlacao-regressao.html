<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correlação e Regressão Linear Simples — Passo a Passo | Odin Dinho</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0d1117;
  --bg-card: #161b22;
  --bg-panel: #1c2333;
  --odin-blue: #58a6ff;
  --thor-red: #f85149;
  --corvo-purple: #bc8cff;
  --gold: #f0c040;
  --silver: #8b949e;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --success: #3fb950;
  --border: #30363d;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Patrick Hand', cursive;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* PROGRESS BAR */
.progress-bar-container {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-dark);
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--border);
}

.progress-label {
  font-family: 'Permanent Marker', cursive;
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-align: center;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-panel);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--odin-blue), var(--gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* STEP CONTENT */
.step-content {
  min-height: 60vh;
  padding: 30px 0;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-title {
  font-family: 'Bangers', cursive;
  font-size: 2.2rem;
  color: var(--gold);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.step-subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.3rem;
  color: var(--odin-blue);
  margin-bottom: 15px;
}

/* DIALOGUE BOXES */
.dialogue-box {
  border-radius: 12px;
  padding: 16px 20px;
  margin: 16px 0;
  border-left: 4px solid;
  position: relative;
}

.dialogue-box.odin {
  background: rgba(88,166,255,0.08);
  border-left-color: var(--odin-blue);
}
.dialogue-box.thor {
  background: rgba(248,81,73,0.08);
  border-left-color: var(--thor-red);
}
.dialogue-box.corvo {
  background: rgba(188,140,255,0.08);
  border-left-color: var(--corvo-purple);
}

.char-name {
  font-family: 'Permanent Marker', cursive;
  font-size: 1rem;
  margin-bottom: 6px;
}
.char-name.odin { color: var(--odin-blue); }
.char-name.thor { color: var(--thor-red); }
.char-name.corvo { color: var(--corvo-purple); }

.dialogue-text {
  font-size: 1.05rem;
  line-height: 1.5;
}

/* DATA TABLE */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 1rem;
}

.data-table th, .data-table td {
  padding: 10px 14px;
  text-align: center;
  border: 1px solid var(--border);
}

.data-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
}

.data-table td {
  background: var(--bg-card);
  transition: background 0.2s;
}

.data-table tr:hover td {
  background: rgba(88,166,255,0.1);
}

/* CALC TABLE */
.calc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.95rem;
}

.calc-table th, .calc-table td {
  padding: 8px 10px;
  text-align: center;
  border: 1px solid var(--border);
}

.calc-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.calc-table td {
  background: var(--bg-card);
}

/* FORMULA */
.formula {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 16px 0;
  font-size: 1.15rem;
  text-align: center;
  font-family: 'Patrick Hand', cursive;
  color: var(--gold);
}

.formula-label {
  font-family: 'Permanent Marker', cursive;
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-bottom: 6px;
}

/* SVG VISUALS */
.visual-container {
  margin: 20px 0;
  text-align: center;
}

.visual-container svg {
  max-width: 100%;
  height: auto;
}

/* CONCEPT GRID */
.concept-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.concept-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.concept-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

/* COMPARISON GRID */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.comparison-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.comparison-title {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.comparison-result {
  font-size: 1.4rem;
  font-family: 'Bangers', cursive;
}

/* APA BOX */
.apa-box {
  background: var(--bg-panel);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 20px 24px;
  margin: 20px 0;
  font-style: italic;
  line-height: 1.7;
}

.apa-label {
  font-family: 'Bangers', cursive;
  color: var(--gold);
  font-style: normal;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

/* WARNING BOX */
.warning-box {
  background: rgba(248,81,73,0.06);
  border: 2px solid var(--thor-red);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.warning-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--thor-red);
  margin-bottom: 12px;
}

/* CORRECT BOX */
.correct-box {
  background: rgba(63,185,80,0.06);
  border: 2px solid var(--success);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.correct-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--success);
  margin-bottom: 12px;
}

/* RAVENS LESSON */
.licao-box {
  background: rgba(188,140,255,0.06);
  border: 2px solid var(--corvo-purple);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.licao-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--corvo-purple);
  margin-bottom: 12px;
}

/* TRAP GRID */
.trap-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.trap-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.trap-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  color: var(--thor-red);
  margin-bottom: 8px;
}

/* NAVIGATION */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0 40px;
  gap: 12px;
}

.nav-btn {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.1rem;
  padding: 12px 28px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s;
}

.nav-btn:hover {
  border-color: var(--odin-blue);
  background: rgba(88,166,255,0.1);
}

.nav-btn.primary {
  background: var(--odin-blue);
  color: var(--bg-dark);
  border-color: var(--odin-blue);
}

.nav-btn.primary:hover {
  background: #79bbff;
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* SIGNATURE */
.signature {
  text-align: center;
  padding: 30px 0;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.9rem;
}

/* HIGHLIGHTS */
.hl-gold { color: var(--gold); font-weight: bold; }
.hl-blue { color: var(--odin-blue); }
.hl-red { color: var(--thor-red); }
.hl-green { color: var(--success); }
.hl-purple { color: var(--corvo-purple); }

/* RESPONSIVE */
@media (max-width: 600px) {
  .container { padding: 12px; }
  .step-title { font-size: 1.6rem; }
  .concept-grid, .comparison-grid, .trap-grid { grid-template-columns: 1fr; }
  .nav-btn { padding: 10px 18px; font-size: 0.95rem; }
  body { font-size: 16px; }
}

.fade-in { animation: fadeIn 0.6s ease both; }
.fade-in-delay { animation: fadeIn 0.6s ease 0.3s both; }
</style>

<div class="container">

<script>
// ===== DADOS =====
// Guilda de mercadores: 8 postos comerciais
var posts = ['Birka','Hedeby','Kaupang','Ribe','Jorvik','Sigtuna','Visby','Roskilde'];
var X = [12, 18, 8, 25, 30, 15, 22, 10]; // Distância (léguas)
var Y = [45, 38, 52, 30, 25, 42, 33, 48]; // Barris de hidromel vendidos
var n = X.length;

// ===== HELPERS =====
function sum(arr) { return arr.reduce(function(a,b){return a+b;},0); }
function mean(arr) { return sum(arr) / arr.length; }
function r(v, d) { return Number(v).toFixed(d === undefined ? 2 : d); }
function r4(v) { return Number(v).toFixed(4); }

// ===== MÉDIAS =====
var meanX = mean(X);
var meanY = mean(Y);

// ===== DESVIOS =====
var dx = X.map(function(x){return x - meanX;});
var dy = Y.map(function(y){return y - meanY;});
var dxdy = dx.map(function(v,i){return v * dy[i];});
var dx2 = dx.map(function(v){return v * v;});
var dy2 = dy.map(function(v){return v * v;});

var sumDxDy = sum(dxdy);
var sumDx2 = sum(dx2);
var sumDy2 = sum(dy2);

// ===== PEARSON r =====
var rPearson = sumDxDy / Math.sqrt(sumDx2 * sumDy2);
var r2 = rPearson * rPearson;

// ===== TESTE DE SIGNIFICÂNCIA =====
var t_r = rPearson * Math.sqrt((n - 2) / (1 - r2));
var df_r = n - 2;

// ===== SPEARMAN =====
function rankArray(arr) {
  var sorted = arr.map(function(v,i){return {v:v,i:i};}).sort(function(a,b){return a.v - b.v;});
  var ranks = new Array(arr.length);
  var i = 0;
  while (i < sorted.length) {
    var j = i;
    while (j < sorted.length && sorted[j].v === sorted[i].v) j++;
    var avgRank = (i + 1 + j) / 2;
    for (var k = i; k < j; k++) ranks[sorted[k].i] = avgRank;
    i = j;
  }
  return ranks;
}

var rankX = rankArray(X);
var rankY = rankArray(Y);
var dRank = rankX.map(function(v,i){return v - rankY[i];});
var dRank2 = dRank.map(function(v){return v * v;});
var sumDRank2 = sum(dRank2);
var rhoSpearman = 1 - (6 * sumDRank2) / (n * (n * n - 1));

// ===== REGRESSÃO =====
var b1 = sumDxDy / sumDx2;
var b0 = meanY - b1 * meanX;

// ===== VALORES PREDITOS & RESÍDUOS =====
var Yhat = X.map(function(x){return b0 + b1 * x;});
var residuals = Y.map(function(y,i){return y - Yhat[i];});

// ===== SST, SSR, SSE =====
var SST = sumDy2;
var SSR = Yhat.map(function(yh){return Math.pow(yh - meanY, 2);}).reduce(function(a,b){return a+b;},0);
var SSE = residuals.map(function(e){return e * e;}).reduce(function(a,b){return a+b;},0);
var R2 = SSR / SST;

// ===== APROXIMAÇÃO DO P-VALOR =====
function gammln(x) {
  var c = [76.18009172947146,-86.50532032941677,24.01409824083091,
    -1.231739572450155,0.001208650973866179,-0.000005395239384953];
  var y = x, tmp = x + 5.5;
  tmp -= (x+0.5)*Math.log(tmp);
  var ser = 1.000000000190015;
  for(var j=0;j<6;j++) ser += c[j]/(++y);
  return -tmp + Math.log(2.5066282746310005*ser/x);
}

function tPDF(x, df) {
  var coeff = Math.exp(gammln((df+1)/2) - gammln(df/2)) / Math.sqrt(df * Math.PI);
  return coeff * Math.pow(1 + x*x/df, -(df+1)/2);
}

function tCDF(t, df) {
  var lower = -30;
  var steps = 4000;
  var h = (t - lower) / steps;
  var s = tPDF(lower, df) + tPDF(t, df);
  for (var i = 1; i < steps; i++) {
    var xi = lower + i * h;
    s += (i % 2 === 0 ? 2 : 4) * tPDF(xi, df);
  }
  return Math.max(0, Math.min(1, (h/3) * s));
}

function pValueTwoTailed(t, df) {
  var cdf = tCDF(Math.abs(t), df);
  return 2 * (1 - cdf);
}

var p_r = pValueTwoTailed(t_r, df_r);

// ===== HELPER DE DIÁLOGO =====
function dialogue(character, name, text) {
  return '<div class="dialogue-box ' + character + '">' +
    '<div class="char-name ' + character + '">' + name + '</div>' +
    '<div class="dialogue-text">' + text + '</div>' +
  '</div>';
}

// ===== SCATTERPLOT SVG =====
function buildScatterplot(opts) {
  var w = opts.width || 680;
  var h = opts.height || 400;
  var pad = { top: 30, right: 30, bottom: 50, left: 60 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  var xMin = 0, xMax = 35;
  var yMin = 15, yMax = 60;
  function sx(v) { return pad.left + (v - xMin) / (xMax - xMin) * pw; }
  function sy(v) { return pad.top + ph - (v - yMin) / (yMax - yMin) * ph; }

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

  // Linhas de grade
  for (var gx = 5; gx <= 30; gx += 5) {
    svg += '<line x1="' + sx(gx) + '" y1="' + pad.top + '" x2="' + sx(gx) + '" y2="' + (pad.top + ph) + '" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>';
  }
  for (var gy = 20; gy <= 55; gy += 5) {
    svg += '<line x1="' + pad.left + '" y1="' + sy(gy) + '" x2="' + (pad.left + pw) + '" y2="' + sy(gy) + '" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>';
  }

  // Eixos
  svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (pad.left + pw) + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';
  svg += '<line x1="' + pad.left + '" y1="' + pad.top + '" x2="' + pad.left + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';

  // Ticks X
  for (var gx2 = 5; gx2 <= 30; gx2 += 5) {
    svg += '<text x="' + sx(gx2) + '" y="' + (pad.top + ph + 20) + '" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Patrick Hand">' + gx2 + '</text>';
  }
  // Ticks Y
  for (var gy2 = 20; gy2 <= 55; gy2 += 10) {
    svg += '<text x="' + (pad.left - 10) + '" y="' + (sy(gy2) + 4) + '" fill="#8b949e" font-size="12" text-anchor="end" font-family="Patrick Hand">' + gy2 + '</text>';
  }

  // Rótulos dos eixos
  svg += '<text x="' + (pad.left + pw/2) + '" y="' + (h - 5) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker">' + (opts.xLabel || 'Distância (léguas)') + '</text>';
  svg += '<text x="15" y="' + (pad.top + ph/2) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker" transform="rotate(-90,15,' + (pad.top + ph/2) + ')">' + (opts.yLabel || 'Barris de Hidromel') + '</text>';

  // Linha de regressão
  if (opts.showLine) {
    var lx1 = xMin + 1, lx2 = xMax - 1;
    var ly1 = b0 + b1 * lx1, ly2 = b0 + b1 * lx2;
    svg += '<line x1="' + sx(lx1) + '" y1="' + sy(ly1) + '" x2="' + sx(lx2) + '" y2="' + sy(ly2) + '" stroke="#f0c040" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.9"/>';
    svg += '<text x="' + sx(lx2) + '" y="' + (sy(ly2) - 8) + '" fill="#f0c040" font-size="11" text-anchor="end" font-family="Permanent Marker">ŷ = ' + r(b0,1) + (b1 < 0 ? ' ' : ' + ') + r(b1,2) + 'x</text>';
  }

  // Linhas de resíduos
  if (opts.showResiduals) {
    for (var ri = 0; ri < n; ri++) {
      svg += '<line x1="' + sx(X[ri]) + '" y1="' + sy(Y[ri]) + '" x2="' + sx(X[ri]) + '" y2="' + sy(Yhat[ri]) + '" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>';
    }
  }

  // Linhas das médias
  if (opts.showMeans) {
    svg += '<line x1="' + sx(meanX) + '" y1="' + pad.top + '" x2="' + sx(meanX) + '" y2="' + (pad.top + ph) + '" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>';
    svg += '<line x1="' + pad.left + '" y1="' + sy(meanY) + '" x2="' + (pad.left + pw) + '" y2="' + sy(meanY) + '" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>';
    svg += '<text x="' + (sx(meanX) + 4) + '" y="' + (pad.top + 12) + '" fill="#58a6ff" font-size="10" font-family="Permanent Marker">̄X=' + r(meanX,1) + '</text>';
    svg += '<text x="' + (pad.left + pw - 2) + '" y="' + (sy(meanY) - 4) + '" fill="#58a6ff" font-size="10" text-anchor="end" font-family="Permanent Marker">̄Y=' + r(meanY,1) + '</text>';
  }

  // Pontos
  for (var pi = 0; pi < n; pi++) {
    svg += '<circle cx="' + sx(X[pi]) + '" cy="' + sy(Y[pi]) + '" r="6" fill="#58a6ff" stroke="#0d1117" stroke-width="1.5" opacity="0.9"/>';
    if (opts.showLabels) {
      svg += '<text x="' + (sx(X[pi]) + 9) + '" y="' + (sy(Y[pi]) - 8) + '" fill="#e6edf3" font-size="10" font-family="Patrick Hand">' + posts[pi] + '</text>';
    }
  }

  svg += '</svg>';
  return svg;
}

// ===== CURVA NORMAL SVG =====
function buildNormalCurve(opts) {
  var w = opts.width || 680;
  var h = opts.height || 140;
  var mu = opts.mu || 0;
  var sigma = opts.sigma || 1;
  var lo = mu - 3.5 * sigma;
  var hi = mu + 3.5 * sigma;
  var pad2 = 30;
  function sx2(x) { return pad2 + (x - lo) / (hi - lo) * (w - 2 * pad2); }
  function normalPDF(x) {
    return (1/(sigma*Math.sqrt(2*Math.PI))) * Math.exp(-0.5*Math.pow((x-mu)/sigma, 2));
  }
  var peak = normalPDF(mu);
  function sy2(p) { return h - pad2 - (p / peak) * (h - 2 * pad2); }

  var path = 'M';
  for (var x = lo; x <= hi; x += (hi-lo)/200) {
    path += ' ' + sx2(x).toFixed(1) + ',' + sy2(normalPDF(x)).toFixed(1);
  }

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<path d="' + path + '" fill="none" stroke="' + (opts.color || '#58a6ff') + '" stroke-width="2.5"/>';
  svg += '<line x1="' + pad2 + '" y1="' + (h - pad2) + '" x2="' + (w - pad2) + '" y2="' + (h - pad2) + '" stroke="#30363d" stroke-width="1"/>';
  svg += '</svg>';
  return svg;
}

// ===== FUNÇÕES DOS PASSOS =====
var totalSteps = 12; // 0..11
var currentStep = 0;

// ===== PASSO 0: INTRODUÇÃO =====
function step0() {
  return '<div class="step-title">O Mapa de Midgard: Mapeando a Relação Entre Variáveis</div>' +

    '<p>Nos salões da Guilda dos Mercadores de Midgard, o Mestre da Guilda tem uma questão que não o deixa dormir: postos comerciais mais <em>distantes</em> da capital vendem menos barris de hidromel? Ele desenrola um pergaminho com dados de <span class="hl-gold">8 postos comerciais</span> espalhados pelos Nove Reinos.</p>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Duas variáveis, uma pergunta: existe uma <strong>relação sistemática</strong> entre Distância e Vendas de Hidromel? Este reino cobre duas ferramentas poderosas \x96 <span class="hl-blue">Correlação</span> (força e direção do vínculo) e <span class="hl-gold">Regressão Linear Simples</span> (prever uma variável a partir da outra).') +

    dialogue('thor', '⚡ ThorMento', 'Pfff, só bater o olho nos números! Posto mais longe = menos barris. Fechou!') +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', '<strong>Correlação</strong> mede a força e direção de uma associação linear entre duas variáveis quantitativas. <strong>Regressão</strong> vai além: ajusta uma reta que nos permite <em>prever</em> uma variável a partir da outra. Ambas foram pioneiradas por Sir Francis Galton nos anos 1880 e refinadas por Karl Pearson.') +

    '<p style="margin-top:18px">Eis o pergaminho da guilda:</p>' +

    '<table class="data-table">' +
    '<tr><th>Posto Comercial</th><th>Distância (léguas)</th><th>Barris de Hidromel</th></tr>' +
    '<tr><td>Birka</td><td>12</td><td>45</td></tr>' +
    '<tr><td>Hedeby</td><td>18</td><td>38</td></tr>' +
    '<tr><td>Kaupang</td><td>8</td><td>52</td></tr>' +
    '<tr><td>Ribe</td><td>25</td><td>30</td></tr>' +
    '<tr><td>Jorvik</td><td>30</td><td>25</td></tr>' +
    '<tr><td>Sigtuna</td><td>15</td><td>42</td></tr>' +
    '<tr><td>Visby</td><td>22</td><td>33</td></tr>' +
    '<tr><td>Roskilde</td><td>10</td><td>48</td></tr>' +
    '</table>' +

    dialogue('corvo', '🐦‍⬛ Huginn provoca:', 'Antes de calcular qualquer número \x96 o que você <em>espera</em> encontrar? Correlação positiva, negativa ou nula? Pense no <em>porquê</em>, não apenas nos números.');
}

// ===== PASSO 1: DIAGRAMA DE DISPERSÃO =====
function step1() {
  return '<div class="step-title">Passo 1: O Diagrama de Dispersão \x96 Mapeando o Terreno</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'O primeiro mandamento da correlação: <strong>sempre visualize seus dados</strong>. Um diagrama de dispersão revela a forma, direção e outliers que os números sozinhos podem esconder.') +

    '<p>Cada posto comercial vira um ponto: o <span class="hl-blue">eixo x</span> é a Distância, o <span class="hl-gold">eixo y</span> é Barris de Hidromel Vendidos.</p>' +

    '<div class="visual-container">' +
      buildScatterplot({ showLabels: true, showMeans: true, xLabel: 'Distância (léguas)', yLabel: 'Barris de Hidromel' }) +
    '</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Observe o padrão: conforme a distância <em>aumenta</em>, as vendas de hidromel <em>diminuem</em>. Os pontos formam uma nuvem aproximadamente linear inclinada para <strong>baixo</strong>. Isso sugere uma <span class="hl-red">correlação negativa</span>.') +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">O que verificar</h4>' +
        '<p>A nuvem é aproximadamente <strong>linear</strong>? Ou apresenta curva?</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">Direção</h4>' +
        '<p><strong>Subindo</strong> = r positivo. <strong>Descendo</strong> = r negativo.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">Adesão</h4>' +
        '<p>Quanto mais os pontos se agrupam ao redor de uma linha imaginária, mais forte é a correlação.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--thor-red)">Outliers</h4>' +
        '<p>Um único ponto fora da curva pode alterar drasticamente o r. Sempre inspecione visualmente.</p>' +
      '</div>' +
    '</div>' +

    dialogue('thor', '⚡ ThorMento', 'Diagrama de dispersão? Perda de tempo. Já te dei a resposta \x96 é só calcular o número!') +

    dialogue('corvo', '🐦‍⬛ Huginn provoca:', 'Quarteto de Anscombe: quatro conjuntos de dados com o <em>mesmo</em> r = 0,816 mas formas completamente diferentes. Sem o gráfico, você jamais saberia que um é curvo, outro tem outlier e outro é uma linha vertical. <strong>Visualize primeiro. Sempre.</strong>');
}

// ===== PASSO 2: PEARSON r =====
function step2() {
  return '<div class="step-title">Passo 2: r de Pearson \x96 O Coeficiente de Correlação</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'O r de Pearson quantifica a relação <strong>linear</strong> entre duas variáveis. Varia de \x961 (negativa perfeita) a +1 (positiva perfeita). Zero significa ausência de associação linear.') +

    '<div class="formula">' +
      '<div class="formula-label">r de Pearson</div>' +
      'r = &Sigma;(x<sub>i</sub> \x96 ̄x)(y<sub>i</sub> \x96 ̄y) / &radic;[&Sigma;(x<sub>i</sub> \x96 ̄x)&sup2; &middot; &Sigma;(y<sub>i</sub> \x96 ̄y)&sup2;]' +
    '</div>' +

    '<p class="step-subtitle">Cálculo passo a passo</p>' +

    '<p><strong>Médias:</strong> ̄X = ' + r(meanX,2) + ' léguas &nbsp;|&nbsp; ̄Y = ' + r(meanY,2) + ' barris</p>' +

    '<table class="calc-table">' +
    '<tr><th>Posto</th><th>x</th><th>y</th><th>x\x96̄x</th><th>y\x96̄y</th><th>(x\x96̄x)(y\x96̄y)</th><th>(x\x96̄x)&sup2;</th><th>(y\x96̄y)&sup2;</th></tr>' +
    (function() {
      var rows = '';
      for (var i = 0; i < n; i++) {
        rows += '<tr><td>' + posts[i] + '</td><td>' + X[i] + '</td><td>' + Y[i] + '</td><td>' + r(dx[i],2) + '</td><td>' + r(dy[i],2) + '</td><td>' + r(dxdy[i],2) + '</td><td>' + r(dx2[i],2) + '</td><td>' + r(dy2[i],2) + '</td></tr>';
      }
      return rows;
    })() +
    '<tr style="font-weight:bold;background:var(--bg-panel)"><td colspan="5" style="text-align:right">Somas &rarr;</td><td style="color:var(--gold)">' + r(sumDxDy,2) + '</td><td style="color:var(--odin-blue)">' + r(sumDx2,2) + '</td><td style="color:var(--odin-blue)">' + r(sumDy2,2) + '</td></tr>' +
    '</table>' +

    '<div class="formula">' +
      '<div class="formula-label">Substituindo</div>' +
      'r = <span class="hl-gold">' + r(sumDxDy,2) + '</span> / &radic;(<span class="hl-blue">' + r(sumDx2,2) + '</span> &times; <span class="hl-blue">' + r(sumDy2,2) + '</span>) = ' + r(sumDxDy,2) + ' / &radic;(' + r(sumDx2 * sumDy2,2) + ') = ' + r(sumDxDy,2) + ' / ' + r(Math.sqrt(sumDx2 * sumDy2),2) + ' = <span class="hl-gold">' + r4(rPearson) + '</span>' +
    '</div>' +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', 'O numerador captura a <em>covariação</em> \x96 x e y se desviam de suas médias na <em>mesma</em> direção? O denominador padroniza, forçando r para o intervalo [\x961, +1]. Produtos negativos = r negativo.');
}

// ===== PASSO 3: INTERPRETANDO r =====
function step3() {
  return '<div class="step-title">Passo 3: Interpretando r \x96 Magnitude, Direção e a Armadilha da Causalidade</div>' +

    '<p>Nosso <span class="hl-gold">r = ' + r4(rPearson) + '</span> calculado. O que isso <em>significa</em>?</p>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Três coisas a avaliar: (1) <strong>Direção</strong> \x96 negativo, então distância e vendas se movem em direções opostas. (2) <strong>Magnitude</strong> \x96 quão forte? (3) <strong>Causalidade</strong> \x96 a distância <em>causa</em> vendas menores? Não necessariamente!') +

    '<p class="step-subtitle">Benchmarks de Cohen (1988)</p>' +

    '<table class="data-table">' +
    '<tr><th>|r|</th><th>Força</th><th>Nosso r</th></tr>' +
    '<tr><td>0,10 \x96 0,29</td><td style="color:var(--success)">Pequeno</td><td rowspan="3" style="vertical-align:middle;font-family:Bangers;font-size:1.4rem;color:var(--gold)">' + r4(rPearson) + '<br><span style="font-family:Permanent Marker;font-size:0.9rem;color:var(--thor-red)">Grande!</span></td></tr>' +
    '<tr><td>0,30 \x96 0,49</td><td style="color:var(--gold)">Médio</td></tr>' +
    '<tr><td>0,50+</td><td style="color:var(--thor-red)">Grande</td></tr>' +
    '</table>' +

    '<p>|r| = ' + r(Math.abs(rPearson),4) + ' excede o limiar de 0,50, indicando uma associação linear <span class="hl-red">negativa grande</span>.</p>' +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ Armadilha de ThorMento: Correlação = Causalidade?</div>' +
      dialogue('thor', '⚡ ThorMento', 'Caso encerrado! A distância <em>causa</em> vendas menores. Vamos mudar todos os postos para perto da capital!') +
      dialogue('odin', '🧙‍♂️ Odin Dinho', '<strong>Não.</strong> Correlação nos diz que as variáveis <em>covariam</em>. Mas uma terceira variável \x96 densidade populacional, concorrência local, clima \x96 pode estar por trás de ambas. Correlação é <em>necessária</em> para causalidade, mas jamais <em>suficiente</em>.') +
    '</div>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--thor-red)">Confundidora</h4>' +
        '<p>Uma variável oculta (Z) impulsiona tanto X quanto Y, criando uma correlação espúria.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">Causalidade reversa</h4>' +
        '<p>Talvez postos com baixas vendas <em>escolheram</em> ficar mais longe (terreno mais barato), e não o contrário.</p>' +
      '</div>' +
    '</div>' +

    dialogue('corvo', '🐦‍⬛ Huginn provoca:', 'Os benchmarks de Cohen são <em>diretrizes</em>, não leis. Em alguns campos, r = 0,30 é enorme (psicologia da personalidade). Em outros, r = 0,80 é rotina (confiabilidade teste-reteste). Sempre interprete no contexto.');
}

// ===== PASSO 4: r-QUADRADO =====
function step4() {
  return '<div class="step-title">Passo 4: O Coeficiente de Determinação (r²)</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'O r de Pearson indica <em>direção</em> e <em>força</em>. Mas r² nos diz algo ainda mais intuitivo: a <strong>proporção da variância</strong> em Y que é explicada por X.') +

    '<div class="formula">' +
      '<div class="formula-label">Coeficiente de Determinação</div>' +
      'r² = (' + r4(rPearson) + ')² = <span class="hl-gold">' + r4(r2) + '</span>' +
    '</div>' +

    '<p>Isso significa que <span class="hl-gold">' + r(r2 * 100, 1) + '%</span> da variância nas Vendas de Hidromel pode ser explicada pela Distância. Os <span class="hl-blue">' + r((1 - r2) * 100, 1) + '%</span> restantes se devem a outros fatores.</p>' +

    '<div class="visual-container">' +
      '<svg viewBox="0 0 400 50" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="10" y="10" width="380" height="30" rx="6" fill="#1c2333" stroke="#30363d"/>' +
        '<rect x="10" y="10" width="' + (380 * r2).toFixed(0) + '" height="30" rx="6" fill="#f0c040" opacity="0.8"/>' +
        '<text x="' + (10 + 380 * r2 / 2).toFixed(0) + '" y="30" fill="#0d1117" font-size="12" text-anchor="middle" font-family="Permanent Marker">Explicada: ' + r(r2 * 100, 1) + '%</text>' +
        '<text x="' + (10 + 380 * r2 + (380 * (1-r2)) / 2).toFixed(0) + '" y="30" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Permanent Marker">Não explicada: ' + r((1-r2) * 100, 1) + '%</text>' +
      '</svg>' +
    '</div>' +

    dialogue('thor', '⚡ ThorMento', 'Espera, então quase ' + r((1-r2)*100,0) + '% não é explicado? Sua preciosa correlação não explica tudo!') +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Correto \x96 e esse é o ponto. Temos <em>um</em> preditor. A regressão múltipla (um reino futuro) pode adicionar mais preditores para explicar mais variância. Mas nunca espere 100% \x96 o mundo é ruidoso.') +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', 'Insight fundamental: um r "grande" de 0,50 significa r² = 0,25 \x96 apenas 25% da variância explicada. Elevar r ao quadrado é um exercício de humildade. O rótulo "correlação forte" frequentemente mascara muita variabilidade não explicada.');
}

// ===== PASSO 5: TESTE DE SIGNIFICÂNCIA PARA r =====
function step5() {
  return '<div class="step-title">Passo 5: r é Estatisticamente Significativo?</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Encontramos r = ' + r4(rPearson) + '. Mas poderia ser acaso? Com apenas n = 8, até uma correlação moderada pode surgir por sorte. Testamos H₀: ρ = 0 (sem correlação na população).') +

    '<div class="formula">' +
      '<div class="formula-label">Estatística de teste para r</div>' +
      't = r &middot; &radic;(n \x96 2) / &radic;(1 \x96 r²)' +
    '</div>' +

    '<div class="formula">' +
      '<div class="formula-label">Substituindo</div>' +
      't = ' + r4(rPearson) + ' &middot; &radic;(' + n + ' \x96 2) / &radic;(1 \x96 ' + r4(r2) + ')' +
      '<br>t = ' + r4(rPearson) + ' &middot; &radic;(' + df_r + ') / &radic;(' + r4(1 - r2) + ')' +
      '<br>t = ' + r4(rPearson) + ' &middot; ' + r(Math.sqrt(df_r),4) + ' / ' + r(Math.sqrt(1 - r2),4) +
      '<br><span class="hl-gold">t = ' + r(t_r,4) + '</span>, gl = ' + df_r +
    '</div>' +

    '<p>Com gl = ' + df_r + ' e α = 0,05 (bicaudal), o t crítico ≈ 2,447. Nosso |t| = ' + r(Math.abs(t_r),2) + ' ' + (Math.abs(t_r) > 2.447 ? '<span class="hl-green">excede</span>' : '<span class="hl-red">não excede</span>') + ' o valor crítico.</p>' +

    '<p><span class="hl-gold">p ≈ ' + (p_r < 0.001 ? '< 0,001' : r(p_r, 4)) + '</span></p>' +

    (Math.abs(t_r) > 2.447 ?
      '<div class="correct-box"><div class="correct-title">✅ Rejeitar H₀</div><p>A correlação é estatisticamente significativa ao nível α = 0,05. Há evidência de uma relação linear entre distância e vendas de hidromel na população.</p></div>' :
      '<div class="warning-box"><div class="warning-title">⚠️ Falhar em Rejeitar H₀</div><p>A correlação não é estatisticamente significativa ao nível α = 0,05.</p></div>'
    ) +

    dialogue('thor', '⚡ ThorMento', 'Ha! p < 0,05, então a correlação é real e importante!') +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Significância estatística ≠ importância prática. Com n grande, até um r = 0,08 minúsculo pode ser "significativo." Sempre reporte o <strong>tamanho de efeito</strong> (o próprio r) e o <strong>intervalo de confiança</strong>, não apenas p.') +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', 'Com amostras pequenas (como n = 8), o teste de significância tem baixo <strong>poder</strong>. Um resultado não significativo não prova que ρ = 0 \x96 pode significar apenas que não tínhamos poder suficiente para detectá-lo.');
}

// ===== PASSO 6: SPEARMAN =====
function step6() {
  return '<div class="step-title">Passo 6: ρ de Spearman \x96 A Alternativa Baseada em Postos</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'O r de Pearson mede associação <em>linear</em> e assume que ambas as variáveis são aproximadamente normais. Quando os dados são <strong>ordinais</strong>, têm <strong>outliers</strong> ou mostram um padrão <strong>monotônico mas não linear</strong>, recorremos ao ρ (rho) de Spearman.') +

    '<div class="formula">' +
      '<div class="formula-label">ρ de Spearman</div>' +
      'ρ<sub>s</sub> = 1 \x96 [6 &middot; &Sigma;d<sub>i</sub>²] / [n(n² \x96 1)]' +
    '</div>' +

    '<p class="step-subtitle">Passo a passo: ranquear e calcular</p>' +

    '<table class="calc-table">' +
    '<tr><th>Posto</th><th>Distância</th><th>Rank(X)</th><th>Hidromel</th><th>Rank(Y)</th><th>d = R(X)\x96R(Y)</th><th>d²</th></tr>' +
    (function() {
      var rows = '';
      for (var i = 0; i < n; i++) {
        rows += '<tr><td>' + posts[i] + '</td><td>' + X[i] + '</td><td>' + r(rankX[i],1) + '</td><td>' + Y[i] + '</td><td>' + r(rankY[i],1) + '</td><td>' + r(dRank[i],1) + '</td><td>' + r(dRank2[i],2) + '</td></tr>';
      }
      return rows;
    })() +
    '<tr style="font-weight:bold;background:var(--bg-panel)"><td colspan="6" style="text-align:right">&Sigma;d² =</td><td style="color:var(--gold)">' + r(sumDRank2,2) + '</td></tr>' +
    '</table>' +

    '<div class="formula">' +
      '<div class="formula-label">Substituindo</div>' +
      'ρ<sub>s</sub> = 1 \x96 [6 &times; ' + r(sumDRank2,2) + '] / [' + n + '(' + (n*n) + ' \x96 1)] = 1 \x96 ' + r(6*sumDRank2,2) + ' / ' + (n*(n*n-1)) + ' = <span class="hl-gold">' + r4(rhoSpearman) + '</span>' +
    '</div>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">Quando Pearson</h4>' +
        '<p>Ambas as variáveis contínuas, aproximadamente normais, relação linear esperada.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">Quando Spearman</h4>' +
        '<p>Dados ordinais, outliers, distribuições assimétricas ou padrões monotônicos não lineares.</p>' +
      '</div>' +
    '</div>' +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', 'Observe: Pearson r = ' + r4(rPearson) + ' e Spearman ρ = ' + r4(rhoSpearman) + '. São próximos porque nossos dados são razoavelmente lineares sem outliers importantes. Quando divergem, investigue \x96 geralmente indica não-linearidade ou influência de outliers.');
}

// ===== PASSO 7: REGRESSÃO LINEAR SIMPLES =====
function step7() {
  return '<div class="step-title">Passo 7: Regressão Linear Simples \x96 A Reta de Predição</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'A correlação nos disse que há um vínculo negativo forte. Agora a regressão nos permite <strong>prever</strong>: dada uma distância, quantos barris podemos esperar? Ajustamos uma reta através da nuvem de pontos.') +

    '<div class="formula">' +
      '<div class="formula-label">Equação de regressão</div>' +
      'ŷ = b₀ + b₁ &middot; x' +
    '</div>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">ŷ (y-chapeu)</h4>' +
        '<p>O valor <strong>predito</strong> de Y para um dado X. Não é o Y real \x96 é o melhor palpite da reta.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">b₁ (inclinação)</h4>' +
        '<p>Para cada aumento de 1 unidade em X, Y muda b₁ unidades. Positivo = subida; negativo = descida.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">b₀ (intercepto)</h4>' +
        '<p>O Y predito quando X = 0. Às vezes significativo, às vezes apenas uma âncora matemática.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--thor-red)">Mínimos Quadrados</h4>' +
        '<p>O método encontra a reta que <strong>minimiza a soma dos resíduos ao quadrado</strong> \x96 as distâncias verticais entre pontos e reta.</p>' +
      '</div>' +
    '</div>' +

    '<div class="visual-container">' +
      buildScatterplot({ showLabels: false, showLine: true, showResiduals: true, xLabel: 'Distância (léguas)', yLabel: 'Barris de Hidromel' }) +
    '</div>' +

    '<p>A <span class="hl-gold">linha dourada tracejada</span> é a reta de regressão. Os <span class="hl-red">segmentos vermelhos tracejados</span> são os resíduos \x96 os erros que a reta comete para cada ponto.</p>' +

    dialogue('thor', '⚡ ThorMento', 'Por que não simplesmente ligar os pontos? Passaria por todos \x96 zero erro!') +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Porque ligar os pontos <em>sobreajusta</em> a amostra. A reta de regressão captura a <strong>tendência</strong>, não o ruído. Ela generaliza para novos dados; ligar pontos não.');
}

// ===== PASSO 8: CALCULANDO b1 E b0 =====
function step8() {
  return '<div class="step-title">Passo 8: Calculando a Inclinação (b₁) e o Intercepto (b₀)</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Hora de forjar a reta de regressão. Já calculamos as somas-chave no Passo 2. Agora vamos usá-las.') +

    '<div class="formula">' +
      '<div class="formula-label">Inclinação (b₁)</div>' +
      'b₁ = &Sigma;(x<sub>i</sub> \x96 ̄x)(y<sub>i</sub> \x96 ̄y) / &Sigma;(x<sub>i</sub> \x96 ̄x)²' +
    '</div>' +

    '<div class="formula">' +
      '<div class="formula-label">Substituindo</div>' +
      'b₁ = <span class="hl-gold">' + r(sumDxDy,2) + '</span> / <span class="hl-blue">' + r(sumDx2,2) + '</span> = <span class="hl-gold">' + r4(b1) + '</span>' +
    '</div>' +

    '<p>Interpretação: para cada légua adicional de distância, o posto comercial vende aproximadamente <span class="hl-gold">' + r(Math.abs(b1),2) + ' barris a menos</span> de hidromel.</p>' +

    '<div class="formula">' +
      '<div class="formula-label">Intercepto (b₀)</div>' +
      'b₀ = ̄Y \x96 b₁ &middot; ̄X' +
    '</div>' +

    '<div class="formula">' +
      '<div class="formula-label">Substituindo</div>' +
      'b₀ = ' + r(meanY,2) + ' \x96 (' + r4(b1) + ' &times; ' + r(meanX,2) + ') = ' + r(meanY,2) + ' \x96 (' + r(b1 * meanX,2) + ') = <span class="hl-gold">' + r4(b0) + '</span>' +
    '</div>' +

    '<div class="formula" style="font-size:1.3rem;border-color:var(--gold)">' +
      '<div class="formula-label" style="color:var(--gold)">Equação Final de Regressão</div>' +
      'ŷ = ' + r(b0,2) + ' + (' + r(b1,2) + ') &middot; x' +
    '</div>' +

    '<p class="step-subtitle">Exemplo de predição</p>' +
    '<p>Um novo posto a 20 léguas: ŷ = ' + r(b0,2) + ' + (' + r(b1,2) + ' &times; 20) = ' + r(b0,2) + ' + (' + r(b1 * 20,2) + ') = <span class="hl-gold">' + r(b0 + b1 * 20,1) + ' barris</span></p>' +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', 'O intercepto b₀ = ' + r(b0,2) + ' é a venda predita à distância zero. Embora nenhum posto real fique a 0 léguas, ele ancora a reta matematicamente. Cautela ao interpretar interceptos fora do alcance dos dados.') +

    dialogue('corvo', '🐦‍⬛ Huginn provoca:', 'E se alguém pedir para prever vendas a 50 léguas? Isso é <strong>extrapolação</strong> \x96 prever além do intervalo observado (8\x9630 léguas). A tendência linear pode não se manter tão longe. <em>Jamais extrapole às cegas.</em>');
}

// ===== PASSO 9: RESÍDUOS E R² =====
function step9() {
  return '<div class="step-title">Passo 9: Resíduos, SST, SSR, SSE e R²</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Quão boa é nossa reta? Decompomos a <strong>variação total</strong> em Y em duas partes: o que a reta <em>explica</em> e o que ela <em>erra</em>.') +

    '<table class="calc-table">' +
    '<tr><th>Posto</th><th>x</th><th>y</th><th>ŷ</th><th>Resíduo (y \x96 ŷ)</th><th>(y \x96 ŷ)²</th><th>(ŷ \x96 ̄y)²</th></tr>' +
    (function() {
      var rows = '';
      for (var i = 0; i < n; i++) {
        rows += '<tr><td>' + posts[i] + '</td><td>' + X[i] + '</td><td>' + Y[i] + '</td><td>' + r(Yhat[i],2) + '</td><td>' + r(residuals[i],2) + '</td><td>' + r(residuals[i]*residuals[i],2) + '</td><td>' + r(Math.pow(Yhat[i]-meanY,2),2) + '</td></tr>';
      }
      return rows;
    })() +
    '</table>' +

    '<div class="comparison-grid">' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--gold)">SST (Total)</div>' +
        '<div class="comparison-result" style="color:var(--gold)">' + r(SST,2) + '</div>' +
        '<div style="font-size:0.85rem;color:var(--text-dim)">&Sigma;(y<sub>i</sub> \x96 ̄y)²</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--success)">SSR (Regressão)</div>' +
        '<div class="comparison-result" style="color:var(--success)">' + r(SSR,2) + '</div>' +
        '<div style="font-size:0.85rem;color:var(--text-dim)">&Sigma;(ŷ<sub>i</sub> \x96 ̄y)²</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--thor-red)">SSE (Erro)</div>' +
        '<div class="comparison-result" style="color:var(--thor-red)">' + r(SSE,2) + '</div>' +
        '<div style="font-size:0.85rem;color:var(--text-dim)">&Sigma;(y<sub>i</sub> \x96 ŷ<sub>i</sub>)²</div>' +
      '</div>' +
    '</div>' +

    '<div class="formula">' +
      '<div class="formula-label">SST = SSR + SSE</div>' +
      r(SST,2) + ' = ' + r(SSR,2) + ' + ' + r(SSE,2) + ' &nbsp; ✓' +
    '</div>' +

    '<div class="formula" style="border-color:var(--gold)">' +
      '<div class="formula-label" style="color:var(--gold)">R² = SSR / SST</div>' +
      'R² = ' + r(SSR,2) + ' / ' + r(SST,2) + ' = <span class="hl-gold">' + r4(R2) + '</span>' +
    '</div>' +

    '<p>R² = ' + r4(R2) + ' coincide com r² = (' + r4(rPearson) + ')² = ' + r4(r2) + '. Na regressão simples, <span class="hl-gold">R² = r²</span> sempre. Essa identidade se quebra na regressão múltipla.</p>' +

    dialogue('corvo', '🐦‍⬛ Huginn provoca:', 'Os resíduos são a <em>impressão digital de tudo que o modelo perdeu</em>. Se mostram um padrão (curva, forma de leque), o modelo está errado. Dispersão aleatória = bom ajuste. Verificaremos isso a seguir.');
}

// ===== PASSO 10: PRESSUPOSTOS =====
function step10() {
  return '<div class="step-title">Passo 10: Pressupostos \x96 Os Quatro Pilares</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'A regressão é poderosa mas frágil. Ela se sustenta em quatro pilares. Se algum pilar desmorona, as inferências podem ser falácias.') +

    '<div class="concept-grid">' +
      '<div class="concept-card" style="border-color:var(--odin-blue)">' +
        '<h4 style="color:var(--odin-blue)">1. Linearidade</h4>' +
        '<p>A relação entre X e Y deve ser <strong>linear</strong>. Verifique o diagrama de dispersão e o gráfico de resíduos para curvatura.</p>' +
      '</div>' +
      '<div class="concept-card" style="border-color:var(--corvo-purple)">' +
        '<h4 style="color:var(--corvo-purple)">2. Normalidade dos Resíduos</h4>' +
        '<p>Os resíduos devem seguir uma <strong>distribuição normal</strong>. Verifique com Q-Q plot ou teste de Shapiro-Wilk. Menos crítico com n grande (TLC ajuda).</p>' +
      '</div>' +
      '<div class="concept-card" style="border-color:var(--gold)">' +
        '<h4 style="color:var(--gold)">3. Homocedasticidade</h4>' +
        '<p>A <strong>dispersão dos resíduos</strong> deve ser constante ao longo de todos os valores de X. Uma "forma de leque" no gráfico de resíduos sinaliza heterocedasticidade.</p>' +
      '</div>' +
      '<div class="concept-card" style="border-color:var(--success)">' +
        '<h4 style="color:var(--success)">4. Independência</h4>' +
        '<p>As observações devem ser <strong>independentes</strong> entre si. Violada em séries temporais, dados agrupados ou medidas repetidas.</p>' +
      '</div>' +
    '</div>' +

    dialogue('thor', '⚡ ThorMento', 'Quatro pressupostos? Só rodar a regressão e torcer pelo melhor!') +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ O que acontece quando os pressupostos falham</div>' +
      '<table class="data-table">' +
      '<tr><th>Violação</th><th>Consequência</th><th>Remédio</th></tr>' +
      '<tr><td>Não-linearidade</td><td>Estimativas enviesadas, predições ruins</td><td>Transformar variáveis, usar regressão polinomial ou não linear</td></tr>' +
      '<tr><td>Resíduos não normais</td><td>P-valores e ICs inválidos (n pequeno)</td><td>Transformar VD, usar bootstrap ou métodos não-paramétricos</td></tr>' +
      '<tr><td>Heterocedasticidade</td><td>Estimativas ineficientes, EPs errados</td><td>Mínimos quadrados ponderados, EPs robustos (HC3)</td></tr>' +
      '<tr><td>Não-independência</td><td>Erro Tipo I inflado, EPs enviesados</td><td>Modelos multinível, GEE, métodos de séries temporais</td></tr>' +
      '</table>' +
    '</div>' +

    dialogue('corvo', '🐦‍⬛ Muninn sussurra:', '<strong>L-I-N-E</strong> \x96 Linearidade, Independência, Normalidade (dos resíduos), Equivariância. Um mnemônico para lembrar os quatro pilares.') +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'Com nossos 8 pontos, testes diagnósticos formais têm poder limitado. A inspeção visual é essencial: o diagrama parece razoavelmente linear e os resíduos parecem aleatórios. Para uma dissertação, você precisaria de n > 30 e diagnósticos formais.');
}

// ===== PASSO 11: LIÇÃO DOS CORVOS =====
function step11() {
  return '<div class="step-title">Passo 11: Lição dos Corvos</div>' +

    '<div class="licao-box">' +
      '<div class="licao-title">🐦‍⬛ Lição dos Corvos: Correlação & Regressão Simples</div>' +

      dialogue('corvo', '🐦‍⬛ Muninn (Memória) resume:', '<strong>Pontos-chave deste reino:</strong>' +
        '<ul style="margin-top:8px;padding-left:20px">' +
        '<li><strong>Diagrama de dispersão primeiro</strong> \x96 sempre visualize antes de calcular.</li>' +
        '<li><strong>r de Pearson</strong> mede força e direção de uma associação <em>linear</em> (\x961 a +1).</li>' +
        '<li><strong>r²</strong> = proporção da variância em Y explicada por X.</li>' +
        '<li><strong>ρ de Spearman</strong> é a alternativa baseada em postos para dados ordinais ou padrões monotônicos não lineares.</li>' +
        '<li><strong>Regressão simples</strong>: ŷ = b₀ + b₁x prediz Y a partir de X por mínimos quadrados.</li>' +
        '<li><strong>b₁</strong> = inclinação = mudança em Y por unidade de mudança em X.</li>' +
        '<li><strong>R² = SSR/SST</strong> = fração da variância total capturada pelo modelo.</li>' +
        '<li><strong>Pressupostos (LINE)</strong>: Linearidade, Independência, Normalidade dos resíduos, Equivariância.</li>' +
        '</ul>') +

      dialogue('corvo', '🐦‍⬛ Huginn (Pensamento) provoca:', '<strong>Nunca esqueça:</strong>' +
        '<ul style="margin-top:8px;padding-left:20px">' +
        '<li>Correlação ≠ causalidade. Ponto final.</li>' +
        '<li>Os benchmarks de Cohen são diretrizes, não leis.</li>' +
        '<li>Um r "significativo" com r² minúsculo significa quase nada explicado.</li>' +
        '<li>Jamais extrapole além do intervalo observado de X.</li>' +
        '<li>Verifique os resíduos \x96 padrões significam modelo errado.</li>' +
        '</ul>') +
    '</div>' +

    '<p class="step-subtitle">Formato de Relatório APA</p>' +

    '<div class="apa-box">' +
      '<div class="apa-label">📝 Formato APA: Correlação</div>' +
      '<p>Houve uma forte correlação negativa entre a distância do posto comercial e os barris de hidromel vendidos, <em>r</em>(' + df_r + ') = ' + r(rPearson,2) + ', <em>p</em> ' + (p_r < .001 ? '< ,001' : '= ' + r(p_r,3)) + ', <em>r</em>² = ' + r(r2,2) + '.</p>' +
    '</div>' +

    '<div class="apa-box">' +
      '<div class="apa-label">📝 Formato APA: Regressão Linear Simples</div>' +
      '<p>Uma regressão linear simples foi conduzida para prever barris de hidromel vendidos a partir da distância. A distância previu significativamente as vendas de hidromel, <em>b</em> = ' + r(b1,2) + ', <em>t</em>(' + df_r + ') = ' + r(t_r,2) + ', <em>p</em> ' + (p_r < .001 ? '< ,001' : '= ' + r(p_r,3)) + '. A distância explicou ' + r(R2 * 100,1) + '% da variância nas vendas de hidromel (<em>R</em>² = ' + r(R2,2) + '). A equação de regressão foi: Hidromel Predito = ' + r(b0,2) + ' + (' + r(b1,2) + ' &times; Distância).</p>' +
    '</div>' +

    '<p class="step-subtitle">Armadilhas Comuns</p>' +

    '<div class="trap-grid">' +
      '<div class="trap-card">' +
        '<h4>⚠️ Correlação = Causalidade</h4>' +
        '<p>A armadilha mais comum. Correlação identifica associação, não direção causal. Terceiras variáveis e causalidade reversa espreitam por toda parte.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Ignorar outliers</h4>' +
        '<p>Um único outlier pode inflar ou destruir o r. Sempre inspecione o diagrama de dispersão e considere alternativas robustas.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Extrapolação</h4>' +
        '<p>Prever além do intervalo observado de X assume que a tendência linear continua para sempre. Raramente continua.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Restrição de amplitude</h4>' +
        '<p>Se sua amostra cobre uma faixa estreita de X, r será artificialmente baixo. Amplitude completa = retrato completo.</p>' +
      '</div>' +
    '</div>' +

    '<div class="comparison-grid" style="margin-top:24px">' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--odin-blue)">Pearson r</div>' +
        '<div class="comparison-result" style="color:var(--odin-blue)">' + r4(rPearson) + '</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--corvo-purple)">Spearman ρ</div>' +
        '<div class="comparison-result" style="color:var(--corvo-purple)">' + r4(rhoSpearman) + '</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--gold)">R²</div>' +
        '<div class="comparison-result" style="color:var(--gold)">' + r4(R2) + '</div>' +
      '</div>' +
    '</div>' +

    dialogue('odin', '🧙‍♂️ Odin Dinho', 'A guilda dos mercadores agora sabe: distância e vendas estão fortemente ligadas, com cada légua custando cerca de ' + r(Math.abs(b1),1) + ' barris. Mas são sábios o suficiente para saber que isso é associação \x96 não prova de que mudar um posto para mais perto aumentará as vendas. Para isso, precisariam de um experimento. Rumo ao próximo reino!');
}

// ===== REGISTRO DE PASSOS =====
var stepFunctions = [step0, step1, step2, step3, step4, step5, step6, step7, step8, step9, step10, step11];

var stepNames = [
  'Introdução',
  'Diagrama de Dispersão',
  'r de Pearson',
  'Interpretando r',
  'r-Quadrado',
  'Teste de Significância',
  'ρ de Spearman',
  'Regressão Simples',
  'Inclinação & Intercepto',
  'Resíduos & R²',
  'Pressupostos',
  'Lição dos Corvos'
];

// ===== NAVEGAÇÃO =====
function renderStep() {
  var content = document.getElementById('stepContent');
  content.innerHTML = stepFunctions[currentStep]();
  content.style.animation = 'none';
  content.offsetHeight;
  content.style.animation = 'fadeIn 0.4s ease';

  document.getElementById('progressLabel').textContent = 'Passo ' + currentStep + ' de ' + (totalSteps - 1) + ' — ' + stepNames[currentStep];
  document.getElementById('progressFill').style.width = (currentStep / (totalSteps - 1) * 100) + '%';

  document.getElementById('btnBack').disabled = currentStep === 0;
  document.getElementById('btnNext').textContent = currentStep === totalSteps - 1 ? 'Reiniciar ↻' : 'Próximo ▶';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  if (currentStep >= totalSteps - 1) {
    currentStep = 0;
  } else {
    currentStep++;
  }
  renderStep();
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

// Navegação por teclado
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
});

// Inicializar
renderStep();
</script>
</body>
</html>
