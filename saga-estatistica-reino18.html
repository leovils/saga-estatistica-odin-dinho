<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Saga Estatística de Odin Dinho — Reino 18: Introdução à Inferência Bayesiana</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#0d1117;--bg-card:#161b22;--bg-panel:#1c2333;--odin-blue:#58a6ff;--thor-red:#f85149;--corvo-purple:#bc8cff;--gold:#f0c040;--silver:#8b949e;--text:#e6edf3;--text-dim:#8b949e;--success:#3fb950;--border:#30363d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-dark);color:var(--text);font-family:'Patrick Hand',cursive;font-size:18px;min-height:100vh;overflow-x:hidden}
#game-container{max-width:800px;margin:0 auto;padding:20px;min-height:100vh}
.title-screen{text-align:center;padding:60px 20px;animation:fadeIn 1s ease}
.title-screen h1{font-family:'Bangers',cursive;font-size:2.8em;color:var(--gold);text-shadow:2px 2px 8px rgba(240,192,64,.3);line-height:1.1;margin-bottom:8px}
.title-screen h2{font-family:'Permanent Marker',cursive;font-size:1.5em;color:var(--odin-blue);margin-bottom:30px}
.title-screen .subtitle{color:var(--text-dim);font-size:1.1em;margin-bottom:40px}
.reino-badge{display:inline-block;background:linear-gradient(135deg,var(--odin-blue),var(--corvo-purple));padding:6px 20px;border-radius:20px;font-family:'Bangers',cursive;font-size:1em;color:#fff;margin-bottom:16px}
.difficulty-select{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.diff-btn{background:var(--bg-card);border:2px solid var(--border);color:var(--text);font-family:'Bangers',cursive;font-size:1.2em;padding:16px 32px;border-radius:12px;cursor:pointer;transition:all .3s;min-width:180px}
.diff-btn:hover{border-color:var(--odin-blue);transform:translateY(-2px)}
.diff-btn .diff-label{font-size:1.3em}.diff-btn .diff-desc{font-family:'Patrick Hand',cursive;font-size:.65em;color:var(--text-dim);margin-top:4px}
.scene{animation:slideIn .5s ease;padding:10px 0}
.dialogue-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;position:relative}
.dialogue-box.odin{border-left:4px solid var(--odin-blue)}.dialogue-box.thor{border-left:4px solid var(--thor-red)}.dialogue-box.corvo{border-left:4px solid var(--corvo-purple)}.dialogue-box.narrator{border-left:4px solid var(--gold)}
.char-name{font-family:'Bangers',cursive;font-size:1.1em;margin-bottom:6px}
.char-name.odin{color:var(--odin-blue)}.char-name.thor{color:var(--thor-red)}.char-name.corvo{color:var(--corvo-purple)}.char-name.narrator{color:var(--gold)}
.dialogue-text{line-height:1.5;font-size:1.05em}.dialogue-text em{color:var(--gold);font-style:normal;font-weight:bold}
.challenge-box{background:var(--bg-panel);border:2px solid var(--gold);border-radius:12px;padding:24px;margin:20px 0;animation:pulse-border 2s ease infinite}
@keyframes pulse-border{0%,100%{border-color:var(--gold);box-shadow:0 0 8px rgba(240,192,64,.15)}50%{border-color:#f0c040cc;box-shadow:0 0 16px rgba(240,192,64,.3)}}
.challenge-title{font-family:'Bangers',cursive;font-size:1.4em;color:var(--gold);margin-bottom:12px;text-align:center}
.challenge-question{margin-bottom:16px;line-height:1.5}
.data-display{background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0;font-family:'Courier New',monospace;font-size:1em;color:var(--odin-blue);text-align:center;letter-spacing:1px;line-height:1.6}
.options-grid{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.option-btn{background:var(--bg-card);border:2px solid var(--border);color:var(--text);font-family:'Patrick Hand',cursive;font-size:1.05em;padding:14px 18px;border-radius:10px;cursor:pointer;text-align:left;transition:all .25s;line-height:1.4}
.option-btn:hover:not(.disabled){border-color:var(--odin-blue);background:#1a2233}
.option-btn.correct{border-color:var(--success);background:#0d2818;color:var(--success)}
.option-btn.wrong{border-color:var(--thor-red);background:#2d1116;color:var(--thor-red)}
.option-btn.disabled{cursor:default;opacity:.7}
.feedback-box{border-radius:10px;padding:16px 20px;margin:16px 0;animation:fadeIn .4s ease;line-height:1.5}
.feedback-box.correct{background:#0d2818;border:1px solid var(--success);color:var(--success)}
.feedback-box.wrong{background:#2d1116;border:1px solid var(--thor-red);color:var(--thor-red)}
.xp-badge{display:inline-block;background:var(--gold);color:var(--bg-dark);font-family:'Bangers',cursive;padding:2px 10px;border-radius:6px;font-size:.9em;margin-left:6px}
.xp-bar-container{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.xp-label{font-family:'Bangers',cursive;color:var(--gold);font-size:1em;white-space:nowrap}
.xp-bar-bg{flex:1;height:14px;background:var(--bg-dark);border-radius:7px;overflow:hidden}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--odin-blue),var(--gold));border-radius:7px;transition:width .6s ease}
.xp-count{font-family:'Bangers',cursive;color:var(--text);font-size:1em;min-width:60px;text-align:right}
.continue-btn{display:block;margin:20px auto 0;background:transparent;border:2px solid var(--odin-blue);color:var(--odin-blue);font-family:'Bangers',cursive;font-size:1.15em;padding:12px 36px;border-radius:10px;cursor:pointer;transition:all .25s}
.continue-btn:hover{background:var(--odin-blue);color:var(--bg-dark)}
.result-screen{text-align:center;padding:40px 20px;animation:fadeIn .8s ease}
.result-screen h2{font-family:'Bangers',cursive;font-size:2.2em;color:var(--gold);margin-bottom:8px}
.result-rank{font-family:'Permanent Marker',cursive;font-size:1.5em;margin:16px 0}
.result-stats{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin:20px 0;text-align:left}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--text-dim)}.stat-value{font-family:'Bangers',cursive;color:var(--odin-blue)}
.hint-box{background:#1a1530;border:1px solid var(--corvo-purple);border-radius:10px;padding:14px 18px;margin:12px 0;font-size:.95em;color:var(--corvo-purple);animation:fadeIn .5s ease}
.hint-box .hint-label{font-family:'Bangers',cursive;font-size:1em;margin-bottom:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.title-screen h1{font-size:2em}.title-screen h2{font-size:1.2em}.difficulty-select{flex-direction:column;align-items:center}#game-container{padding:12px}.challenge-box{padding:16px}}

/* ── ARMOR SYSTEM ── */
.armor-panel{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px}
.viking-mini{position:relative;width:120px;height:180px;flex-shrink:0}
.vm-head{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:#d4a574;border:1.5px solid #b8956a;z-index:5}
.vm-torso{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:44px;height:58px;background:#8b7355;border-radius:7px 7px 4px 4px;z-index:3}
.vm-arm-l{position:absolute;top:59px;left:18px;width:14px;height:34px;background:#8b7355;border-radius:5px;z-index:2}
.vm-arm-r{position:absolute;top:59px;right:18px;width:14px;height:34px;background:#8b7355;border-radius:5px;z-index:2}
.vm-leg-l{position:absolute;top:111px;left:40px;width:16px;height:42px;background:#6b5b43;border-radius:0 0 4px 4px;z-index:2}
.vm-leg-r{position:absolute;top:111px;right:40px;width:16px;height:42px;background:#6b5b43;border-radius:0 0 4px 4px;z-index:2}
.vm-slot{position:absolute;opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1);transform:scale(.3)}
.vm-slot.on{opacity:1;transform:scale(1)}
.vm-helm{top:16px;left:50%;transform:translateX(-50%) scale(.3);z-index:8}.vm-helm.on{transform:translateX(-50%) scale(1)}
.vm-mail{top:57px;left:50%;transform:translateX(-50%) scale(.3);z-index:4}.vm-mail.on{transform:translateX(-50%) scale(1)}
.vm-cape{top:53px;left:50%;transform:translateX(-50%) scale(.3);z-index:1}.vm-cape.on{transform:translateX(-50%) scale(1)}
.vm-left{top:66px;left:0;z-index:7}.vm-right{top:56px;right:0;z-index:7}
.vm-boots{bottom:4px;left:50%;transform:translateX(-50%) scale(.3);z-index:7;display:flex;gap:10px}.vm-boots.on{transform:translateX(-50%) scale(1)}
.gear-progress{flex:1;display:flex;flex-direction:column;gap:4px}
.gp-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:.8em;color:var(--text-dim);transition:all .3s}
.gp-row.earned{color:var(--success);font-weight:bold}
.gp-row .gp-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:all .3s;flex-shrink:0}
.gp-row.earned .gp-dot{background:var(--success);border-color:var(--success)}
.vm-sparks{position:absolute;pointer-events:none;z-index:20}
.vm-spark{position:absolute;border-radius:50%;animation:vmSp .6s ease-out forwards}
@keyframes vmSp{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
.vm-flash{animation:vmFl .4s ease}
@keyframes vmFl{0%{filter:brightness(1)}30%{filter:brightness(1.8) drop-shadow(0 0 12px rgba(240,180,40,.6))}100%{filter:brightness(1)}}
.result-viking{position:relative;width:160px;height:240px;margin:16px auto}
.rv-head{position:absolute;top:36px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:#d4a574;border:2px solid #b8956a;z-index:5}
.rv-torso{position:absolute;top:73px;left:50%;transform:translateX(-50%);width:56px;height:74px;background:#8b7355;border-radius:9px 9px 5px 5px;z-index:3}
.rv-arm-l{position:absolute;top:77px;left:22px;width:18px;height:44px;background:#8b7355;border-radius:6px;z-index:2}
.rv-arm-r{position:absolute;top:77px;right:22px;width:18px;height:44px;background:#8b7355;border-radius:6px;z-index:2}
.rv-leg-l{position:absolute;top:144px;left:52px;width:20px;height:54px;background:#6b5b43;border-radius:0 0 5px 5px;z-index:2}
.rv-leg-r{position:absolute;top:144px;right:52px;width:20px;height:54px;background:#6b5b43;border-radius:0 0 5px 5px;z-index:2}
.rv-slot{position:absolute}
.rv-helm{top:20px;left:50%;transform:translateX(-50%);z-index:8}
.rv-mail{top:74px;left:50%;transform:translateX(-50%);z-index:4}
.rv-cape{top:69px;left:50%;transform:translateX(-50%);z-index:1}
.rv-left{top:86px;left:4px;z-index:7}.rv-right{top:72px;right:4px;z-index:7}
.rv-boots{bottom:4px;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:14px}
@media(max-width:600px){.armor-panel{flex-direction:column;align-items:center}.viking-mini{width:100px;height:160px}}
footer{text-align:center;padding:24px 12px;color:var(--text-dim);font-size:.85em;border-top:1px solid var(--border);margin-top:40px}
footer a{color:var(--odin-blue);text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>

<div id="game-container"><div id="game-content"></div></div>
<footer>

</footer>
<script>
// ════════════════════════════════════════════════════
// A SAGA ESTATÍSTICA DE ODIN DINHO — REINO 18
// INTRODUÇÃO À INFERÊNCIA BAYESIANA
// ════════════════════════════════════════════════════
const GAME={difficulty:null,xp:0,maxXP:0,hits:0,total:0,currentScene:0,scenes:[]};
const content=()=>document.getElementById('game-content');
function dialogue(c,t){
  const cls={odin:'odin',thor:'thor',muninn:'corvo',huginn:'corvo',narrator:'narrator'};
  const nm={odin:'Odin Dinho \u{1F6E1}️',thor:'ThorMento ⚡',muninn:'Muninn \u{1F426}‍⬛',huginn:'Huginn \u{1F426}',narrator:'\u{1F4DC} Narrador'};
  return '<div class="dialogue-box '+( cls[c]||'narrator')+'"><div class="char-name '+(cls[c]||'narrator')+'">'+(nm[c]||c)+'</div><div class="dialogue-text">'+t+'</div></div>';
}
function hintBox(t){return '<div class="hint-box"><div class="hint-label">\u{1F426}‍⬛ Dica de Muninn</div>'+t+'</div>';}
function xpBar(){
  var p=GAME.maxXP>0?Math.round((GAME.xp/GAME.maxXP)*100):0;
  return armorPanelHTML()+'<div class="xp-bar-container"><div class="xp-label">⚡ XP</div><div class="xp-bar-bg"><div class="xp-bar-fill" style="width:'+p+'%"></div></div><div class="xp-count">'+GAME.xp+' / '+GAME.maxXP+'</div></div>';
}
function updateXPBar(){
  var b=document.querySelector('.xp-bar-fill'),c=document.querySelector('.xp-count');
  if(b&&c){var p=GAME.maxXP>0?Math.round((GAME.xp/GAME.maxXP)*100):0;b.style.width=p+'%';c.textContent=GAME.xp+' / '+GAME.maxXP;}
}
function showTitleScreen(){
  content().innerHTML='<div class="title-screen"><div class="reino-badge">REINO 18</div><h1>A Saga Estatística de Odin Dinho</h1><h2>Reino da Inferência Bayesiana</h2><p class="subtitle">Nas profundezas de Mímisbrunnr, o Poço da Sabedoria, Odin Dinho ensina a arte de atualizar crenças — combinando conhecimento prévio com evidência nova para alcançar a posterior.</p><div class="difficulty-select"><button class="diff-btn" onclick="startGame(\'aprendiz\')"><div class="diff-label">\u{1F6E1}️ Aprendiz</div><div class="diff-desc">Graduação — com dicas de Muninn</div></button><button class="diff-btn" onclick="startGame(\'mestre\')"><div class="diff-label">⚔️ Mestre</div><div class="diff-desc">Pós-graduação — sem dicas, desafios extras</div></button></div></div>';
}
function startGame(d){
  GAME.difficulty=d;GAME.xp=0;GAME.hits=0;GAME.total=0;GAME.currentScene=0;gearEarned=0;
  buildScenes();GAME.maxXP=countMaxXP();renderScene();
}

// ════════════════════════════════════════════════════
function buildScenes(){
  GAME.scenes=[];

  // ━━ CENA 1: Chegada ao Oráculo de Mímisbrunnr ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+
    dialogue('narrator','Uma luz prateada emana das profundezas de <em>Mímisbrunnr</em> — o Poço da Sabedoria, onde Odin sacrificou um olho para enxergar além do visível. Aqui, o conhecimento não nasce do nada: ele é <em>atualizado</em>. O que você já sabia (a priori) se mistura com o que os dados revelam (verossimilhança) para gerar uma visão mais nítida (a posteriori).')+
    dialogue('odin','A inferência bayesiana é a arte de <em>combinar conhecimento prévio com evidência nova</em>. Não partimos do zero — partimos do que já sabemos e atualizamos nossas crenças conforme os dados chegam. A fórmula é elegante:')+
    '<div class="data-display">Teorema de Bayes:<br>P(θ|y) ∝ P(y|θ) × P(θ)<br><br>Posterior ∝ Verossimilhança × Priori</div>'+
    dialogue('thor','Priori? Isso é chute! Eu só confio nos dados puros!')+
    dialogue('odin','A priori não é chute — é <em>conhecimento acumulado</em>. Estudos anteriores, teoria, expertise de domínio. E a beleza do Bayes: com dados suficientes, a posterior converge para a mesma resposta independentemente da priori. Os dados dominam!')+
    '<button class="continue-btn" onclick="nextScene()">Beber do Poço da Sabedoria →</button></div>';}});

  // ━━ CENA 2: Os Três Componentes ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+
    dialogue('odin','Três componentes formam a receita bayesiana:<br><br>• <em>Priori P(θ)</em> — o que sabíamos antes dos dados. Pode ser informativa (baseada em estudos), fracamente informativa, ou difusa.<br>• <em>Verossimilhança P(y|θ)</em> — o que os dados dizem. Quantifica o suporte que os dados dão a cada valor do parâmetro.<br>• <em>Posterior P(θ|y)</em> — a crença atualizada. Combina priori + verossimilhança.')+
    dialogue('muninn','Pense em misturar duas águas: a água da memória (priori) com a água da evidência (verossimilhança). A mistura resultante é a posterior — mais clara que qualquer uma sozinha.')+
    dialogue('huginn','Atenção: não existe priori "não-informativa". Até uma priori flat (uniforme) carrega informação — ela diz que todos os valores são igualmente prováveis, o que raramente é verdade. O termo correto é <em>difusa</em>.')+
    '<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';}});

  // ━━ CENA 3: DESAFIO 1 — O que a priori representa? ━━
  GAME.scenes.push({type:'challenge',html:function(){
    var hint=GAME.difficulty==='aprendiz'?hintBox('A priori vem <em>antes</em> dos dados. Representa nosso estado de conhecimento inicial sobre o parâmetro.'):'';
    return '<div class="scene">'+xpBar()+
      '<div class="challenge-box"><div class="challenge-title">⚔️ Desafio 1: A Fonte do Conhecimento</div>'+
      '<div class="challenge-question">No arcabouço bayesiano, o que a <em>distribuição a priori</em> representa?</div>'+hint+
      '<div class="options-grid" id="q1-opts">'+
      '<button class="option-btn" onclick="checkQ(1,this,\'a\')">O resultado final da análise após observar os dados — a priori resume o que concluímos ao término da modelagem bayesiana</button>'+
      '<button class="option-btn" onclick="checkQ(1,this,\'b\')">Uma distribuição auxiliar que só existe quando não temos dados — se houver dados disponíveis, a priori deixa de ser necessária</button>'+
      '<button class="option-btn" onclick="checkQ(1,this,\'c\')">A probabilidade de os dados serem significativos (p-value) calculada antes de rodar o modelo — funciona como filtro inicial</button>'+
      '<button class="option-btn" onclick="checkQ(1,this,\'d\')">Nosso conhecimento ou crença sobre o parâmetro <em>antes</em> de observar os dados atuais — baseado em estudos anteriores, teoria ou expertise de domínio</button>'+
      '</div><div id="q1-fb"></div></div></div>';}});

  // ━━ CENA 4: Tipos de Prioris ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+xpBar()+
    dialogue('odin','Tipos de priori — cada uma tem seu lugar:<br><br>• <em>Informativa</em> — baseada em estudos anteriores. Ex: β_age ~ N(2.5, 5). Concentra a distribuição perto de valores plausíveis.<br>• <em>Fracamente informativa</em> — restringe valores absurdos sem forçar muito. Ex: N(0, 10).<br>• <em>Difusa</em> — espalha probabilidade amplamente. Ex: N(0, 1000). Cuidado: <em>não</em> é "não-informativa"!')+
    dialogue('muninn','Regra de ouro: com <em>amostras pequenas</em>, a priori pesa mais na posterior. Com <em>amostras grandes</em>, os dados dominam e a priori quase desaparece. Por isso a escolha da priori é crítica quando n é pequeno!')+
    dialogue('thor','Então com muitos dados eu posso ignorar a priori?')+
    dialogue('odin','Quase. Com n grande, prioris diferentes convergem para a mesma posterior. Mas com n pequeno, a priori pode mudar o resultado completamente. É por isso que fazemos <em>análise de sensibilidade</em>!')+
    '<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';}});

  // ━━ CENA 5: DESAFIO 2 — Amostra pequena e priori ━━
  GAME.scenes.push({type:'challenge',html:function(){
    var hint=GAME.difficulty==='aprendiz'?hintBox('Com amostra muito pequena, os dados têm pouca força para "mover" a posterior. Quem domina?'):'';
    return '<div class="scene">'+xpBar()+
      '<div class="challenge-box"><div class="challenge-title">⚔️ Desafio 2: O Peso do Passado</div>'+
      '<div class="challenge-question">Com uma amostra muito pequena (n = 10) e uma priori informativa, o que <em>domina</em> a distribuição posterior?</div>'+
      '<div class="data-display">n = 10 | Priori: N(2.5, 5) informativa<br>Posterior = ?</div>'+hint+
      '<div class="options-grid" id="q2-opts">'+
      '<button class="option-btn" onclick="checkQ(2,this,\'a\')">A verossimilhança sempre domina, independente do tamanho da amostra — os dados observados sempre superam qualquer crença prévia</button>'+
      '<button class="option-btn" onclick="checkQ(2,this,\'b\')">A priori domina — com poucos dados, não há evidência suficiente para "mover" a posterior para longe da priori</button>'+
      '<button class="option-btn" onclick="checkQ(2,this,\'c\')">Nenhum dos dois domina — a posterior divide o peso igualmente entre priori e verossimilhança, sempre numa razão 50/50</button>'+
      '<button class="option-btn" onclick="checkQ(2,this,\'d\')">O p-value determina quem domina — quando p &lt; 0.05 a verossimilhança prevalece, e quando p &gt; 0.05 a priori prevalece</button>'+
      '</div><div id="q2-fb"></div></div></div>';}});

  // ━━ CENA 6: Prior Predictive Check e WAMBS ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+xpBar()+

    dialogue('muninn','Cuidado com a armadilha <em>precisão vs variância</em>! Alguns softwares usam precisão (1/variância) como parâmetro. Se você especifica variância = 0.2 pensando que é "ampla", mas o software interpreta como precisão = 0.2 (variância = 5), o resultado muda drasticamente.')+
    dialogue('huginn','O checklist <em>WAMBS</em> (When to worry And how to Manage Bayesian Statistics) de Van de Schoot et al. (2021) é essencial. Ele cobre: verificar prioris, checar convergência, análise de sensibilidade, e garantir que os resultados são confiáveis.')+
    '<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';}});

  // ━━ CENA 7: DESAFIO 3 — Armadilha de precisão ━━
  GAME.scenes.push({type:'challenge',html:function(){

  // ━━ CENA 8: MCMC ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+xpBar()+

    dialogue('muninn','Diagnósticos essenciais de MCMC:<br><br>• <em>Trace plots</em> — as cadeias devem parecer "grama" (caterpillar plots), não tendências<br>• <em>R-hat (R̂)</em> — deve ser < 1.01 para indicar convergência<br>• <em>Warm-up (burn-in)</em> — descartar as primeiras amostras antes da convergência<br>• <em>Multiple chains</em> — rodar 3-4 cadeias e verificar se concordam')+
    dialogue('thor','Parece complicado demais. Onde é que roda isso?')+
    dialogue('odin','Softwares como <em>Stan, BRMS, JAGS</em> e o pacote <em>brms</em> do R fazem o trabalho pesado. Você especifica o modelo e as prioris, o software faz o MCMC.')+

  // ━━ CENA 9: DESAFIO 4 — Trace plot com falha ━━

      '<div class="data-display">Chain 1: ██░█░██░█ (explorando)<br>Chain 2: ░██░█░██░ (explorando)<br>Chain 3: █████████ (constante!)<br>Chain 4: █░██░█░██ (explorando)</div>'+hint+
      '<div class="options-grid" id="q4-opts">'+
      '<button class="option-btn" onclick="checkQ(4,this,\'a\')">Tudo normal — cada cadeia explora uma região diferente do espaço amostral, e comportamentos distintos entre cadeias indicam boa cobertura da posterior</button>'+
      '<button class="option-btn" onclick="checkQ(4,this,\'b\')">A cadeia 3 encontrou o valor verdadeiro do parâmetro e se estabilizou nele, enquanto as outras ainda estão explorando regiões subótimas</button>'+
      '<button class="option-btn" onclick="checkQ(4,this,\'c\')">Falha de convergência — a cadeia ficou presa em um máximo local. O R-hat será > 1.01 e os resultados não são confiáveis. Deve-se aumentar o warm-up, reparametrizar o modelo ou usar prioris mais informativas</button>'+
      '<button class="option-btn" onclick="checkQ(4,this,\'d\')">O modelo precisa de mais variáveis preditoras para estabilizar as cadeias — a falta de preditores causa instabilidade no MCMC</button>'+

  // ━━ CENA 10: Intervalos de Credibilidade e Bayes Factor ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+xpBar()+

    dialogue('muninn','<em>Bayes Factor (BF)</em> — a razão de evidência entre dois modelos:<br><br>• BF₁₀ = 1–3: Evidência anecótica<br>• BF₁₀ = 3–10: Evidência moderada<br>• BF₁₀ = 10–30: Evidência forte<br>• BF₁₀ = 30–100: Evidência muito forte<br>• BF₁₀ > 100: Evidência extrema')+
    dialogue('huginn','O BF também pode apoiar H₀! Se BF₁₀ = 0.05, então BF₀₁ = 20 — evidência forte <em>a favor</em> da hipótese nula. Isso é impossível no NHST!')+
    '<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';}});

  // ━━ CENA 11: DESAFIO 5 — Intervalo de Credibilidade ━━

      '<div class="challenge-box"><div class="challenge-title">⚔️ Desafio 5: A Linguagem da Probabilidade</div>'+

      '<div class="options-grid" id="q5-opts">'+
      '<button class="option-btn" onclick="checkQ(5,this,\'a\')">Se repetirmos o estudo muitas vezes, 95% dos intervalos conterão o valor verdadeiro — essa é a definição universal de intervalo de 95%</button>'+
      '<button class="option-btn" onclick="checkQ(5,this,\'b\')">Há 95% de probabilidade de que β esteja entre 0.8 e 3.2, dados os dados observados e a priori utilizada</button>'+
      '<button class="option-btn" onclick="checkQ(5,this,\'c\')">O parâmetro verdadeiro está com certeza absoluta entre 0.8 e 3.2 — o intervalo bayesiano garante a localização exata</button>'+
      '<button class="option-btn" onclick="checkQ(5,this,\'d\')">O p-value para β é menor que 0.05, pois o intervalo de credibilidade que exclui zero equivale a rejeitar H₀</button>'+
      '</div><div id="q5-fb"></div></div></div>';}});

  // ━━ CENA 12: DESAFIO 6 — Bayes Factor ━━
  GAME.scenes.push({type:'challenge',html:function(){
    var hint=GAME.difficulty==='aprendiz'?hintBox('BF₁₀ > 10 indica evidência forte. O BF quantifica <em>quantas vezes</em> os dados são mais prováveis sob H₁ do que sob H₀.'):'';

  // ━━ CENA 13: DESAFIO 7 — Análise de Sensibilidade ━━

      '<button class="option-btn" onclick="checkQ(7,this,\'d\')">Abandonar a abordagem bayesiana e usar NHST — se as prioris geram instabilidade, o frequentismo elimina essa fonte de incerteza</button>'+
      '</div><div id="q7-fb"></div></div></div>';}});

  // ━━ CENAS MESTRE ━━
  if(GAME.difficulty==='mestre'){

  // ━━ CENA 14 (MESTRE): DESAFIO 8 — Desenhar análise bayesiana ━━
  GAME.scenes.push({type:'challenge',html:function(){
    return '<div class="scene">'+xpBar()+
      '<div class="challenge-box"><div class="challenge-title">⚔️ Desafio 8: O Projeto do Oráculo (MESTRE)</div>'+

      '<div class="data-display">N = 333 | y = atraso (meses) | x = idade<br>Modelo: y = β₀ + β₁×Age + β₂×Age² + ε<br>Evidência prévia: β_age ≈ 2.5</div>'+

      '<button class="option-btn" onclick="checkQ(8,this,\'a\')">Priori difusa N(0, 1000) para todos os parâmetros — deixar os dados falarem livremente sem impor qualquer conhecimento anterior, pois com n = 333 a amostra é grande o suficiente</button>'+

      '<button class="option-btn" onclick="checkQ(8,this,\'d\')">Priori informativa β_age ~ N(2.5, 5) baseada em estudos anteriores, prioris fracamente informativas para os demais parâmetros, prior predictive check, MCMC com 4 cadeias, verificar R-hat < 1.01 e trace plots, análise de sensibilidade</button>'+

  // ━━ CENA 15 (MESTRE): DESAFIO 9 — Identificar problemas ━━
  GAME.scenes.push({type:'challenge',html:function(){
    return '<div class="scene">'+xpBar()+
      '<div class="challenge-box"><div class="challenge-title">⚔️ Desafio 9: O Auditor do Oráculo (MESTRE)</div>'+
      '<div class="challenge-question">Um artigo reporta uma análise bayesiana assim: "Usamos prioris não-informativas. O MCMC rodou com 1 cadeia e 500 iterações. O intervalo de credibilidade de 95% para β é [0.5, 2.3]." Quais problemas você identifica?</div>'+
      '<div class="data-display">Problemas reportados:<br>1. "Prioris não-informativas"<br>2. 1 cadeia, 500 iterações<br>3. Sem trace plots ou R-hat<br>4. Sem análise de sensibilidade</div>'+
      '<div class="options-grid" id="q9-opts">'+
      '<button class="option-btn" onclick="checkQ(9,this,\'a\')">Não há problemas — a análise está adequada porque prioris difusas delegam toda influência aos dados, uma cadeia bem calibrada com 500 iterações é suficiente para modelos simples, e o intervalo de credibilidade reportado confirma que o modelo convergiu adequadamente</button>'+
      '<button class="option-btn" onclick="checkQ(9,this,\'b\')">Apenas o número de iterações é baixo, o resto está OK — basta aumentar para 2000 iterações e manter a cadeia única, pois uma cadeia é suficiente quando a priori é difusa. A análise de sensibilidade é dispensável com prioris que não influenciam o resultado</button>'+

      '<button class="option-btn" onclick="checkQ(9,this,\'d\')">O único problema é a terminologia: "não-informativa" deveria ser "difusa" — corrigido o termo, a análise com 1 cadeia e 500 iterações fica adequada, pois a convergência pode ser verificada visualmente no trace plot de uma única cadeia</button>'+
      '</div><div id="q9-fb"></div></div></div>';}});

  }// fim mestre

  // ━━ CENA FINAL: Lição dos Corvos ━━
  GAME.scenes.push({type:'narrative',html:function(){return '<div class="scene">'+xpBar()+
    dialogue('narrator','A luz prateada de Mímisbrunnr pulsa mais forte. O estudante emergiu com uma nova visão — a visão bayesiana. A priori, a verossimilhança e a posterior dançam juntas em harmonia, guiadas pelo MCMC e validadas pelo checklist WAMBS.')+
    dialogue('odin','Você conquistou o <em>Reino da Inferência Bayesiana</em>! A arte de atualizar crenças com evidência é uma das mais poderosas da estatística moderna.')+
    dialogue('thor','Tá, admito... essa coisa de combinar priori com dados tem seu charme. Mas eu ainda prefiro força bruta!')+
    dialogue('muninn','<strong>Lição dos Corvos — Muninn resume:</strong><br>• Posterior ∝ Verossimilhança × Priori<br>• Prioris: informativa, fracamente informativa, difusa (NUNCA "não-informativa")<br>• Prior predictive check: simule dados para validar prioris<br>• MCMC: trace plots, R-hat < 1.01, múltiplas cadeias<br>• Intervalo de credibilidade = probabilidade direta<br>• Bayes Factor: quantifica evidência para/contra H₀')+
    dialogue('huginn','<strong>Lição dos Corvos — Huginn desafia:</strong><br>• Sempre faça análise de sensibilidade!<br>• Cuidado: precisão ≠ variância nos softwares<br>• Siga o checklist WAMBS<br>• Com amostra pequena, a priori domina — justifique-a bem<br>• O BF pode apoiar H₀ — algo impossível no NHST!')+
    '<button class="continue-btn" onclick="showResults()">Ver Resultado Final ⚔️</button></div>';}});
}

var ANSWERS={1:'d',2:'b',3:'a',4:'c',5:'b',6:'a',7:'c',8:'d',9:'c'};
var EXPLANATIONS={
  1:{correct:'✅ Perfeito! A distribuição a priori representa nosso <em>conhecimento ou crença sobre o parâmetro antes de observar os dados atuais</em>. Pode ser baseada em estudos anteriores, teoria ou expertise de domínio.',wrong:'❌ A priori representa nosso conhecimento <em>antes</em> dos dados atuais — estudos anteriores, teoria, expertise. Não é o resultado final (posterior) nem o p-value.',charC:'odin',charW:'thor'},
  2:{correct:'✅ Exato! Com amostra pequena (n = 10), não há evidência suficiente para "mover" a posterior para longe da priori. A <em>priori domina</em>. Com amostras grandes, os dados dominam e diferentes prioris convergem para a mesma posterior.',wrong:'❌ Com n = 10 e priori informativa, a <em>priori domina</em> a posterior. A verossimilhança só domina com amostras grandes.',charC:'muninn',charW:'thor'},
  3:{correct:'✅ Pegou a armadilha! Confundir precisão com variância muda a priori completamente. A variância real fica 1/0.2 = 5 (muito difusa) em vez de 0.2 (bastante informativa). <em>WAMBS recomenda: sempre verifique a parametrização do software!</em>',wrong:'❌ Precisão = 1/variância. Se o software usa precisão = 0.2, a variância real é 5 — muito diferente de 0.2! Isso transforma uma priori informativa em difusa.',charC:'huginn',charW:'thor'},

  6:{correct:'✅ Interpretação impecável! BF₁₀ = 15.3 significa que os dados são <em>15.3 vezes mais prováveis</em> sob H₁ do que sob H₀. Na escala de Jeffreys, 10–30 = evidência <em>forte</em> a favor de H₁.',wrong:'❌ BF₁₀ = 15.3 significa que os dados são 15.3 vezes mais prováveis sob H₁. Não é uma probabilidade de H₁ ser verdadeira, nem um p-value. Na escala de Jeffreys: <em>evidência forte</em>.',charC:'muninn',charW:'thor'},

function checkQ(q,btn,ans){
  var opts=document.querySelectorAll('#q'+q+'-opts .option-btn');
  opts.forEach(function(b){b.classList.add('disabled');b.onclick=null;});
  var fb=document.getElementById('q'+q+'-fb'),cor=ANSWERS[q],exp=EXPLANATIONS[q];
  GAME.total++;
  if(ans===cor){
    btn.classList.add('correct');GAME.hits++;GAME.xp+=20;updateXPBar();earnGear();
    fb.innerHTML='<div class="feedback-box correct">'+dialogue(exp.charC,exp.correct+' <span class="xp-badge">+20 XP</span>')+'<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';
  }else{
    btn.classList.add('wrong');
    var ci=['a','b','c','d'].indexOf(cor);if(opts[ci])opts[ci].classList.add('correct');
    fb.innerHTML='<div class="feedback-box wrong">'+dialogue(exp.charW,exp.wrong)+'<button class="continue-btn" onclick="nextScene()">Continuar →</button></div>';
  }
}

function countMaxXP(){return (GAME.difficulty==='mestre'?9:7)*20;}
function renderScene(){if(GAME.currentScene<GAME.scenes.length){content().innerHTML=GAME.scenes[GAME.currentScene].html();restoreGear();window.scrollTo({top:0,behavior:'smooth'});}}
function nextScene(){GAME.currentScene++;renderScene();}

function showResults(){
  var pct=GAME.total>0?Math.round((GAME.hits/GAME.total)*100):0;
  var rank,rc;
  if(pct>=90){rank='\u{1F3C6} Oráculo de Mímisbrunnr';rc='#f0c040';}
  else if(pct>=70){rank='\u{1F4DC} Vidente Bayesiano';rc='#58a6ff';}
  else if(pct>=50){rank='\u{1F6E1}️ Aprendiz da Posterior';rc='#8b949e';}
  else{rank='⛓️ Servo da Priori Vaga';rc='#f85149';}
  content().innerHTML='<div class="result-screen"><div class="reino-badge">REINO 18 — COMPLETO</div><h2>Resultado da Aventura</h2>'+resultVikingHTML()+
    '<div class="result-rank" style="color:'+rc+'">'+rank+'</div>'+
    '<div class="result-stats">'+
    '<div class="stat-row"><span class="stat-label">Dificuldade</span><span class="stat-value">'+(GAME.difficulty==='mestre'?'⚔️ Mestre':'\u{1F6E1}️ Aprendiz')+'</span></div>'+
    '<div class="stat-row"><span class="stat-label">Desafios Corretos</span><span class="stat-value">'+GAME.hits+' / '+GAME.total+'</span></div>'+
    '<div class="stat-row"><span class="stat-label">Precisão</span><span class="stat-value">'+pct+'%</span></div>'+
    '<div class="stat-row"><span class="stat-label">XP Conquistado</span><span class="stat-value">'+GAME.xp+' / '+GAME.maxXP+'</span></div></div>'+
    dialogue('odin',pct>=70
      ?'As águas de Mímisbrunnr revelaram seus segredos! Posterior, priori, verossimilhança, MCMC, Bayes Factor — todas as ferramentas bayesianas estão no seu arsenal. Vá e atualize suas crenças com confiança!'
      :'Mímisbrunnr não perdoa os desatentos... Volte e revise: o teorema de Bayes, tipos de prioris, MCMC e convergência, intervalo de credibilidade vs confiança, e o Bayes Factor. O poço espera sua segunda tentativa!'
    )+
    '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px"><button class="continue-btn" onclick="showTitleScreen()">\u{1F504} Jogar Novamente</button></div></div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ════════════════════════════════════════════════════
// ARMOR SYSTEM
// ════════════════════════════════════════════════════
var GEAR_ITEMS=[
  {s:'boots',n:'Botas da Priori',h:'<div style="display:flex;gap:14px"><div style="background:linear-gradient(#2a4a7a,#1a3050);width:16px;height:12px;border-radius:3px 3px 2px 2px;border:1.5px solid #1a2a4a;position:relative"><span style="position:absolute;top:1px;left:2px;font-size:6px;color:#58a6ff;font-weight:bold">P</span></div><div style="background:linear-gradient(#2a4a7a,#1a3050);width:16px;height:12px;border-radius:3px 3px 2px 2px;border:1.5px solid #1a2a4a;position:relative"><span style="position:absolute;top:1px;left:2px;font-size:6px;color:#58a6ff;font-weight:bold">θ</span></div></div>'},
  {s:'mail',n:'Cota da Verossimilhança',h:'<div style="width:46px;height:42px;background:linear-gradient(135deg,#4a6a4a,#2a4a2a);clip-path:polygon(50% 0%,100% 30%,100% 100%,0 100%,0 30%);border:1.5px solid #6a8a6a;position:relative"><div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#f0c040;font-weight:bold;font-family:serif">L</div></div>'},
  {s:'right',n:'Espada da Posterior',h:'<div style="display:flex;flex-direction:column;align-items:center"><div style="width:12px;height:4px;background:linear-gradient(#c0c0c0,#808080);border-radius:2px"></div><div style="width:3px;height:32px;background:linear-gradient(#e0e0e0,#a0a0a0);border:1px solid #707070;position:relative"><span style="position:absolute;top:6px;left:-8px;font-size:6px;color:#bc8cff;font-weight:bold">P(θ|y)</span></div><div style="width:10px;height:6px;background:#5a3a1a;border-radius:1px;border:1px solid #3a2a10"></div></div>'},
  {s:'left',n:'Escudo Credível',h:'<div style="width:28px;height:32px;background:radial-gradient(circle,#4a6a8a,#2a3a5a);border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;border:2px solid #6a8aaa;position:relative"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;color:#f0c040;font-weight:bold;font-family:monospace">CI%</div></div>'},
  {s:'cape',n:'Capa do MCMC',h:'<div style="width:58px;height:52px;background:linear-gradient(180deg,#2a1a3a,#1a0a2a);clip-path:polygon(15% 0%,85% 0%,100% 100%,0% 100%);opacity:.85;position:relative"><div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px"><span style="width:4px;height:4px;border-radius:50%;background:#bc8cff"></span><span style="width:4px;height:4px;border-radius:50%;background:#bc8cff"></span><span style="width:4px;height:4px;border-radius:50%;background:#bc8cff"></span></div><div style="position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:7px;color:#bc8cff;font-weight:bold">MCMC</div></div>'},
  {s:'helm',n:'Elmo de Bayes',h:'<div style="width:38px;height:22px;background:linear-gradient(#6a5a2a,#4a3a1a);clip-path:polygon(5% 100%,15% 30%,50% 0%,85% 30%,95% 100%);border-bottom:3px solid #8a7a3a;position:relative"><div style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:8px;color:#f0c040;font-weight:bold;font-family:serif">BF</div></div>'}
];
var gearEarned=0;
function armorPanelHTML(){
  var rows='';
  for(var i=0;i<GEAR_ITEMS.length;i++){rows+='<div class="gp-row'+(i<gearEarned?' earned':'')+'" id="gprow'+i+'"><span class="gp-dot"></span><span>'+GEAR_ITEMS[i].n+'</span></div>';}
  var sl='<div class="vm-sparks" id="vmsparks"></div>';
  sl+='<div class="vm-slot vm-cape" id="vmslot-cape"></div>';
  sl+='<div class="vm-head"></div><div class="vm-arm-l"></div><div class="vm-arm-r"></div><div class="vm-torso"></div><div class="vm-leg-l"></div><div class="vm-leg-r"></div>';
  sl+='<div class="vm-slot vm-boots" id="vmslot-boots"></div><div class="vm-slot vm-mail" id="vmslot-mail"></div>';
  sl+='<div class="vm-slot vm-left" id="vmslot-left"></div><div class="vm-slot vm-right" id="vmslot-right"></div>';
  sl+='<div class="vm-slot vm-helm" id="vmslot-helm"></div>';
  return '<div class="armor-panel"><div class="viking-mini" id="vmini">'+sl+'</div><div class="gear-progress">'+rows+'</div></div>';
}
function restoreGear(){for(var i=0;i<gearEarned&&i<GEAR_ITEMS.length;i++){var g=GEAR_ITEMS[i],el=document.getElementById('vmslot-'+g.s);if(el){el.innerHTML=g.h;el.classList.add('on');}}}
function earnGear(){
  if(gearEarned>=GEAR_ITEMS.length)return;
  var g=GEAR_ITEMS[gearEarned],el=document.getElementById('vmslot-'+g.s);
  if(el){el.innerHTML=g.h;el.classList.add('on','vm-flash');setTimeout(function(){el.classList.remove('vm-flash')},500);spawnVMSparks(el);}
  var row=document.getElementById('gprow'+gearEarned);if(row)row.classList.add('earned');
  gearEarned++;
}
function spawnVMSparks(el){
  var sc=document.getElementById('vmsparks');if(!sc||!el)return;
  var r=el.getBoundingClientRect(),sr=document.getElementById('vmini').getBoundingClientRect();
  var cx=r.left-sr.left+r.width/2,cy=r.top-sr.top+r.height/2;
  var cols=['#f0c040','#f08030','#f0e080','#ff6040','#ffd060'];
  for(var i=0;i<10;i++){var s=document.createElement('div');s.className='vm-spark';
    var a=Math.random()*Math.PI*2,d=20+Math.random()*30;
    s.style.cssText='left:'+cx+'px;top:'+cy+'px;background:'+cols[Math.floor(Math.random()*5)]+';--sx:'+(Math.cos(a)*d)+'px;--sy:'+(Math.sin(a)*d)+'px;width:'+(2+Math.random()*3)+'px;height:'+(2+Math.random()*3)+'px';
    sc.appendChild(s);setTimeout(function(x){x.remove()},700,s);}
}
function resultVikingHTML(){
  var pct=GAME.total>0?Math.round((GAME.hits/GAME.total)*100):0;
  var ti=[];if(pct>=90)ti=GEAR_ITEMS;else if(pct>=70)ti=GEAR_ITEMS.slice(0,5);else if(pct>=50)ti=GEAR_ITEMS.slice(0,2);
  var html='<div class="result-viking">';
  html+='<div class="rv-slot rv-cape" id="rvs-cape"></div>';
  html+='<div class="rv-head"></div><div class="rv-arm-l"></div><div class="rv-arm-r"></div><div class="rv-torso"></div><div class="rv-leg-l"></div><div class="rv-leg-r"></div>';
  html+='<div class="rv-slot rv-boots" id="rvs-boots"></div><div class="rv-slot rv-mail" id="rvs-mail"></div>';
  html+='<div class="rv-slot rv-left" id="rvs-left"></div><div class="rv-slot rv-right" id="rvs-right"></div>';
  html+='<div class="rv-slot rv-helm" id="rvs-helm"></div></div>';
  setTimeout(function(){ti.forEach(function(g){var e=document.getElementById('rvs-'+g.s);if(e)e.innerHTML=g.h;});},100);
  return html;
}

showTitleScreen();
