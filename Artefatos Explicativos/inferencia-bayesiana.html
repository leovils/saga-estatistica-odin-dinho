<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introdução à Inferência Bayesiana — Passo a Passo | Odin Dinho</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0d1117;
  --bg-card: #161b22;
  --bg-panel: #1c2333;
  --odin-blue: #58a6ff;
  --thor-red: #f85149;
  --corvo-purple: #bc8cff;
  --gold: #f0c040;
  --silver: #8b949e;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --success: #3fb950;
  --border: #30363d;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Patrick Hand', cursive;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* PROGRESS BAR */
.progress-bar-container {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-dark);
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--border);
}

.progress-label {
  font-family: 'Permanent Marker', cursive;
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-align: center;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-panel);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--odin-blue), var(--gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* STEP CONTENT */
.step-content {
  min-height: 60vh;
  padding: 30px 0;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-title {
  font-family: 'Bangers', cursive;
  font-size: 2.2rem;
  color: var(--gold);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.step-subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.3rem;
  color: var(--odin-blue);
  margin-bottom: 15px;
}

/* DIALOGUE BOXES */
.dialogue-box {
  border-radius: 12px;
  padding: 16px 20px;
  margin: 16px 0;
  border-left: 4px solid;
  position: relative;
}

.dialogue-box.odin {
  background: rgba(88,166,255,0.08);
  border-left-color: var(--odin-blue);
}
.dialogue-box.thor {
  background: rgba(248,81,73,0.08);
  border-left-color: var(--thor-red);
}
.dialogue-box.corvo {
  background: rgba(188,140,255,0.08);
  border-left-color: var(--corvo-purple);
}

.char-name {
  font-family: 'Permanent Marker', cursive;
  font-size: 1rem;
  margin-bottom: 6px;
}
.char-name.odin { color: var(--odin-blue); }
.char-name.thor { color: var(--thor-red); }
.char-name.corvo { color: var(--corvo-purple); }

.dialogue-text {
  font-size: 1.05rem;
  line-height: 1.5;
}

/* DATA TABLE */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 1rem;
}

.data-table th, .data-table td {
  padding: 10px 14px;
  text-align: center;
  border: 1px solid var(--border);
}

.data-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
}

.data-table td {
  background: var(--bg-card);
  transition: background 0.2s;
}

.data-table tr:hover td {
  background: rgba(88,166,255,0.1);
}

/* CALC TABLE */
.calc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.95rem;
}

.calc-table th, .calc-table td {
  padding: 8px 10px;
  text-align: center;
  border: 1px solid var(--border);
}

.calc-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.calc-table td {
  background: var(--bg-card);
}

/* FORMULA */
.formula {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 16px 0;
  font-size: 1.15rem;
  text-align: center;
  font-family: 'Patrick Hand', cursive;
  color: var(--gold);
}

.formula-label {
  font-family: 'Permanent Marker', cursive;
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-bottom: 6px;
}

/* SVG VISUALS */
.visual-container {
  margin: 20px 0;
  text-align: center;
}

.visual-container svg {
  max-width: 100%;
  height: auto;
}

/* CONCEPT GRID */
.concept-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.concept-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.concept-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

/* COMPARISON GRID */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.comparison-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.comparison-title {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.comparison-result {
  font-size: 1.4rem;
  font-family: 'Bangers', cursive;
}

/* APA BOX */
.apa-box {
  background: var(--bg-panel);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 20px 24px;
  margin: 20px 0;
  font-style: italic;
  line-height: 1.7;
}

.apa-label {
  font-family: 'Bangers', cursive;
  color: var(--gold);
  font-style: normal;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

/* WARNING BOX */
.warning-box {
  background: rgba(248,81,73,0.06);
  border: 2px solid var(--thor-red);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.warning-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--thor-red);
  margin-bottom: 12px;
}

/* CORRECT BOX */
.correct-box {
  background: rgba(63,185,80,0.06);
  border: 2px solid var(--success);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.correct-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--success);
  margin-bottom: 12px;
}

/* RAVENS LESSON */
.licao-box {
  background: rgba(188,140,255,0.06);
  border: 2px solid var(--corvo-purple);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.licao-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--corvo-purple);
  margin-bottom: 12px;
}

/* TRAP GRID */
.trap-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.trap-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.trap-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  color: var(--thor-red);
  margin-bottom: 8px;
}

/* NAVIGATION */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0 40px;
  gap: 12px;
}

.nav-btn {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.1rem;
  padding: 12px 28px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s;
}

.nav-btn:hover {
  border-color: var(--odin-blue);
  background: rgba(88,166,255,0.1);
}

.nav-btn.primary {
  background: var(--odin-blue);
  color: var(--bg-dark);
  border-color: var(--odin-blue);
}

.nav-btn.primary:hover {
  background: #79bbff;
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* SIGNATURE */
.signature {
  text-align: center;
  padding: 30px 0;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.9rem;
}

/* HIGHLIGHTS */
.hl-gold { color: var(--gold); font-weight: bold; }
.hl-blue { color: var(--odin-blue); }
.hl-red { color: var(--thor-red); }
.hl-green { color: var(--success); }
.hl-purple { color: var(--corvo-purple); }

/* RESPONSIVE */
@media (max-width: 600px) {
  .container { padding: 12px; }
  .step-title { font-size: 1.6rem; }
  .concept-grid, .comparison-grid, .trap-grid { grid-template-columns: 1fr; }
  .nav-btn { padding: 10px 18px; font-size: 0.95rem; }
  body { font-size: 16px; }
}

.fade-in { animation: fadeIn 0.6s ease both; }
.fade-in-delay { animation: fadeIn 0.6s ease 0.3s both; }
</style>
</head>

<div class="container">
  <div class="progress-bar-container">
    <div class="progress-label" id="progressLabel">Passo 0 de 11</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="step-content" id="stepContent"></div>

  <div class="nav-buttons">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled>&#9664; Voltar</button>
    <button class="nav-btn primary" id="btnNext" onclick="goNext()">Pr&oacute;ximo &#9654;</button>
  </div>

  <div class="signature">
    Prof. Dr. Leonardo Vils &middot; PPGA &middot; UNINOVE &middot; MTPQI &middot; 2026
  </div>
</div>

<script>
// ===== AUXILIARES =====
function rf(v, d) { return Number(v).toFixed(d === undefined ? 2 : d); }

function dialogue(character, name, text) {
  return '<div class="dialogue-box ' + character + '">' +
    '<div class="char-name ' + character + '">' + name + '</div>' +
    '<div class="dialogue-text">' + text + '</div>' +
  '</div>';
}

// ===== SVG: PRIOR PARA POSTERIOR =====
function buildPriorPosteriorSVG() {
  var w = 700, h = 360;
  var pad = { top: 40, right: 30, bottom: 55, left: 50 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  function sx(v) { return pad.left + v * pw; }
  function sy(v) { return pad.top + ph - v * ph; }

  function betaPDF(x, a, b) {
    if (x <= 0 || x >= 1) return 0;
    var logB = lgamma(a) + lgamma(b) - lgamma(a + b);
    return Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x) - logB);
  }
  function lgamma(z) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
             -1.231739572450155, 0.001208650973866179, -0.000005395239384953];
    var s = 1.000000000190015;
    var t = z + 5.5;
    t -= (z + 0.5) * Math.log(t);
    for (var j = 0; j < 6; j++) s += c[j] / (z + j + 1);
    return -t + Math.log(2.5066282746310005 * s / z);
  }

  var priorA = 2, priorB = 18;
  var postA = 5.5, postB = 9.5;

  var maxY = 0;
  for (var i = 0; i <= 100; i++) {
    var x = i / 100;
    var yPri = betaPDF(x, priorA, priorB);
    var yPos = betaPDF(x, postA, postB);
    if (yPri > maxY) maxY = yPri;
    if (yPos > maxY) maxY = yPos;
  }
  maxY *= 1.15;

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<text x="' + (w/2) + '" y="22" fill="#f0c040" font-size="16" text-anchor="middle" font-family="Bangers">Prior → Dados → Posterior</text>';

  for (var gy = 0; gy <= 4; gy++) {
    var yy = sy(gy / 4);
    svg += '<line x1="' + pad.left + '" y1="' + yy + '" x2="' + (pad.left + pw) + '" y2="' + yy + '" stroke="#30363d" stroke-width="0.5" opacity="0.4"/>';
  }

  svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (pad.left + pw) + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';
  svg += '<line x1="' + pad.left + '" y1="' + pad.top + '" x2="' + pad.left + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';

  for (var gx = 0; gx <= 10; gx += 2) {
    var xVal = gx / 10;
    svg += '<text x="' + sx(xVal) + '" y="' + (pad.top + ph + 20) + '" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">' + rf(xVal, 1) + '</text>';
  }
  svg += '<text x="' + (w/2) + '" y="' + (h - 5) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker">θ (probabilidade do oráculo ser genuíno)</text>';
  svg += '<text x="15" y="' + (pad.top + ph/2) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker" transform="rotate(-90,15,' + (pad.top + ph/2) + ')">Densidade</text>';

  var pathPri = '';
  for (var i2 = 0; i2 <= 100; i2++) {
    var xx = i2 / 100;
    var yy2 = betaPDF(xx, priorA, priorB) / maxY;
    if (yy2 > 1) yy2 = 1;
    pathPri += (i2 === 0 ? 'M' : ' L') + rf(sx(xx), 1) + ' ' + rf(sy(yy2), 1);
  }
  svg += '<path d="' + pathPri + '" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.9"/>';

  var pathPos = '';
  for (var i3 = 0; i3 <= 100; i3++) {
    var xx2 = i3 / 100;
    var yy3 = betaPDF(xx2, postA, postB) / maxY;
    if (yy3 > 1) yy3 = 1;
    pathPos += (i3 === 0 ? 'M' : ' L') + rf(sx(xx2), 1) + ' ' + rf(sy(yy3), 1);
  }
  svg += '<path d="' + pathPos + '" fill="none" stroke="#f0c040" stroke-width="3"/>';

  var priPeakX = (priorA - 1) / (priorA + priorB - 2);
  var posPeakX = (postA - 1) / (postA + postB - 2);
  var arrY = sy(0.75);
  svg += '<line x1="' + sx(priPeakX + 0.03) + '" y1="' + arrY + '" x2="' + sx(posPeakX - 0.03) + '" y2="' + arrY + '" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>';
  svg += '<defs><marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker></defs>';
  svg += '<text x="' + sx((priPeakX + posPeakX) / 2) + '" y="' + (arrY - 8) + '" fill="#3fb950" font-size="12" text-anchor="middle" font-family="Permanent Marker">Dados deslocam a crença</text>';

  svg += '<line x1="' + (w - 220) + '" y1="' + (pad.top + 10) + '" x2="' + (w - 190) + '" y2="' + (pad.top + 10) + '" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8,4"/>';
  svg += '<text x="' + (w - 185) + '" y="' + (pad.top + 14) + '" fill="#58a6ff" font-size="12" font-family="Patrick Hand">Prior</text>';
  svg += '<line x1="' + (w - 220) + '" y1="' + (pad.top + 30) + '" x2="' + (w - 190) + '" y2="' + (pad.top + 30) + '" stroke="#f0c040" stroke-width="3"/>';
  svg += '<text x="' + (w - 185) + '" y="' + (pad.top + 34) + '" fill="#f0c040" font-size="12" font-family="Patrick Hand">Posterior</text>';

  svg += '</svg>';
  return svg;
}

// ===== SVG: ATUALIZAÇÃO SEQUENCIAL =====
function buildSequentialSVG() {
  var w = 700, h = 380;
  var pad = { top: 40, right: 30, bottom: 55, left: 50 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  function sx(v) { return pad.left + v * pw; }
  function sy(v) { return pad.top + ph - v * ph; }

  function betaPDF(x, a, b) {
    if (x <= 0 || x >= 1) return 0;
    var logB = lgamma2(a) + lgamma2(b) - lgamma2(a + b);
    return Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x) - logB);
  }
  function lgamma2(z) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
             -1.231739572450155, 0.001208650973866179, -0.000005395239384953];
    var s = 1.000000000190015;
    var t = z + 5.5;
    t -= (z + 0.5) * Math.log(t);
    for (var j = 0; j < 6; j++) s += c[j] / (z + j + 1);
    return -t + Math.log(2.5066282746310005 * s / z);
  }

  var rounds = [
    { a: 2, b: 18, color: '#8b949e', dash: '6,4', label: 'Prior (sem dados)', lw: 1.5 },
    { a: 3, b: 18, color: '#58a6ff', dash: '4,3', label: 'Após 1 acerto', lw: 2 },
    { a: 4, b: 18, color: '#bc8cff', dash: '', label: 'Após 2 acertos', lw: 2.5 },
    { a: 5, b: 18, color: '#f0c040', dash: '', label: 'Após 3 acertos', lw: 3 }
  ];

  var maxY = 0;
  for (var r = 0; r < rounds.length; r++) {
    for (var i = 0; i <= 100; i++) {
      var yy = betaPDF(i/100, rounds[r].a, rounds[r].b);
      if (yy > maxY) maxY = yy;
    }
  }
  maxY *= 1.15;

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<text x="' + (w/2) + '" y="22" fill="#f0c040" font-size="16" text-anchor="middle" font-family="Bangers">Atualização Bayesiana Sequencial</text>';

  svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (pad.left + pw) + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';
  svg += '<line x1="' + pad.left + '" y1="' + pad.top + '" x2="' + pad.left + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';

  for (var gx = 0; gx <= 10; gx += 2) {
    svg += '<text x="' + sx(gx/10) + '" y="' + (pad.top + ph + 20) + '" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">' + rf(gx/10, 1) + '</text>';
  }
  svg += '<text x="' + (w/2) + '" y="' + (h - 5) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker">θ</text>';

  for (var r2 = 0; r2 < rounds.length; r2++) {
    var rd = rounds[r2];
    var path = '';
    for (var i2 = 0; i2 <= 100; i2++) {
      var xx = i2 / 100;
      var yy2 = betaPDF(xx, rd.a, rd.b) / maxY;
      if (yy2 > 1) yy2 = 1;
      path += (i2 === 0 ? 'M' : ' L') + rf(sx(xx), 1) + ' ' + rf(sy(yy2), 1);
    }
    var dashAttr = rd.dash ? ' stroke-dasharray="' + rd.dash + '"' : '';
    svg += '<path d="' + path + '" fill="none" stroke="' + rd.color + '" stroke-width="' + rd.lw + '"' + dashAttr + '/>';
  }

  for (var r3 = 0; r3 < rounds.length; r3++) {
    var ly = pad.top + 8 + r3 * 22;
    var dashA = rounds[r3].dash ? ' stroke-dasharray="' + rounds[r3].dash + '"' : '';
    svg += '<line x1="' + (w - 240) + '" y1="' + ly + '" x2="' + (w - 210) + '" y2="' + ly + '" stroke="' + rounds[r3].color + '" stroke-width="' + rounds[r3].lw + '"' + dashA + '/>';
    svg += '<text x="' + (w - 205) + '" y="' + (ly + 4) + '" fill="' + rounds[r3].color + '" font-size="12" font-family="Patrick Hand">' + rounds[r3].label + '</text>';
  }

  svg += '<defs><marker id="arrowSeq" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker></defs>';
  svg += '<line x1="' + sx(0.08) + '" y1="' + sy(0.15) + '" x2="' + sx(0.22) + '" y2="' + sy(0.15) + '" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowSeq)"/>';
  svg += '<text x="' + sx(0.15) + '" y="' + (sy(0.15) - 8) + '" fill="#3fb950" font-size="11" text-anchor="middle" font-family="Patrick Hand">Crença se desloca a cada acerto</text>';

  svg += '</svg>';
  return svg;
}

// ===== SVG: ESCALA DO FATOR DE BAYES =====
function buildBayesFactorSVG() {
  var w = 700, h = 180;
  var pad = { left: 40, right: 40, top: 45, bottom: 40 };
  var barW = w - pad.left - pad.right;
  var barH = 36;
  var barY = pad.top + 10;

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<text x="' + (w/2) + '" y="22" fill="#f0c040" font-size="16" text-anchor="middle" font-family="Bangers">Escala de Interpretação do Fator de Bayes (Jeffreys)</text>';

  var segments = [
    { s: 0.00, e: 0.20, col: '#8b949e', label: 'Anedótico', range: '1–3' },
    { s: 0.20, e: 0.40, col: '#58a6ff', label: 'Moderado', range: '3–10' },

    { s: 0.60, e: 0.80, col: '#f0c040', label: 'Muito Forte', range: '30–100' },
    { s: 0.80, e: 1.00, col: '#f85149', label: 'Extremo', range: '>100' }
  ];

  for (var i = 0; i < segments.length; i++) {

    svg += '<rect x="' + x1 + '" y="' + barY + '" width="' + sw + '" height="' + barH + '" fill="none" stroke="' + seg.col + '" stroke-width="1.5" rx="' + (i === 0 ? '6' : '0') + '"/>';
    var cx = (x1 + x2) / 2;
    svg += '<text x="' + cx + '" y="' + (barY + barH/2 + 5) + '" fill="' + seg.col + '" font-size="13" text-anchor="middle" font-family="Permanent Marker">' + seg.label + '</text>';
    svg += '<text x="' + cx + '" y="' + (barY + barH + 20) + '" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">BF₁₀ = ' + seg.range + '</text>';
  }

  svg += '<defs><marker id="arrowBF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3fb950"/></marker></defs>';
  svg += '<line x1="' + (pad.left + 10) + '" y1="' + (barY + barH + 38) + '" x2="' + (pad.left + barW - 10) + '" y2="' + (barY + barH + 38) + '" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowBF)"/>';
  svg += '<text x="' + (w/2) + '" y="' + (barY + barH + 55) + '" fill="#3fb950" font-size="11" text-anchor="middle" font-family="Patrick Hand">Evidência crescente a favor de H₁ sobre H₀</text>';

  svg += '</svg>';
  return svg;
}

// ===== SVG: INTERVALO CRÍVEL vs IC =====
function buildCrIvsCISVG() {
  var w = 700, h = 300;
  var pad = { top: 35, right: 30, bottom: 30, left: 30 };

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<text x="' + (w/2) + '" y="22" fill="#f0c040" font-size="16" text-anchor="middle" font-family="Bangers">Intervalo de Credibilidade vs. Intervalo de Confiança</text>';

  var boxW = 290, boxH = 220;
  var lx = pad.left + 20;
  var by = pad.top + 20;

  svg += '<rect x="' + lx + '" y="' + by + '" width="' + boxW + '" height="' + boxH + '" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/>';
  svg += '<text x="' + (lx + boxW/2) + '" y="' + (by + 25) + '" fill="#58a6ff" font-size="14" text-anchor="middle" font-family="Permanent Marker">IC 95% (Confiança)</text>';
  svg += '<text x="' + (lx + boxW/2) + '" y="' + (by + 55) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">"Se replicarmos o experimento</text>';
  svg += '<text x="' + (lx + boxW/2) + '" y="' + (by + 73) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">muitas vezes, 95% dos ICs</text>';
  svg += '<text x="' + (lx + boxW/2) + '" y="' + (by + 91) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">conteriam o valor verdadeiro."</text>';

  var ciBaseY = by + 110;
  var ciVals = [
    { lo: 0.30, hi: 0.55, hit: true },
    { lo: 0.35, hi: 0.60, hit: true },
    { lo: 0.15, hi: 0.38, hit: false },
    { lo: 0.32, hi: 0.58, hit: true },
    { lo: 0.28, hi: 0.52, hit: true }
  ];
  var trueVal = 0.42;
  var ciW = boxW - 40;
  for (var ci = 0; ci < ciVals.length; ci++) {
    var yy = ciBaseY + ci * 18;
    var x1 = lx + 20 + ciVals[ci].lo * ciW;
    var x2 = lx + 20 + ciVals[ci].hi * ciW;
    var col = ciVals[ci].hit ? '#58a6ff' : '#f85149';
    svg += '<line x1="' + x1 + '" y1="' + yy + '" x2="' + x2 + '" y2="' + yy + '" stroke="' + col + '" stroke-width="3" opacity="0.8"/>';
    svg += '<circle cx="' + x1 + '" cy="' + yy + '" r="3" fill="' + col + '"/>';
    svg += '<circle cx="' + x2 + '" cy="' + yy + '" r="3" fill="' + col + '"/>';
  }
  var tvx = lx + 20 + trueVal * ciW;
  svg += '<line x1="' + tvx + '" y1="' + (ciBaseY - 8) + '" x2="' + tvx + '" y2="' + (ciBaseY + 4 * 18 + 8) + '" stroke="#f0c040" stroke-width="1.5" stroke-dasharray="4,3"/>';
  svg += '<text x="' + tvx + '" y="' + (ciBaseY - 12) + '" fill="#f0c040" font-size="10" text-anchor="middle" font-family="Patrick Hand">θ real</text>';

  var rx2 = lx + boxW + 40;
  svg += '<rect x="' + rx2 + '" y="' + by + '" width="' + boxW + '" height="' + boxH + '" fill="#161b22" stroke="#f0c040" stroke-width="1.5" rx="10"/>';
  svg += '<text x="' + (rx2 + boxW/2) + '" y="' + (by + 25) + '" fill="#f0c040" font-size="14" text-anchor="middle" font-family="Permanent Marker">ICr 95% (Credibilidade)</text>';
  svg += '<text x="' + (rx2 + boxW/2) + '" y="' + (by + 55) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">"Há 95% de probabilidade</text>';
  svg += '<text x="' + (rx2 + boxW/2) + '" y="' + (by + 73) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">de que o parâmetro verdadeiro</text>';
  svg += '<text x="' + (rx2 + boxW/2) + '" y="' + (by + 91) + '" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="Patrick Hand">esteja neste intervalo."</text>';

  var curveY = by + 115;
  var curveH = 80;
  var curveW = boxW - 40;
  var cx = rx2 + 20;
  var pathTop = 'M' + cx + ' ' + (curveY + curveH);
  for (var k = 0; k <= 50; k++) {
    var t = k / 50;
    var xp = cx + t * curveW;
    var bell = Math.exp(-0.5 * Math.pow((t - 0.45) / 0.15, 2));
    var yp = curveY + curveH - bell * curveH * 0.9;
    pathTop += ' L' + rf(xp, 1) + ' ' + rf(yp, 1);
  }
  pathTop += ' L' + (cx + curveW) + ' ' + (curveY + curveH);
  svg += '<path d="' + pathTop + '" fill="none" stroke="#f0c040" stroke-width="2"/>';

  var shadePath = '';
  var started = false;
  for (var k2 = 0; k2 <= 50; k2++) {
    var t2 = k2 / 50;
    if (t2 >= 0.15 && t2 <= 0.75) {
      var xp2 = cx + t2 * curveW;
      var bell2 = Math.exp(-0.5 * Math.pow((t2 - 0.45) / 0.15, 2));
      var yp2 = curveY + curveH - bell2 * curveH * 0.9;
      if (!started) { shadePath = 'M' + rf(xp2, 1) + ' ' + (curveY + curveH); started = true; }
      shadePath += ' L' + rf(xp2, 1) + ' ' + rf(yp2, 1);
    }
  }
  shadePath += ' L' + rf(cx + 0.75 * curveW, 1) + ' ' + (curveY + curveH) + ' Z';
  svg += '<path d="' + shadePath + '" fill="#f0c040" opacity="0.15"/>';
  svg += '<text x="' + (cx + 0.45 * curveW) + '" y="' + (curveY + curveH + 15) + '" fill="#f0c040" font-size="10" text-anchor="middle" font-family="Patrick Hand">95% da massa posterior</text>';

  svg += '</svg>';
  return svg;
}

  '<p>Para um frequentista, probabilidade é a <strong>frequência relativa</strong> de um evento em infinitas repetições. Dizer "a probabilidade de cara é 0,5" significa: <em>se você jogasse essa moeda para sempre, metade seria cara</em>. Parâmetros são fixos mas desconhecidos; dados são aleatórios.</p>' +

  '<table class="data-table">' +
    '<tr>' +

      '<td>Incorporada explicitamente</td>' +
    '</tr>' +
    '<tr>' +
      '<td>Ferramenta principal</td>' +

// ===== PASSO 2: TEOREMA DE BAYES =====
function step2() {
  return '<div class="step-title">Passo 2: Teorema de Bayes \x96 A Fórmula do Tear</div>' +

  '<p>O motor da inferência bayesiana cabe numa única equação elegante. Cada fio da tapeçaria das Nornas segue esta regra:</p>' +

  '<div class="formula">' +
    '<div class="formula-label">Teorema de Bayes</div>' +
    'P(H | D) = P(D | H) × P(H) / P(D)' +
  '</div>' +

  '<p>Vamos rotular cada peça:</p>' +

  '<div class="concept-grid">' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--gold)">P(H | D) \x96 Posterior</h4>' +
      '<p>Probabilidade da hipótese <em>depois</em> de ver os dados. É isso que queremos.</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--success)">P(D | H) \x96 Verossimilhança</h4>' +
      '<p>Probabilidade de observar os dados <em>se</em> a hipótese for verdadeira. Quão bem H prediz D?</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--odin-blue)">P(H) \x96 Prior</h4>' +
      '<p>Probabilidade da hipótese <em>antes</em> de ver dados. Sua crença inicial.</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--corvo-purple)">P(D) \x96 Evidência</h4>' +
      '<p>Probabilidade total dos dados sob <em>todas</em> as hipóteses. A constante de normalização.</p>' +
    '</div>' +
  '</div>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Pense assim: o <span class="hl-blue">Prior</span> é onde você começa. A <span class="hl-green">Verossimilhança</span> é a ponte entre sua hipótese e os dados. A <span class="hl-purple">Evidência</span> garante que tudo soma 1. E o <span class="hl-gold">Posterior</span> é seu destino \x96 crença atualizada.') +

  '<p>P(D), a evidência, pode ser expandida pela <strong>lei da probabilidade total</strong>:</p>' +

  '<div class="formula">' +
    '<div class="formula-label">Lei da Probabilidade Total (caso binário)</div>' +
    'P(D) = P(D | H) × P(H) + P(D | ¬H) × P(¬H)' +
  '</div>' +

  '<p>Assim, P(D) contém <em>todas as formas possíveis</em> de os dados surgirem \x96 sob H e sob não-H. Isso garante que o posterior seja uma probabilidade válida.</p>' +

  dialogue('thor', '🔨 ThorMento', 'Beleza, uma fração. Numerador vezes prior, denominador soma tudo. Quão difícil pode ser?') +

  dialogue('corvo', '🪶 Huginn provoca:', 'Mais difícil do que parece, ThorMento. A real dificuldade está em <em>escolher o prior</em> e em <em>calcular P(D)</em> para modelos complexos. Por isso, métodos bayesianos precisaram de 250 anos e computadores modernos para se tornarem práticos.') +

  '<div class="correct-box">' +
    '<div class="correct-title">✅ O Atalho da Proporcionalidade</div>' +
    '<p>Como P(D) é apenas uma constante (não depende de H), muitas análises bayesianas escrevem:</p>' +
    '<p style="text-align:center; font-size:1.15rem; color:var(--gold); margin:10px 0;"><strong>Posterior ∝ Verossimilhança × Prior</strong></p>' +
    '<p>O símbolo ∝ significa "proporcional a." A forma do posterior é inteiramente determinada pela verossimilhança e pelo prior. P(D) só reescala para somar 1.</p>' +
  '</div>';
}


// ===== PASSO 3: EXEMPLO NÓRDICO =====
function step3() {
  return '<div class="step-title">Passo 3: O Oráculo Norna \x96 Um Exemplo Passo a Passo</div>' +

  '<p>Vamos colocar o teorema de Bayes para trabalhar com um problema concreto dos Nove Reinos.</p>' +

  '<div class="apa-box">' +
    '<div class="apa-label">🔮 O Problema</div>' +
    '<p style="font-style:normal;">Uma oráculo Norna em Midgard afirma que pode prever resultados de batalha. Você quer saber: <strong>ela é genuinamente dotada ou apenas chutando?</strong></p>' +
    '<ul style="margin:10px 0 0 20px; font-style:normal;">' +
      '<li><strong>Prior:</strong> Apenas 10% dos oráculos autoproclamados são genuínos. P(Genuíno) = 0,10</li>' +
      '<li><strong>Oráculos genuínos</strong> preveem corretamente 90% das vezes. P(Acerto | Genuíno) = 0,90</li>' +
      '<li><strong>Oráculos falsos</strong> preveem corretamente 50% das vezes (cara ou coroa). P(Acerto | Falso) = 0,50</li>' +
      '<li><strong>Observação:</strong> Ela previu 3 de 3 batalhas corretamente.</li>' +
    '</ul>' +
  '</div>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Vamos definir os termos. H = "o oráculo é genuíno." D = "3 previsões corretas em 3 tentativas." Precisamos de P(H | D).') +

  '<div class="step-subtitle">Cálculo Passo a Passo</div>' +

  '<p><strong>1. Definir o prior:</strong></p>' +
  '<div class="formula">' +
    '<div class="formula-label">Prior</div>' +
    'P(H) = 0,10 &nbsp;&nbsp;&nbsp; P(¬H) = 0,90' +
  '</div>' +

  '<p><strong>2. Calcular a verossimilhança (probabilidade de 3/3 corretos):</strong></p>' +
  '<div class="formula">' +
    '<div class="formula-label">Verossimilhança se Genuíno</div>' +
    'P(D | H) = 0,90³ = 0,729' +
  '</div>' +
  '<div class="formula">' +
    '<div class="formula-label">Verossimilhança se Falso</div>' +
    'P(D | ¬H) = 0,50³ = 0,125' +
  '</div>' +

  '<p><strong>3. Calcular a evidência total P(D):</strong></p>' +
  '<div class="formula">' +
    '<div class="formula-label">Evidência Total</div>' +
    'P(D) = P(D|H) × P(H) + P(D|¬H) × P(¬H)<br>' +
    'P(D) = 0,729 × 0,10 + 0,125 × 0,90<br>' +
    'P(D) = 0,0729 + 0,1125 = <span class="hl-gold">0,1854</span>' +
  '</div>' +

  '<p><strong>4. Aplicar o teorema de Bayes:</strong></p>' +
  '<div class="formula">' +
    '<div class="formula-label">Posterior</div>' +
    'P(H | D) = P(D|H) × P(H) / P(D)<br>' +
    'P(H | D) = 0,729 × 0,10 / 0,1854<br>' +
    'P(H | D) = 0,0729 / 0,1854 ≈ <span class="hl-gold" style="font-size:1.3rem">0,393</span>' +
  '</div>' +

  '<table class="data-table">' +
    '<tr><th>Componente</th><th>Símbolo</th><th>Valor</th><th>Significado</th></tr>' +
    '<tr><td>Prior</td><td>P(H)</td><td class="hl-blue">0,100</td><td>10% acreditavam genuíno antes dos dados</td></tr>' +
    '<tr><td>Verossimilhança (H)</td><td>P(D|H)</td><td class="hl-green">0,729</td><td>Oráculo genuíno: 72,9% de chance de 3/3</td></tr>' +
    '<tr><td>Verossimilhança (¬H)</td><td>P(D|¬H)</td><td class="hl-red">0,125</td><td>Oráculo falso: 12,5% de chance de 3/3</td></tr>' +
    '<tr><td>Evidência</td><td>P(D)</td><td class="hl-purple">0,1854</td><td>Chance geral de observar 3/3</td></tr>' +
    '<tr><td>Posterior</td><td>P(H|D)</td><td class="hl-gold">0,393</td><td>39,3% acreditam genuíno após dados</td></tr>' +
  '</table>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Veja o poder da atualização: começamos em <span class="hl-blue">10%</span> e saltamos para <span class="hl-gold">39,3%</span> com apenas três observações. Os dados quase quadruplicaram nossa confiança. Mas ainda <em>não</em> estamos convencidos \x96 o prior era muito cético, e três tentativas são poucas.') +

  dialogue('thor', '🔨 ThorMento', 'Só 39%? Ela acertou 3 de 3! Eu contratava na hora.') +

  dialogue('corvo', '🪶 Huginn provoca:', 'E é exatamente por isso que você vive perdendo apostas, ThorMento. 3/3 também é alcançável por acaso \x96 um lançador de moeda tem 12,5% de chance disso. O prior nos diz que a maioria dos oráculos autoproclamados são falsos. Bayes equilibra <em>ambas</em> as informações.');
}


// ===== PASSO 4: DISTRIBUIÇÕES A PRIORI =====
function step4() {
  return '<div class="step-title">Passo 4: Distribuições A Priori \x96 Escolhendo Seu Fio Inicial</div>' +

  '<p>O prior é o elemento mais debatido da inferência bayesiana. Ele codifica o que você sabe (ou pressupõe) <em>antes</em> de ver os dados. Escolher sabiamente é tanto arte quanto ciência.</p>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'O prior não é uma fraqueza \x96 é uma funcionalidade. Ele permite incorporar formalmente o conhecimento existente. A chave é ser <strong>transparente</strong> sobre sua escolha e testar sua influência.') +

  '<div class="concept-grid">' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--text-dim)">Prior Plano / Uniforme</h4>' +
      '<p>"Não sei nada." Todo valor é igualmente provável. Parece objetivo, mas pode ser <strong>surpreendentemente informativo</strong> disfarçado.</p>' +
      '<p style="font-size:0.9rem; color:var(--text-dim)">Exemplo: Uniforme(0, 1) para parâmetro de probabilidade</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--odin-blue)">Prior Fracamente Informativo</h4>' +
      '<p>"Tenho uma ideia vaga da escala." Regulariza valores extremos sem dominar os dados. <strong>Padrão recomendado.</strong></p>' +
      '<p style="font-size:0.9rem; color:var(--text-dim)">Exemplo: Normal(0, 10) para coeficiente de regressão</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--gold)">Prior Informativo</h4>' +
      '<p>"Pesquisas anteriores indicam que o efeito está por aqui." Usa resultados publicados ou conhecimento especialista. Poderoso quando justificado.</p>' +
      '<p style="font-size:0.9rem; color:var(--text-dim)">Exemplo: Normal(0,5; 0,2) baseado em meta-análise</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--thor-red)">Prior Cético</h4>' +
      '<p>"Duvido que esse efeito exista." Centrado em zero/nulo. Usado para ser <em>conservador</em> \x96 o efeito deve superar o ceticismo para sobreviver.</p>' +
      '<p style="font-size:0.9rem; color:var(--text-dim)">Exemplo: Normal(0; 0,5) centrado em ausência de efeito</p>' +
    '</div>' +
  '</div>' +

  dialogue('thor', '🔨 ThorMento', 'Então você simplesmente escolhe qualquer prior que faça seu resultado ficar bonito? Por isso não confio nos bayesianos!') +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Não. Você <strong>declara</strong> seu prior transparentemente, <strong>justifica</strong> a escolha e roda uma <strong>análise de sensibilidade</strong> para mostrar que suas conclusões se mantêm com alternativas razoáveis. Se o posterior muda drasticamente com priors diferentes, os dados não são informativos o suficiente \x96 e isso é importante saber.') +

  '<div class="correct-box">' +
    '<div class="correct-title">✅ Análise de Sensibilidade do Prior</div>' +
    '<p>Uma boa análise bayesiana sempre pergunta: "Minhas conclusões mudariam com um prior diferente?" Rode a análise com pelo menos 2\x963 priors diferentes (ex.: plano, fracamente informativo, cético). Se o posterior é robusto, os dados estão falando alto. Se é frágil, reporte isso honestamente.</p>' +
  '</div>' +

  dialogue('corvo', '🪶 Muninn lembra:', 'Conforme o tamanho amostral cresce, a verossimilhança domina o prior. Com dados suficientes, dois analistas com priors <em>radicalmente diferentes</em> convergirão para praticamente o mesmo posterior. Isso é o <strong>teorema de consistência bayesiana</strong> \x96 os dados eventualmente superam qualquer prior razoável.') +

  '<div class="warning-box">' +
    '<div class="warning-title">⚠️ Armadilha de ThorMento: A Ilusão do "Não-Informativo"</div>' +
    '<p>Um prior plano sobre um parâmetro sem limites (como uma média) é <strong>impróprio</strong> \x96 não integra para 1. Pode produzir posteriors válidos, mas também pode causar problemas. E um prior "plano" numa escala (ex.: probabilidade) <em>não é</em> plano numa escala transformada (ex.: log-odds). Não-informatividade verdadeira é mais difícil do que parece.</p>' +
  '</div>';
}


// ===== PASSO 5: VEROSSIMILHANÇA =====
function step5() {
  return '<div class="step-title">Passo 5: Verossimilhança \x96 A Ponte Entre Mundos</div>' +

  '<p>A <span class="hl-green">função de verossimilhança</span> P(D | θ) é a ponte que conecta seu valor hipotético do parâmetro θ aos dados observados D. Ela pergunta: <em>se θ fosse o valor verdadeiro, quão prováveis seriam os dados que eu de fato vi?</em></p>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'A verossimilhança não é uma distribuição de probabilidade sobre θ \x96 é uma função de θ que diz quão bem cada valor possível <em>explica</em> os dados. A mesma função aparece na estimação de máxima verossimilhança frequentista. Bayesianos simplesmente a multiplicam pelo prior.') +

  '<div class="step-subtitle">🔗 Verossimilhança no Exemplo do Oráculo</div>' +

  '<p>Suponha θ = probabilidade de o oráculo prever corretamente. Observamos 3 acertos em 3 tentativas. A verossimilhança é:</p>' +

  '<div class="formula">' +
    '<div class="formula-label">Verossimilhança Binomial</div>' +
    'L(θ) = P(3 acertos | θ) = θ³' +
  '</div>' +

  '<table class="data-table">' +
    '<tr><th>θ</th><th>L(θ) = θ³</th><th>Interpretação</th></tr>' +
    '<tr><td>0,10</td><td>0,001</td><td>Muito improvável obter 3/3 se θ=0,10</td></tr>' +
    '<tr><td>0,30</td><td>0,027</td><td>Ainda bastante improvável</td></tr>' +
    '<tr><td>0,50</td><td>0,125</td><td>Possível (cara ou coroa)</td></tr>' +
    '<tr><td>0,70</td><td>0,343</td><td>Razoavelmente provável</td></tr>' +
    '<tr><td>0,90</td><td>0,729</td><td>Muito provável</td></tr>' +
    '<tr><td>1,00</td><td>1,000</td><td>Certo (mas θ=1 é realista?)</td></tr>' +
  '</table>' +

  '<p>A verossimilhança atinge o pico em θ = 1,0 (a <strong>estimativa de máxima verossimilhança</strong>). Mas o prior modera isso \x96 Bayes não vai simplesmente com o valor favorito dos dados; ele o pondera contra o que é plausível <em>a priori</em>.</p>' +

  dialogue('thor', '🔨 ThorMento', 'Então o EMV diz que ela é perfeita! Eu iria com θ=1 o dia todo.') +

  dialogue('corvo', '🪶 Huginn provoca:', 'Com apenas 3 tentativas? O EMV é maximamente otimista aqui. Com n=3, a EMV de uma moeda que caiu 3 caras é "sempre cara." Absurdo. O prior nos salva da reação exagerada de amostras pequenas.') +

  '<div class="correct-box">' +
    '<div class="correct-title">✅ Insight Central: Verossimilhança × Prior = Forma do Posterior</div>' +
    '<p>Onde tanto a verossimilhança quanto o prior são altos, o posterior será alto. Onde qualquer um está perto de zero, o posterior cai. O posterior é um <strong>compromisso</strong> entre o que os dados dizem (verossimilhança) e o que você esperava (prior). Com mais dados, o compromisso pende para a verossimilhança.</p>' +
  '</div>';
}


// ===== PASSO 6: DISTRIBUIÇÃO POSTERIOR =====
function step6() {
  return '<div class="step-title">Passo 6: O Posterior \x96 Sua Tapeçaria Atualizada</div>' +

  '<p>A <span class="hl-gold">distribuição posterior</span> P(θ | D) é a joia da coroa da análise bayesiana. Ela representa seu <em>conhecimento atualizado completo</em> sobre o parâmetro após ver os dados. Não um único número \x96 uma distribuição inteira.</p>' +

  '<div class="formula">' +
    '<div class="formula-label">A Atualização Bayesiana</div>' +
    'Posterior ∝ Verossimilhança × Prior' +
  '</div>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'O posterior não é apenas uma estimativa pontual. Ele diz o valor mais provável, <em>e</em> quão incerto você está sobre ele, <em>e</em> a forma completa da sua crença atualizada. É a tapeçaria inteira, não apenas um fio.') +

  '<div class="visual-container">' + buildPriorPosteriorSVG() + '</div>' +

  '<p>A visualização acima mostra como os dados deslocam a distribuição. A <span class="hl-blue">curva azul tracejada</span> é o prior (concentrada perto de valores baixos de θ, refletindo ceticismo sobre oráculos). A <span class="hl-gold">curva dourada sólida</span> é o posterior \x96 deslocada para a direita pela evidência de três predições corretas.</p>' +

  '<div class="concept-grid">' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--odin-blue)">Prior Forte, Dados Fracos</h4>' +
      '<p>Se o prior é muito informativo e os dados são poucos, o posterior fica perto do prior. O prior domina.</p>' +
    '</div>' +
    '<div class="concept-card">' +
      '<h4 style="color:var(--gold)">Prior Fraco, Dados Fortes</h4>' +
      '<p>Com prior vago e muitos dados, o posterior é guiado pela verossimilhança. Os dados dominam.</p>' +
    '</div>' +
  '</div>' +

  dialogue('thor', '🔨 ThorMento', 'Então a resposta é sempre "em algum lugar no meio"? Isso é indeciso demais. Eu quero um número só!') +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Você pode extrair estimativas pontuais do posterior: a <strong>média posterior</strong>, a <strong>mediana posterior</strong> ou o <strong>MAP</strong> (máximo a posteriori \x96 o pico). Mas a distribuição completa carrega informação mais rica do que qualquer número isolado.') +

  dialogue('corvo', '🪶 Muninn lembra:', 'Para pares <strong>conjugados</strong> de prior-verossimilhança, o posterior tem distribuição conhecida em forma fechada. Beta-Binomial é o clássico: prior Beta + verossimilhança Binomial = posterior Beta. Para modelos complexos, usamos <strong>MCMC</strong> (Monte Carlo via Cadeias de Markov) para amostrar do posterior numericamente.');
}


// ===== PASSO 7: ATUALIZAÇÃO SEQUENCIAL =====
function step7() {
  return '<div class="step-title">Passo 7: Atualização Sequencial \x96 O Tear que Nunca Para</div>' +

  '<p>Uma das propriedades mais elegantes da inferência bayesiana: <span class="hl-gold">o posterior de hoje se torna o prior de amanhã</span>. Conforme novos dados chegam, você simplesmente atualiza de novo. As Nornas nunca param de tecer.</p>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Isso é atualização sequencial, e é matematicamente equivalente a usar todos os dados de uma vez. Quer você processe observações uma por vez ou todas juntas, chega ao mesmo posterior. Essa é uma propriedade belíssima.') +

  '<div class="step-subtitle">🔄 O Oráculo, Rodada por Rodada</div>' +

  '<p>Vamos acompanhar o exemplo do oráculo Norna uma predição por vez. Começamos com P(Genuíno) = 0,10.</p>' +

  '<table class="data-table">' +
    '<tr>' +
      '<th>Rodada</th>' +
      '<th>Observação</th>' +
      '<th>Prior P(H)</th>' +
      '<th>Razão de Verossimilhança</th>' +
      '<th>Posterior P(H|D)</th>' +
    '</tr>' +
    '<tr>' +
      '<td>0</td>' +
      '<td>\x96 (sem dados)</td>' +
      '<td class="hl-blue">0,100</td>' +
      '<td>\x96</td>' +
      '<td class="hl-blue">0,100</td>' +
    '</tr>' +
    '<tr>' +
      '<td>1</td>' +
      '<td>✅ Acerto</td>' +
      '<td>0,100</td>' +
      '<td>0,90 / 0,50 = 1,80</td>' +
      '<td class="hl-gold">0,167</td>' +
    '</tr>' +
    '<tr>' +
      '<td>2</td>' +
      '<td>✅ Acerto</td>' +
      '<td>0,167</td>' +
      '<td>0,90 / 0,50 = 1,80</td>' +
      '<td class="hl-gold">0,265</td>' +
    '</tr>' +
    '<tr>' +
      '<td>3</td>' +
      '<td>✅ Acerto</td>' +
      '<td>0,265</td>' +
      '<td>0,90 / 0,50 = 1,80</td>' +
      '<td class="hl-gold">0,393</td>' +
    '</tr>' +
  '</table>' +

  '<p>Cada predição correta multiplica as <strong>chances a priori</strong> pela <strong>razão de verossimilhança</strong> (0,90/0,50 = 1,80). Após três rodadas, chegamos ao mesmo 0,393 calculado antes \x96 confirmando que a atualização sequencial e a em lote são equivalentes.</p>' +

  '<div class="visual-container">' + buildSequentialSVG() + '</div>' +

  '<p>As distribuições acima mostram a curva de crença se deslocando para a direita a cada nova evidência. Note como as curvas também ficam mais <em>estreitas</em> \x96 conforme mais dados se acumulam, a incerteza diminui.</p>' +

  dialogue('thor', '🔨 ThorMento', 'Espera \x96 se posso ir atualizando, quer dizer que posso parar de coletar dados quando o resultado parecer bom?') +

  dialogue('corvo', '🪶 Huginn provoca:', 'Na verdade, a atualização sequencial bayesiana <strong>não</strong> infla o erro Tipo I da forma que a parada opcional faz no NHST frequentista. O posterior é válido em qualquer ponto de parada. <em>Porém</em>, isso não significa que você deva parar quando os resultados te favorecem \x96 isso continua sendo cientificamente duvidoso. Pré-registrar sua regra de parada permanece boa prática.') +

  '<div class="correct-box">' +
    '<div class="correct-title">✅ Implicação Prática</div>' +
    '<p>A atualização sequencial é o motivo pelo qual métodos bayesianos se destacam em:</p>' +
    '<ul style="margin:8px 0 0 20px">' +
      '<li><strong>Ensaios clínicos</strong> \x96 atualizar conforme pacientes são incluídos, parar quando a evidência for suficiente</li>' +
      '<li><strong>Testes A/B</strong> \x96 monitorar resultados continuamente sem penalidades por múltiplas inspeções</li>' +
      '<li><strong>Dados de sensores</strong> \x96 atualização em tempo real das estimativas conforme leituras chegam</li>' +
    '</ul>' +
  '</div>';
}


// ===== PASSO 8: INTERVALOS DE CREDIBILIDADE VS CONFIANÇA =====
function step8() {
  return '<div class="step-title">Passo 8: Intervalo de Credibilidade vs. Intervalo de Confiança</div>' +

  '<p>Aqui reside uma das distinções mais importantes (e mais confundidas) de toda a estatística. Ambos fornecem uma faixa de valores plausíveis, mas significam <em>coisas fundamentalmente diferentes</em>.</p>' +

  '<div class="visual-container">' + buildCrIvsCISVG() + '</div>' +

  '<table class="data-table">' +
    '<tr>' +
      '<th>Característica</th>' +
      '<th style="color:var(--odin-blue)">IC 95% (Confiança)</th>' +
      '<th style="color:var(--gold)">ICr 95% (Credibilidade)</th>' +
    '</tr>' +
    '<tr>' +
      '<td>Interpretação</td>' +
      '<td>95% dos ICs de experimentos repetidos conteriam θ</td>' +
      '<td>95% de probabilidade de que θ esteja neste intervalo</td>' +
    '</tr>' +
    '<tr>' +
      '<td>Afirmação probabilística sobre θ?</td>' +
      '<td class="hl-red">Não (θ é fixo)</td>' +
      '<td class="hl-green">Sim (θ tem distribuição)</td>' +
    '</tr>' +
    '<tr>' +
      '<td>Depende do prior?</td>' +
      '<td>Não</td>' +
      '<td>Sim</td>' +
    '</tr>' +
    '<tr>' +
      '<td>Com prior plano</td>' +
      '<td>n/a</td>' +
      '<td>Numericamente similar ao IC</td>' +
    '</tr>' +
    '<tr>' +
      '<td>Posso dizer "95% de chance de θ estar aqui"?</td>' +
      '<td class="hl-red">Não!</td>' +
      '<td class="hl-green">Sim!</td>' +
    '</tr>' +
  '</table>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'O <span class="hl-gold">intervalo de credibilidade de 95%</span> (ICr) bayesiano dá exatamente o que a maioria dos pesquisadores <em>pensa</em> que um intervalo de confiança significa: "há 95% de probabilidade de o parâmetro estar nesta faixa." O IC tecnicamente só diz algo sobre o procedimento de longo prazo, não sobre <em>este</em> intervalo específico.') +

  dialogue('thor', '🔨 ThorMento', 'Todo mundo interpreta ICs como intervalos de credibilidade mesmo. Qual a diferença prática?') +

  dialogue('corvo', '🪶 Huginn provoca:', 'Quando a amostra é grande e o prior é fraco, frequentemente dão números parecidos. Mas a diferença conceitual é enorme: o ICr faz uma afirmação probabilística direta sobre o parâmetro. Essa é a pergunta que pesquisadores realmente querem responder.') +

  '<div class="step-subtitle">🎯 Intervalo de Maior Densidade (HDI)</div>' +
  '<p>O intervalo bayesiano mais comum é o <strong>HDI</strong> (Highest Density Interval): o menor intervalo que contém 95% da massa posterior. Todo ponto dentro do HDI tem maior densidade posterior que qualquer ponto fora dele.</p>' +

  '<div class="warning-box">' +
    '<div class="warning-title">⚠️ Armadilha de ThorMento: Interpretando o IC Errado</div>' +
    '<p>Dizer "há 95% de probabilidade de a média verdadeira estar entre 2,3 e 5,1" sobre um IC <em>frequentista</em> é incorreto. A média verdadeira ou está no intervalo ou não \x96 você simplesmente não sabe. Os 95% se referem à taxa de acerto do <em>método</em>, não a este intervalo particular.</p>' +
  '</div>';
}


// ===== PASSO 9: FATOR DE BAYES =====
function step9() {
  return '<div class="step-title">Passo 9: O Fator de Bayes \x96 Pesando Evidências Entre Hipóteses</div>' +

  '<p>Enquanto a distribuição posterior fala sobre valores de parâmetros, o <span class="hl-gold">Fator de Bayes</span> (BF) diz o quanto os dados apoiam um <em>modelo</em> (ou hipótese) em relação a outro.</p>' +

  '<div class="formula">' +
    '<div class="formula-label">Fator de Bayes</div>' +
    'BF₁₀ = P(D | H₁) / P(D | H₀)' +
  '</div>' +

  '<p>BF₁₀ = 5 significa: "os dados são <strong>5 vezes mais prováveis</strong> sob H₁ do que sob H₀." Diferente de p-values, o BF pode fornecer evidência <em>a favor</em> da hipótese nula (quando BF < 1).</p>' +

  dialogue('odin', '🧙‍♂️ Odin Dinho', 'Essa é uma vantagem crítica. Um p-value só pode rejeitar ou não rejeitar H₀. Um Fator de Bayes pode quantificar evidência <em>a favor de</em> H₀. No nosso exemplo do oráculo:') +

  '<div class="formula">' +
    '<div class="formula-label">Exemplo do Oráculo</div>' +
    'BF₁₀ = P(D | Genuíno) / P(D | Falso) = 0,729 / 0,125 = <span class="hl-gold" style="font-size:1.3rem">5,83</span>' +
  '</div>' +

  '<p>Os dados são 5,83 vezes mais prováveis se o oráculo é genuíno do que se é falso. Isso é <strong>evidência moderada</strong> segundo a escala de Jeffreys:</p>' +

  '<div class="visual-container">' + buildBayesFactorSVG() + '</div>' +

  '<table class="data-table">' +
    '<tr><th>Faixa de BF₁₀</th><th>Categoria de Evidência</th><th>Interpretação</th></tr>' +
    '<tr><td>1 \x96 3</td><td style="color:var(--text-dim)">Anedótica</td><td>Quase não vale mencionar</td></tr>' +
    '<tr><td>3 \x96 10</td><td style="color:var(--odin-blue)">Moderada</td><td>Notável mas não decisiva</td></tr>' +
    '<tr><td>10 \x96 30</td><td style="color:var(--corvo-purple)">Forte</td><td>Evidência convincente</td></tr>' +
    '<tr><td>30 \x96 100</td><td style="color:var(--gold)">Muito Forte</td><td>Difícil de contestar</td></tr>' +
    '<tr><td>> 100</td><td style="color:var(--thor-red)">Extrema</td><td>Decisiva, esmagadora</td></tr>' +
  '</table>' +

  dialogue('thor', '🔨 ThorMento', 'Então BF = 5,83 é só "moderado"? Com meu martelo de p-value eu obteria p < 0,05 e chamaria de significativo!') +

  dialogue('corvo', '🪶 Huginn provoca:', 'Exatamente o problema, ThorMento. O BF é mais honesto sobre a força da evidência. "Moderada" é frequentemente tudo o que temos. E note: BF₁₀ < 1 (ex.: BF = 0,2) significa que os dados favorecem H₀. Você pode reportar BF₀₁ = 1/0,2 = 5 como evidência <em>apoiando</em> a nula. P-values não conseguem fazer isso.') +

  '<div class="correct-box">' +
    '<div class="correct-title">✅ BF e Chances Posteriores</div>' +
    '<p>O Fator de Bayes conecta chances a priori a chances posteriores:</p>' +
    '<p style="text-align:center; font-size:1.1rem; color:var(--gold); margin:8px 0;"><strong>Chances Posteriores = BF × Chances a Priori</strong></p>' +

var stepFunctions = [step0, step1, step2, step3, step4, step5, step6, step7, step8, step9, step10, step11];

var stepNames = [
  'Introdução',
  'Frequentista vs. Bayesiana',
  'Teorema de Bayes',
  'Exemplo Nórdico',
  'Distribuições A Priori',
  'Verossimilhança',
  'Distribuição Posterior',
  'Atualização Sequencial',
  'Credibilidade vs. Confiança',
  'Fator de Bayes',
  'Aplicações Práticas',
  'Lição dos Corvos'
];

var totalSteps = 12;
var currentStep = 0;

// ===== NAVEGAÇÃO =====
function renderStep() {
  var content = document.getElementById('stepContent');
  content.innerHTML = stepFunctions[currentStep]();
  content.style.animation = 'none';
  content.offsetHeight;
  content.style.animation = 'fadeIn 0.4s ease';

  document.getElementById('progressLabel').textContent = 'Passo ' + currentStep + ' de ' + (totalSteps - 1) + ' \x96 ' + stepNames[currentStep];
  document.getElementById('progressFill').style.width = (currentStep / (totalSteps - 1) * 100) + '%';

  document.getElementById('btnBack').disabled = currentStep === 0;
  document.getElementById('btnNext').textContent = currentStep === totalSteps - 1 ? 'Reiniciar ↻' : 'Próximo ▶';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  if (currentStep >= totalSteps - 1) {
    currentStep = 0;
  } else {
    currentStep++;
  }
  renderStep();
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

// Navegação por teclado
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
});

// Inicializar
renderStep();
</script>
