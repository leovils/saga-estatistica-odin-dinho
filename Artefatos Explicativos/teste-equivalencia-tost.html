<style>

* { margin:0; padding:0; box-sizing:border-box; }

body {

  color: var(--text);

.container {

.progress-bar-container {

  top: 0;

.progress-label {

  margin-bottom: 6px;

}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-panel);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--odin-blue), var(--gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* STEP CONTENT */

  min-height: 60vh;
  padding: 30px 0;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }

}

.step-title {
  font-family: 'Bangers', cursive;

  letter-spacing: 1px;
}

.step-subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.3rem;
  color: var(--odin-blue);
  margin-bottom: 15px;
}

/* DIALOGUE BOXES */

  border-radius: 12px;
  padding: 16px 20px;
  margin: 16px 0;
  border-left: 4px solid;

}

.dialogue-box.odin {
  background: rgba(88,166,255,0.08);
  border-left-color: var(--odin-blue);
}
.dialogue-box.thor {
  background: rgba(248,81,73,0.08);
  border-left-color: var(--thor-red);

.dialogue-box.corvo {

  border-left-color: var(--corvo-purple);

  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 1rem;
}

.data-table th, .data-table td {

.data-table th {

  color: var(--text-dim);

/* NUMBER LINE */

.fade-in {

<body>

<div class="container">
  <div class="progress-bar-container">
    <div class="progress-label" id="progressLabel">Passo 0 de 10</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="step-content" id="stepContent"></div>

  <div class="nav-buttons">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled>&#9664; Voltar</button>
    <button class="nav-btn primary" id="btnNext" onclick="goNext()">Avançar &#9654;</button>
  </div>

  <div class="signature">
    Prof. Dr. Leonardo Vils &middot; PPGA &middot; UNINOVE &middot; MTPQI &middot; 2026
  </div>
</div>

<script>
// ===== DATA =====
// Two forges: Asgard and Alfheim
const asgard = { name: 'Asgard', M: 752, SD: 18, n: 20, color: 'var(--asgard-color)', hex: '#58a6ff' };
const alfheim = { name: 'Alfheim', M: 748, SD: 20, n: 20, color: 'var(--alfheim-color)', hex: '#3fb950' };

const SESOI = 10; // +/- 10 degrees
const diff = asgard.M - alfheim.M; // 4
const SE = Math.sqrt((asgard.SD * asgard.SD / asgard.n) + (alfheim.SD * alfheim.SD / alfheim.n));
// SE = sqrt(324/20 + 400/20) = sqrt(16.2 + 20) = sqrt(36.2) = 6.0166...

// Welch degrees of freedom approximation
const s1sq_n = (asgard.SD * asgard.SD) / asgard.n; // 16.2
const s2sq_n = (alfheim.SD * alfheim.SD) / alfheim.n; // 20
const dfNum = Math.pow(s1sq_n + s2sq_n, 2);
const dfDen = (Math.pow(s1sq_n, 2) / (asgard.n - 1)) + (Math.pow(s2sq_n, 2) / (alfheim.n - 1));
const df_welch = dfNum / dfDen; // ~37.16

// TOST: Two one-sided tests
// Test 1: H01: delta <= -SESOI => t1 = (diff - (-SESOI)) / SE = (4+10)/6.0166 = 14/6.0166 = 2.327
// Test 2: H02: delta >= +SESOI => t2 = (diff - (+SESOI)) / SE = (4-10)/6.0166 = -6/6.0166 = -0.9972
const t1 = (diff - (-SESOI)) / SE;
const t2 = (diff - SESOI) / SE;

// 90% CI for equivalence: diff +/- t_crit(0.05, df) * SE
// t_crit(0.05, ~37) ≈ 1.687
const t_crit_90 = 1.687;
const ci90_lower = diff - t_crit_90 * SE;
const ci90_upper = diff + t_crit_90 * SE;

// p-value approximation using t distribution
function tDistCDF(t, df) {
  // Regularized incomplete beta function approximation
  const x = df / (df + t * t);
  if (t < 0) return 0.5 * betaInc(x, df/2, 0.5);
  return 1 - 0.5 * betaInc(x, df/2, 0.5);
}

function betaInc(x, a, b) {
  // Continued fraction approximation for regularized incomplete beta
  if (x === 0 || x === 1) return x === 0 ? 0 : 1;
  const lnBeta = gammln(a) + gammln(b) - gammln(a + b);
  const front = Math.exp(Math.log(x) * a + Math.log(1 - x) * b - lnBeta);
  // Lentz's continued fraction
  let f = 1, c = 1, d = 0;
  for (let m = 0; m <= 200; m++) {
    let numerator;
    if (m === 0) {
      numerator = 1;
    } else {
      const m2 = 2 * Math.ceil(m / 2);
      const k = Math.ceil(m / 2);
      if (m % 2 === 1) {
        numerator = -(a + k - 1 + k) * x / ((a + m2 - 2) * (a + m2 - 1));
        numerator = (a + k - 1) * (a + b + k - 1) * x / ((a + 2*k - 2) * (a + 2*k - 1));
        numerator = -numerator;
      } else {
        numerator = k * (b - k) * x / ((a + 2*k - 1) * (a + 2*k));
      }
    }
    d = 1 + numerator * d;
    if (Math.abs(d) < 1e-30) d = 1e-30;
    d = 1 / d;
    c = 1 + numerator / c;
    if (Math.abs(c) < 1e-30) c = 1e-30;
    const delta = c * d;
    f *= delta;
    if (Math.abs(delta - 1) < 1e-10) break;
  }
  return front * f / a;
}

function gammln(x) {
  const c = [76.18009172947146,-86.50532032941677,24.01409824083091,
    -1.231739572450155,0.001208650973866179,-0.000005395239384953];
  let y = x, tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) ser += c[j] / (++y);
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}

// p-values for TOST
// p1 = P(T > t1) when t1 > 0 => 1 - CDF(t1, df)
// p2 = P(T < t2) when t2 < 0 => CDF(t2, df) but we want P(T < t2) = 1 - P(T > |t2|)
// For TOST, the p-value for each one-sided test:
// p1 (upper test): we want small p => P(T >= t1 | H01) for rejecting H01
// p2 (lower test): we want small p => P(T <= t2 | H02) for rejecting H02
// Simpler: p_tost = max(p1, p2) where
// p1 = 1 - CDF(t1, df) for testing diff >= -SESOI (reject left bound)
// p2 = CDF(t2, df) for testing diff <= +SESOI (reject right bound)

// Using pre-calculated values for accuracy
const p1_val = 0.0127; // one-sided p for t1=2.327, df~37
const p2_val = 0.1625; // one-sided p for t2=-0.997, df~37
const p_tost = Math.max(p1_val, p2_val);

function r(v, d=2) { return Number(v).toFixed(d); }
function r4(v) { return Number(v).toFixed(4); }

// ===== DIALOGUE HELPER =====
function dialogue(character, name, text) {
  return `<div class="dialogue-box ${character}">
    <div class="char-name ${character}">${name}</div>
    <div class="dialogue-text">${text}</div>
  </div>`;
}

// ===== STEP FUNCTIONS =====
const totalSteps = 11; // 0..10
let currentStep = 0;

function step0() {
  return `
    <div class="step-title">A Ponte de Bifrost: "Igual" ou Apenas "Sem Diferenca"?</div>

    <p>Na Ponte de Bifrost, dois mestres ferreiros &mdash; <span class="hl-blue">Asgard</span> e <span class="hl-green">Alfheim</span> &mdash; clamam que suas receitas de hidromel produzem temperaturas de forja <em>equivalentes</em>. Odin Dinho precisa provar que as forjas sao realmente iguais &mdash; nao apenas que nao encontrou diferenca.</p>

    ${dialogue('thor', '&#9889; ThorMento', 'Facil! Rodo um teste t, p = 0,53 &mdash; nao significativo. Pronto: as forjas sao iguais! Caso encerrado.')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', '<strong>ERRADO.</strong> Esse e o erro mais perigoso da estatistica frequentista. <em>Nao rejeitar H&#8320;</em> NAO e o mesmo que <em>confirmar H&#8320;</em>. Um p > 0,05 pode significar tres coisas:<br><br>1. As forjas sao realmente iguais<br>2. Sua amostra e pequena demais para detectar a diferenca<br>3. Existe uma diferenca, mas o poder do teste e baixo<br><br>Ausencia de evidencia <strong>nao e</strong> evidencia de ausencia.')}

    <div class="visual-container">
      <svg viewBox="0 0 700 180" width="700">
        <!-- Two contrasting boxes -->
        <rect x="20" y="20" width="310" height="140" rx="12" fill="none" stroke="${'#f85149'}" stroke-width="2" stroke-dasharray="5"/>
        <text x="175" y="55" fill="#f85149" font-size="16" text-anchor="middle" font-family="Bangers">NHST (Teste t classico)</text>
        <text x="175" y="80" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Patrick Hand">p > 0,05</text>
        <text x="175" y="100" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Patrick Hand">"Nao encontrei diferenca"</text>
        <text x="175" y="125" fill="#f85149" font-size="14" text-anchor="middle" font-family="Permanent Marker">&#8800; "Sao iguais"</text>
        <text x="175" y="148" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">Pode ser falta de poder!</text>

        <rect x="370" y="20" width="310" height="140" rx="12" fill="none" stroke="#3fb950" stroke-width="2"/>
        <text x="525" y="55" fill="#3fb950" font-size="16" text-anchor="middle" font-family="Bangers">TOST (Equivalencia)</text>
        <text x="525" y="80" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="Patrick Hand">90% IC dentro dos limites</text>
        <text x="525" y="100" fill="#8b949e" font-size="12" text-anchor="middle" font-family="Patrick Hand">"Provei que a diferenca e trivial"</text>
        <text x="525" y="125" fill="#3fb950" font-size="14" text-anchor="middle" font-family="Permanent Marker">= "Sao equivalentes"</text>
        <text x="525" y="148" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">Evidencia positiva de igualdade</text>

        <!-- Arrow -->
        <text x="350" y="95" fill="#f0c040" font-size="24" text-anchor="middle" font-family="Bangers">&#8800;</text>
      </svg>
    </div>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'O TOST &mdash; <em>Two One-Sided Tests</em> &mdash; inverte a logica. Em vez de testar <strong>"sao diferentes?"</strong>, testa <strong>"a diferenca e pequena o suficiente para ser irrelevante?"</strong>. E a unica forma estatisticamente correta de concluir equivalencia.')}

    <p style="text-align:center;margin-top:10px"><span class="hl-gold">Nosso cenario:</span> Forja de Asgard (M=752&#176;, SD=18, n=20) vs. Forja de Alfheim (M=748&#176;, SD=20, n=20)</p>
  `;
}

function step1() {
  return `
    <div class="step-title">Passo 1: SESOI &mdash; O Menor Efeito de Interesse</div>

    <p class="step-subtitle">Smallest Effect Size of Interest</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Antes de qualquer calculo, precisamos responder: <strong>qual diferenca seria grande o suficiente para importar na pratica?</strong> Esse limiar se chama SESOI. E uma decisao de <em>dominio</em>, nao de estatistica.')}

    <div class="formula">
      <div class="formula-label">Definicao</div>
      SESOI = &Delta;<sub>L</sub> = Menor diferenca que tem consequencia pratica
    </div>

    <p>No nosso caso: o mestre ferreiro de Asgard diz que qualquer diferenca de temperatura <strong>ate 10 graus</strong> nao altera a qualidade da espada forjada. Por outro lado, acima de 10 graus muda a tempera do aco.</p>

    <div class="formula" style="font-size:1.3rem">
      SESOI = <span class="hl-gold">&plusmn;10 graus</span>
    </div>

    <div class="visual-container">
      <svg viewBox="0 0 700 160" width="700">
        <!-- Number line -->
        <line x1="50" y1="80" x2="650" y2="80" stroke="#30363d" stroke-width="2"/>

        <!-- Ticks -->
        ${[-20,-15,-10,-5,0,5,10,15,20].map(v => {
          const x = 350 + v * 15;
          const isLimit = Math.abs(v) === 10;
          const col = isLimit ? '#f0c040' : '#8b949e';
          return `<line x1="${x}" y1="72" x2="${x}" y2="88" stroke="${col}" stroke-width="${isLimit ? 3 : 1}"/>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'O SESOI e a fronteira entre "irrelevante" e "relevante". Se a diferenca verdadeira estiver dentro de [&minus;SESOI, +SESOI], consideramos os grupos <em>praticamente equivalentes</em> &mdash; mesmo que nao sejam identicos.')}

}

function step4() {
  return `
    <div class="step-title">Passo 4: Calculo Passo a Passo</div>

    <p class="step-subtitle">Usando os dados das forjas de Bifrost</p>

    <table class="data-table">
      <tr>
        <th></th>
        <th>Media (M)</th>
        <th>Desvio-padrao (SD)</th>
        <th>n</th>
      </tr>
      <tr>
        <td style="font-family:'Permanent Marker';color:var(--asgard-color)">Forja de Asgard</td>
        <td>752&#176;</td>
        <td>18</td>
        <td>20</td>
      </tr>
      <tr>
        <td style="font-family:'Permanent Marker';color:var(--alfheim-color)">Forja de Alfheim</td>
        <td>748&#176;</td>
        <td>20</td>
        <td>20</td>
      </tr>
    </table>

    <p style="text-align:center"><span class="hl-gold">SESOI = &plusmn;10 graus</span></p>

    <!-- Step 4a: Difference -->
    <div class="formula">
      <div class="formula-label">1. Diferenca observada</div>
      &Delta; = M<sub>Asgard</sub> &minus; M<sub>Alfheim</sub> = 752 &minus; 748 = <span class="hl-gold">${r(diff)}</span>
    </div>

    <!-- Step 4b: SE -->
    <div class="formula">
      <div class="formula-label">2. Erro-padrao da diferenca</div>
      SE = &radic;(SD&#178;<sub>1</sub>/n<sub>1</sub> + SD&#178;<sub>2</sub>/n<sub>2</sub>) = &radic;(324/20 + 400/20) = &radic;(16,2 + 20) = &radic;36,2 = <span class="hl-gold">${r(SE, 4)}</span>
    </div>

    <!-- Step 4c: t-values -->
    <div class="formula">
      <div class="formula-label">3. Estatistica t&#8321; (limite inferior)</div>
      t&#8321; = (&Delta; &minus; (&minus;SESOI)) / SE = (4 &minus; (&minus;10)) / ${r(SE, 4)} = 14 / ${r(SE, 4)} = <span class="hl-blue">${r(t1, 4)}</span>
    </div>

    <div class="formula">
      <div class="formula-label">4. Estatistica t&#8322; (limite superior)</div>
      t&#8322; = (&Delta; &minus; (+SESOI)) / SE = (4 &minus; 10) / ${r(SE, 4)} = &minus;6 / ${r(SE, 4)} = <span class="hl-green">${r(t2, 4)}</span>
    </div>

    <!-- Step 4d: df -->
    <div class="formula">
      <div class="formula-label">5. Graus de liberdade (Welch)</div>
      df = (s&#178;<sub>1</sub>/n<sub>1</sub> + s&#178;<sub>2</sub>/n<sub>2</sub>)&#178; / [(s&#178;<sub>1</sub>/n<sub>1</sub>)&#178;/(n<sub>1</sub>&minus;1) + (s&#178;<sub>2</sub>/n<sub>2</sub>)&#178;/(n<sub>2</sub>&minus;1)] = <span class="hl-gold">${r(df_welch, 2)}</span>
    </div>

    <!-- Step 4e: 90% CI -->
    <div class="formula">
      <div class="formula-label">6. IC de 90%</div>
      IC<sub>90%</sub> = &Delta; &plusmn; t<sub>crit(0,05; ${r(df_welch,0)})</sub> &times; SE = 4 &plusmn; ${t_crit_90} &times; ${r(SE,4)}<br>
      IC<sub>90%</sub> = [<span class="hl-gold">${r(ci90_lower, 2)}</span> ; <span class="hl-gold">${r(ci90_upper, 2)}</span>]
    </div>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Agora a pergunta crucial: o IC de 90% [${r(ci90_lower,2)} ; ${r(ci90_upper,2)}] cai inteiramente dentro de [&minus;10 ; +10]?<br><br><strong>Limite inferior do IC = ${r(ci90_lower,2)}</strong> &mdash; esta acima de &minus;10? <span class="hl-green">Sim! &#10003;</span><br><strong>Limite superior do IC = ${r(ci90_upper,2)}</strong> &mdash; esta abaixo de +10? <span class="hl-red">Nao! &#10007; Excede por ${r(ci90_upper - 10, 2)} graus</span><br><br>O IC <strong>nao</strong> cabe inteiramente na zona de equivalencia. Resultado: <strong>inconclusivo</strong>.')}

    ${dialogue('thor', '&#9889; ThorMento', 'Mas a diferenca e so 4 graus! Obvio que sao iguais!')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'A diferenca <em>pontual</em> e 4, sim. Mas a <em>incerteza</em> ao redor dessa estimativa se estende ate ${r(ci90_upper,2)}. Com n = 20 por grupo, nao temos precisao suficiente para excluir que a diferenca real possa ser maior que 10. Precisariamos de mais guerreiros testando as forjas &mdash; ou de forjas com menor variabilidade.')}

    <div class="visual-container">
      <svg viewBox="0 0 700 130" width="700">
        <!-- Number line -->
        <line x1="50" y1="60" x2="650" y2="60" stroke="#30363d" stroke-width="2"/>

        <!-- Scale: -15 to +15 mapped to 50..650, but we need to go to ~15 to show the CI -->
        ${[-15,-10,-5,0,5,10,15].map(v => {
          const x = 350 + v * 18;
          const isLimit = Math.abs(v) === 10;
          return `<line x1="${x}" y1="52" x2="${x}" y2="68" stroke="${isLimit ? '#f0c040' : '#8b949e'}" stroke-width="${isLimit ? 2 : 1}"/>
                  <text x="${x}" y="85" fill="${isLimit ? '#f0c040' : '#8b949e'}" font-size="${isLimit ? 12 : 10}" text-anchor="middle" font-family="${isLimit ? 'Permanent Marker' : 'Patrick Hand'}">${v > 0 ? '+' : ''}${v}</text>`;
        }).join('')}

        <!-- Equivalence zone -->
        <rect x="${350-10*18}" y="40" width="${20*18}" height="40" rx="6" fill="#3fb950" opacity="0.1"/>

        <!-- 90% CI bar - extends beyond +10 -->
        <line x1="${350 + ci90_lower * 18}" y1="60" x2="${350 + ci90_upper * 18}" y2="60" stroke="#f85149" stroke-width="8" stroke-linecap="round"/>
        <!-- portion inside bounds in blue -->
        <line x1="${350 + ci90_lower * 18}" y1="60" x2="${350 + 10 * 18}" y2="60" stroke="#58a6ff" stroke-width="8" stroke-linecap="round"/>
        <circle cx="${350 + diff * 18}" cy="60" r="5" fill="#e6edf3"/>

        <!-- CI labels -->
        <text x="${350 + ci90_lower * 18}" y="35" fill="#58a6ff" font-size="10" text-anchor="middle" font-family="Permanent Marker">${r(ci90_lower,2)}</text>
        <text x="${350 + ci90_upper * 18}" y="35" fill="#f85149" font-size="10" text-anchor="middle" font-family="Permanent Marker">${r(ci90_upper,2)}</text>
        <text x="${350 + diff * 18}" y="110" fill="#e6edf3" font-size="11" text-anchor="middle" font-family="Permanent Marker">&Delta; = ${diff}</text>

        <!-- Overshoot annotation -->
        <line x1="${350 + 10*18}" y1="44" x2="${350 + ci90_upper*18}" y2="44" stroke="#f85149" stroke-width="2"/>
        <text x="${350 + (10 + ci90_upper)/2 * 18}" y="38" fill="#f85149" font-size="9" text-anchor="middle" font-family="Permanent Marker">excede!</text>

        <!-- Result -->
        <text x="350" y="125" fill="#f0c040" font-size="13" text-anchor="middle" font-family="Bangers">&#10007; IC ULTRAPASSA +SESOI &mdash; INCONCLUSIVO</text>
      </svg>
    </div>
  `;
}

function step5() {
  return `
    <div class="step-title">Passo 5: Os 4 Quadrantes NHST x TOST</div>

    <p class="step-subtitle">O cruzamento que todo pesquisador precisa entender</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Quando cruzamos os resultados do NHST (teste t classico) com os do TOST, surgem <strong>quatro cenarios possiveis</strong>. Cada um tem uma interpretacao diferente &mdash; e apenas dois sao conclusivos.')}

        <span style="font-size:0.9rem">Diferenca significativa<br><strong>E</strong> nao equivalente.<br>Diferenca real e relevante.</span>
      </div>
    </div>

    ${dialogue('thor', '&#9889; ThorMento', 'Espera &mdash; pode ser significativo E equivalente ao mesmo tempo?!')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Sim! Com amostras muito grandes, uma diferenca minuscula (digamos, 0,3 graus) pode dar p < 0,05 no NHST, mas o TOST confirma equivalencia porque 0,3 esta bem dentro de &plusmn;10. E a diferenca entre <strong>significancia estatistica</strong> e <strong>relevancia pratica</strong> &mdash; o calcanhar de Aquiles do NHST.')}

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'O quadrante mais perigoso e o <strong>inconclusivo</strong> (p > 0,05 no NHST, sem equivalencia no TOST). E onde a maioria dos pesquisadores para &mdash; dizendo "nao ha diferenca" sem ter provado nada. O TOST transforma essa zona cinzenta em transparencia.')}

    <div class="info-card" style="border-color:var(--gold)">
      <div class="info-card-title" style="color:var(--gold)">Nosso resultado das forjas</div>
      <p>NHST: p = 0,53 (nao significativo) + TOST: IC<sub>90%</sub> [${r(ci90_lower,2)} ; ${r(ci90_upper,2)}] <strong>ultrapassa</strong> +SESOI (nao equivalente)<br>
      <strong>&rarr; Quadrante superior-direito: <span class="hl-gold">Inconclusivo!</span></strong> Sem diferenca significativa, mas tambem sem equivalencia. Precisamos de mais dados.</p>
    </div>
  `;
}

function step6() {
  return `
    <div class="step-title">Passo 6: TOST Pareado</div>

    <p class="step-subtitle">Quando os mesmos guerreiros sao testados duas vezes</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'O TOST independente compara dois grupos distintos. Mas e se os mesmos guerreiros testarem as duas forjas? Nesse caso, usamos o <strong>TOST pareado</strong> &mdash; baseado nas diferencas individuais.')}

    <div class="info-card">
      <div class="info-card-title">Cenario Pareado</div>
      <p>20 guerreiros forjaram uma espada em cada forja. Para cada guerreiro, calculamos:<br>
      <span class="hl-gold">d<sub>i</sub> = temperatura<sub>Asgard</sub> &minus; temperatura<sub>Alfheim</sub></span></p>
    </div>

    <table class="data-table" style="font-size:0.9rem">
      <tr>
        <th>Guerreiro</th>
        <th>Asgard</th>
        <th>Alfheim</th>
        <th>d<sub>i</sub></th>
      </tr>
      <tr><td>Bjorn</td><td>755</td><td>750</td><td style="color:var(--gold)">+5</td></tr>
      <tr><td>Ragnar</td><td>748</td><td>752</td><td style="color:var(--gold)">&minus;4</td></tr>
      <tr><td>Sigurd</td><td>760</td><td>755</td><td style="color:var(--gold)">+5</td></tr>
      <tr><td>Ivar</td><td>745</td><td>743</td><td style="color:var(--gold)">+2</td></tr>
      <tr><td>...</td><td>...</td><td>...</td><td>...</td></tr>
      <tr class="mean-row">
        <td colspan="3" style="text-align:right">M<sub>d</sub> =</td>
        <td style="color:var(--gold)">3,5</td>
      </tr>
    </table>

    <div class="formula">
      <div class="formula-label">Formulas do TOST Pareado</div>
      SE<sub>d</sub> = SD<sub>d</sub> / &radic;n<br><br>
      t&#8321; = (M<sub>d</sub> &minus; (&minus;SESOI)) / SE<sub>d</sub><br>
      t&#8322; = (M<sub>d</sub> &minus; (+SESOI)) / SE<sub>d</sub><br><br>
      df = n &minus; 1
    </div>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'A logica e identica ao TOST independente &mdash; dois testes unilaterais, ambos devem rejeitar. A unica diferenca e que usamos a <strong>media e o desvio-padrao das diferencas pareadas</strong> em vez das medias dos grupos. O IC de 90% da diferenca media deve caber dentro de [&minus;SESOI, +SESOI].')}

    ${dialogue('thor', '&#9889; ThorMento', 'Ah, entao e so trocar os numeros e rodar a mesma coisa?')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Essencialmente sim, mas cuidado: o TOST pareado costuma ter <strong>mais poder</strong> que o independente porque elimina a variabilidade entre sujeitos. Se cada guerreiro serve como seu proprio controle, o SD<sub>d</sub> tende a ser menor que os SDs dos grupos.')}
  `;
}

function step7() {
  return `
    <div class="step-title">Passo 7: Escolhendo o SESOI</div>

    <p class="step-subtitle">Tres abordagens, um principio</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Definir o SESOI e a decisao mais importante do TOST &mdash; e a que exige mais pensamento. Existem tres abordagens classicas.')}

    <div class="approach-grid">
      <div class="approach-card" style="border-color:var(--odin-blue)">
        <h4 style="color:var(--odin-blue)">1. Baseada em Ancora</h4>
        <p style="font-size:0.95rem">Usa um criterio externo e significativo.<br><br>
        <em>Exemplo:</em> O mestre ferreiro define que &plusmn;10&#176; nao afeta a tempera do aco. Esse e o limiar pratico &mdash; a "ancora" vem do conhecimento de dominio.</p>
        <p style="color:var(--success);font-family:'Permanent Marker';margin-top:8px">&#10003; Preferida</p>
      </div>

      <div class="approach-card" style="border-color:var(--corvo-purple)">
        <h4 style="color:var(--corvo-purple)">2. Baseada na Distribuicao</h4>
        <p style="font-size:0.95rem">Usa a variabilidade dos dados como referencia.<br><br>
        <em>Exemplo:</em> SESOI = 0,5 &times; SD<sub>pooled</sub> (equivale a d = 0,5 de Cohen). E um criterio generico quando falta conhecimento especifico.</p>
        <p style="color:var(--gold);font-family:'Permanent Marker';margin-top:8px">&#9888; Aceitavel</p>
      </div>

      <div class="approach-card" style="border-color:var(--success)">
        <h4 style="color:var(--success)">3. Pratica / Clinica</h4>
        <p style="font-size:0.95rem">Baseada em consequencias reais.<br><br>
        <em>Exemplo:</em> Na medicina, a diferenca de 5mmHg na pressao arterial e o limiar para mudar tratamento. Na forja, &plusmn;10&#176; e o limiar para comprometer a espada.</p>
        <p style="color:var(--success);font-family:'Permanent Marker';margin-top:8px">&#10003; Preferida</p>
      </div>
    </div>

    ${dialogue('thor', '&#9889; ThorMento', 'Vou definir o SESOI <em>depois</em> de ver os dados. Se a diferenca for 8, coloco SESOI = &plusmn;9. Genial!')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', '<strong>Isso e SESOI hacking!</strong> Tao grave quanto p-hacking. O SESOI deve ser definido e justificado <em>antes</em> da coleta de dados &mdash; idealmente no pre-registro do estudo. Definir depois de ver os resultados invalida toda a logica inferencial.')}

    <div class="info-card" style="border-color:var(--thor-red)">
      <div class="info-card-title" style="color:var(--thor-red)">&#9888; Armadilha: SESOI Hacking</div>
      <p>Sinais de alerta:</p>
      <ul style="margin-left:20px;margin-top:6px">
        <li>SESOI definido depois da coleta</li>
        <li>SESOI exatamente maior que o IC observado</li>
        <li>Sem justificativa teorica ou pratica</li>
        <li>SESOI muda entre estudos sem explicacao</li>
      </ul>
    </div>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'Na duvida, use a regra de ouro: escolha o SESOI <em>mais estreito</em> que ainda faca sentido no seu dominio. Se voce erra para o lado conservador, a conclusao de equivalencia sera mais robusta. Equivalencia com SESOI apertado e muito mais convincente do que com SESOI frouxo.')}
  `;
}

function step8() {
  return `
    <div class="step-title">Passo 8: Poder do Teste de Equivalencia</div>

    <p class="step-subtitle">Por que voce precisa de MAIS participantes</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Aqui esta a surpresa desagradavel: testes de equivalencia exigem amostras <strong>substancialmente maiores</strong> do que testes de diferenca com o mesmo &alpha; e poder.')}

    <div class="formula">
      <div class="formula-label">Formula aproximada para n (por grupo)</div>
      n &ge; (t<sub>&alpha;</sub> + t<sub>&beta;</sub>)&#178; &times; 2&sigma;&#178; / (SESOI &minus; |&Delta;|)&#178;
    </div>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'A intuicao: num teste de diferenca, voce busca detectar um efeito. Num teste de equivalencia, voce busca <strong>excluir</strong> efeitos maiores que o SESOI. Excluir exige mais precisao &mdash; e precisao exige mais dados.')}

      <svg viewBox="0 0 700 250" width="700">

        <rect x="180" y="132" width="380" height="30" rx="6" fill="#3fb950" opacity="0.7"/>
        <text x="575" y="153" fill="#3fb950" font-size="13" font-family="Permanent Marker">n &#8776; 138/grupo</text>

        <!-- Multiplier annotation -->

        <text x="350" y="230" fill="#f0c040" font-size="12" text-anchor="middle" font-family="Permanent Marker">TOST exige ~2x mais dados que NHST para o mesmo poder!</text>
      </svg>
    </div>

    ${dialogue('thor', '&#9889; ThorMento', 'Isso e ridiculo! Mais guerreiros? O Jarl nao vai pagar por isso!')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Provar equivalencia e mais dificil do que detectar diferenca &mdash; e justo que seja. Pense: qualquer coisa pode ser "nao significativo" com n = 5. Mas demonstrar equivalencia exige precisao. Essa e a beleza do TOST &mdash; ele impede conclusoes apressadas de igualdade com amostras miseraveis.')}

    <div class="info-card">

}

function step9() {
  return `
    <div class="step-title">Passo 9: Reporte no Formato APA</div>

    <p class="step-subtitle">Como comunicar os resultados</p>

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Um reporte completo de TOST inclui: a diferenca observada, o SESOI justificado, ambos os testes unilaterais, o IC de 90%, e a conclusao explicita.')}

    <div class="apa-box">
      <div class="apa-label">Reporte APA &mdash; TOST para Amostras Independentes</div>
      <p>A temperatura media da forja de Asgard (<em>M</em> = 752, <em>SD</em> = 18, <em>n</em> = 20) e da forja de Alfheim (<em>M</em> = 748, <em>SD</em> = 20, <em>n</em> = 20) foram comparadas usando o procedimento TOST (Two One-Sided Tests) com limites de equivalencia de &Delta;<sub>L</sub> = &plusmn;10 graus, definidos a priori com base no limiar de alteracao da tempera do aco.</p>
      <p style="margin-top:10px">A diferenca observada foi <em>&Delta;</em> = 4,00 (SE = ${r(SE, 2)}). O teste unilateral inferior rejeitou H&#8320;&#8321;: &Delta; &le; &minus;10, <em>t</em><sub>1</sub>(${r(df_welch, 1)}) = ${r(t1, 2)}, <em>p</em><sub>1</sub> = 0,013. O teste unilateral superior nao rejeitou H&#8320;&#8322;: &Delta; &ge; +10, <em>t</em><sub>2</sub>(${r(df_welch, 1)}) = ${r(t2, 2)}, <em>p</em><sub>2</sub> = 0,163.</p>
      <p style="margin-top:10px">O IC de 90% para a diferenca [${r(ci90_lower, 2)}, ${r(ci90_upper, 2)}] <strong>nao</strong> caiu inteiramente dentro dos limites de equivalencia de &plusmn;10. Embora o limite inferior do IC esteja acima de &minus;10, o limite superior (${r(ci90_upper, 2)}) excede +10. Portanto, <strong>a equivalencia nao pode ser declarada</strong> com base neste criterio.</p>
      <p style="margin-top:10px;color:var(--gold);font-style:normal"><strong>Nota:</strong> O teste unilateral superior nao atingiu significancia (<em>p</em><sub>2</sub> = 0,163 > 0,05), confirmando que nao se pode rejeitar a hipotese de que a diferenca exceda o limite superior. O resultado e <em>inconclusivo</em> quanto a equivalencia.</p>
    </div>

    ${dialogue('thor', '&#9889; ThorMento', 'Perai! Voce disse que eram equivalentes no Passo 4!')}

    ${dialogue('odin', '&#129497;&#8205;&#9794;&#65039; Odin Dinho', 'Boa observacao, ThorMento. Vamos verificar com rigor. O IC de 90% e [${r(ci90_lower,2)}, ${r(ci90_upper,2)}]. O limite superior ${r(ci90_upper,2)} esta ${r(ci90_upper,2) > 10 ? "acima" : "abaixo"} de +10. ${r(ci90_upper,2) > 10 ? "Entao a equivalencia NAO pode ser declarada &mdash; o IC ultrapassa o limite superior por " + r(ci90_upper - 10, 2) + " graus." : "Esta dentro! Equivalencia confirmada."}<br><br>Isso mostra como o rigor numerico importa. Arredondar ou "arredondar para o lado que convem" e inaceitavel.')}

    <div class="info-card">
      <div class="info-card-title">Checklist do Reporte TOST</div>
      <table class="calc-table" style="font-size:0.9rem">
        <tr><th>#</th><th>Elemento</th><th>Nosso Exemplo</th></tr>
        <tr><td>1</td><td>SESOI justificado</td><td>&plusmn;10&#176; (limiar da tempera)</td></tr>
        <tr><td>2</td><td>Quando definido</td><td>A priori</td></tr>
        <tr><td>3</td><td>Diferenca observada (&Delta;)</td><td>4,00</td></tr>
        <tr><td>4</td><td>SE</td><td>${r(SE, 2)}</td></tr>
        <tr><td>5</td><td>t&#8321; e p&#8321;</td><td>${r(t1, 2)}, p = 0,013</td></tr>
        <tr><td>6</td><td>t&#8322; e p&#8322;</td><td>${r(t2, 2)}, p = 0,163</td></tr>
        <tr><td>7</td><td>IC de 90%</td><td>[${r(ci90_lower, 2)}, ${r(ci90_upper, 2)}]</td></tr>
        <tr><td>8</td><td>Conclusao</td><td style="color:var(--gold)">Inconclusivo</td></tr>
      </table>
    </div>

    ${dialogue('corvo', '&#128054;&#8205;&#11035; Muninn sussurra:', 'Note: o p do TOST e o <strong>maior</strong> entre p&#8321; e p&#8322;. Ambos precisam ser < &alpha;. Se apenas um rejeita, a equivalencia nao e declarada. No nosso caso, p&#8321; = 0,013 (rejeitou), mas p&#8322; = 0,163 (nao rejeitou). A forja de Asgard pode estar <em>ate</em> ${r(ci90_upper, 2)} graus acima de Alfheim &mdash; o que ultrapassa o SESOI de +10.')}

    <div class="info-card" style="border-color:var(--success)">
      <div class="info-card-title" style="color:var(--success)">E se quisessemos declarar equivalencia?</div>
      <p>Precisariamos de um IC mais estreito. Isso requer mais dados (n maior) ou menor variabilidade. Com n = 35 por grupo (mantendo os mesmos M e SD), o IC de 90% ficaria aproximadamente [0,4 ; 7,6] &mdash; dentro de &plusmn;10, permitindo a declaracao de equivalencia.</p>
    </div>
  `;
}

  return `

const stepFunctions = [step0, step1, step2, step3, step4, step5, step6, step7, step8, step9, step10];

function renderStep() {

  container.style.animation = 'none';
  container.offsetHeight; // trigger reflow
  container.style.animation = 'fadeIn 0.4s ease';
  container.innerHTML = stepFunctions[currentStep]();

  // Update progress
  const pct = (currentStep / (totalSteps - 1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = 'Passo ' + currentStep + ' de ' + (totalSteps - 1);

  // Update nav buttons
  document.getElementById('btnBack').disabled = currentStep === 0;
  const btnNext = document.getElementById('btnNext');
  if (currentStep === totalSteps - 1) {
    btnNext.textContent = '🏁 Fim';
    btnNext.disabled = true;
  } else {
    btnNext.textContent = 'Avançar ▶';
    btnNext.disabled = false;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  if (currentStep < totalSteps - 1) {
    currentStep++;
    renderStep();
  }
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    goNext();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goBack();
  }
});

// Initial render
renderStep();
</script>
</body>
</html>
