<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regressão Linear Múltipla — Passo a Passo | Odin Dinho</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0d1117;
  --bg-card: #161b22;
  --bg-panel: #1c2333;
  --odin-blue: #58a6ff;
  --thor-red: #f85149;
  --corvo-purple: #bc8cff;
  --gold: #f0c040;
  --silver: #8b949e;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --success: #3fb950;
  --border: #30363d;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Patrick Hand', cursive;
  font-size: 18px;
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* PROGRESS BAR */
.progress-bar-container {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-dark);
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--border);
}

.progress-label {
  font-family: 'Permanent Marker', cursive;
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-align: center;
}

.progress-track {
  width: 100%;
  height: 8px;
  background: var(--bg-panel);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--odin-blue), var(--gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}

/* STEP CONTENT */
.step-content {
  min-height: 60vh;
  padding: 30px 0;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-title {
  font-family: 'Bangers', cursive;
  font-size: 2.2rem;
  color: var(--gold);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.step-subtitle {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.3rem;
  color: var(--odin-blue);
  margin-bottom: 15px;
}

/* DIALOGUE BOXES */
.dialogue-box {
  border-radius: 12px;
  padding: 16px 20px;
  margin: 16px 0;
  border-left: 4px solid;
  position: relative;
}

.dialogue-box.odin {
  background: rgba(88,166,255,0.08);
  border-left-color: var(--odin-blue);
}
.dialogue-box.thor {
  background: rgba(248,81,73,0.08);
  border-left-color: var(--thor-red);
}
.dialogue-box.corvo {
  background: rgba(188,140,255,0.08);
  border-left-color: var(--corvo-purple);
}

.char-name {
  font-family: 'Permanent Marker', cursive;
  font-size: 1rem;
  margin-bottom: 6px;
}
.char-name.odin { color: var(--odin-blue); }
.char-name.thor { color: var(--thor-red); }
.char-name.corvo { color: var(--corvo-purple); }

.dialogue-text {
  font-size: 1.05rem;
  line-height: 1.5;
}

/* DATA TABLE */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 1rem;
}

.data-table th, .data-table td {
  padding: 10px 14px;
  text-align: center;
  border: 1px solid var(--border);
}

.data-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
}

.data-table td {
  background: var(--bg-card);
  transition: background 0.2s;
}

.data-table tr:hover td {
  background: rgba(88,166,255,0.1);
}

/* CALC TABLE */
.calc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.95rem;
}

.calc-table th, .calc-table td {
  padding: 8px 10px;
  text-align: center;
  border: 1px solid var(--border);
}

.calc-table th {
  background: var(--bg-panel);
  font-family: 'Permanent Marker', cursive;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.calc-table td {
  background: var(--bg-card);
}

/* FORMULA */
.formula {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 16px 0;
  font-size: 1.15rem;
  text-align: center;
  font-family: 'Patrick Hand', cursive;
  color: var(--gold);
}

.formula-label {
  font-family: 'Permanent Marker', cursive;
  color: var(--text-dim);
  font-size: 0.85rem;
  margin-bottom: 6px;
}

/* SVG VISUALS */
.visual-container {
  margin: 20px 0;
  text-align: center;
}

.visual-container svg {
  max-width: 100%;
  height: auto;
}

/* CONCEPT GRID */
.concept-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.concept-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.concept-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

/* COMPARISON GRID */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.comparison-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

.comparison-title {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.comparison-result {
  font-size: 1.4rem;
  font-family: 'Bangers', cursive;
}

/* APA BOX */
.apa-box {
  background: var(--bg-panel);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 20px 24px;
  margin: 20px 0;
  font-style: italic;
  line-height: 1.7;
}

.apa-label {
  font-family: 'Bangers', cursive;
  color: var(--gold);
  font-style: normal;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

/* WARNING BOX */
.warning-box {
  background: rgba(248,81,73,0.06);
  border: 2px solid var(--thor-red);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.warning-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--thor-red);
  margin-bottom: 12px;
}

/* CORRECT BOX */
.correct-box {
  background: rgba(63,185,80,0.06);
  border: 2px solid var(--success);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.correct-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--success);
  margin-bottom: 12px;
}

/* RAVENS LESSON */
.licao-box {
  background: rgba(188,140,255,0.06);
  border: 2px solid var(--corvo-purple);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
}

.licao-title {
  font-family: 'Bangers', cursive;
  font-size: 1.4rem;
  color: var(--corvo-purple);
  margin-bottom: 12px;
}

/* TRAP GRID */
.trap-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.trap-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.trap-card h4 {
  font-family: 'Permanent Marker', cursive;
  font-size: 0.95rem;
  color: var(--thor-red);
  margin-bottom: 8px;
}

/* NAVIGATION */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0 40px;
  gap: 12px;
}

.nav-btn {
  font-family: 'Permanent Marker', cursive;
  font-size: 1.1rem;
  padding: 12px 28px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.3s;
}

.nav-btn:hover {
  border-color: var(--odin-blue);
  background: rgba(88,166,255,0.1);
}

.nav-btn.primary {
  background: var(--odin-blue);
  color: var(--bg-dark);
  border-color: var(--odin-blue);
}

.nav-btn.primary:hover {
  background: #79bbff;
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* SIGNATURE */
.signature {
  text-align: center;
  padding: 30px 0;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.9rem;
}

/* HIGHLIGHTS */
.hl-gold { color: var(--gold); font-weight: bold; }
.hl-blue { color: var(--odin-blue); }
.hl-red { color: var(--thor-red); }
.hl-green { color: var(--success); }
.hl-purple { color: var(--corvo-purple); }

/* RESPONSIVE */
@media (max-width: 600px) {
  .container { padding: 12px; }
  .step-title { font-size: 1.6rem; }
  .concept-grid, .comparison-grid, .trap-grid { grid-template-columns: 1fr; }
  .nav-btn { padding: 10px 18px; font-size: 0.95rem; }
  body { font-size: 16px; }
}

.fade-in { animation: fadeIn 0.6s ease both; }
.fade-in-delay { animation: fadeIn 0.6s ease 0.3s both; }
</style>

<div class="container">
  <div class="progress-bar-container">
    <div class="progress-label" id="progressLabel">Passo 0 de 11</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="step-content" id="stepContent"></div>

<script>
// ===== DADOS =====
// Resultados de 12 campanhas pelos Nove Reinos
var battles = ['Cerco de Birka','Ataque a Hedeby','Marcha a Kaupang','Queda de Ribe','Muro de Escudos em Jorvik','Carga de Sigtuna','Defesa de Visby','Tempestade de Roskilde','Emboscada em Uppsala','Travessia de Lindisfarne','Assalto a Trondheim','Saque de Novgorod'];
var X1 = [120, 85, 200, 150, 95, 180, 110, 60, 140, 75, 220, 165]; // Guerreiros
var X2 = [80, 45, 90, 70, 55, 85, 75, 30, 65, 40, 95, 60];        // Provisões (barris)
var X3 = [7, 4, 8, 6, 9, 5, 8, 3, 6, 5, 9, 7];                    // Escore de Terreno (1-10)
var X4 = [8, 6, 9, 5, 7, 8, 7, 4, 6, 5, 9, 7];                    // Moral (1-10)
var Y  = [82, 55, 91, 62, 74, 78, 80, 35, 68, 48, 95, 72];        // Escore de Vitória (0-100)
var n = X1.length;
var k = 4; // número de preditores

// ===== HELPERS =====
function sum(arr) { return arr.reduce(function(a,b){return a+b;},0); }
function mean(arr) { return sum(arr) / arr.length; }
function rf(v, d) { return Number(v).toFixed(d === undefined ? 2 : d); }
function r4(v) { return Number(v).toFixed(4); }

// ===== MÉDIAS =====
var mX1 = mean(X1), mX2 = mean(X2), mX3 = mean(X3), mX4 = mean(X4), mY = mean(Y);

// ===== OPERAÇÕES MATRICIAIS (para OLS) =====
function buildDesignMatrix() {
  var Xm = [];
  for (var i = 0; i < n; i++) {
    Xm.push([1, X1[i], X2[i], X3[i], X4[i]]);
  }
  return Xm;
}

function transpose(M) {
  var rows = M.length, cols = M[0].length;
  var T = [];
  for (var j = 0; j < cols; j++) {
    T[j] = [];
    for (var i = 0; i < rows; i++) {
      T[j][i] = M[i][j];
    }
  }
  return T;
}

function matMul(A, B) {
  var rA = A.length, cA = A[0].length, cB = B[0].length;
  var C = [];
  for (var i = 0; i < rA; i++) {
    C[i] = [];
    for (var j = 0; j < cB; j++) {
      var s = 0;
      for (var m = 0; m < cA; m++) s += A[i][m] * B[m][j];
      C[i][j] = s;
    }
  }
  return C;
}

function matVecMul(A, v) {
  var result = [];
  for (var i = 0; i < A.length; i++) {
    var s = 0;
    for (var j = 0; j < v.length; j++) s += A[i][j] * v[j];
    result[i] = s;
  }
  return result;
}

function invertMatrix(M) {
  var sz = M.length;
  var aug = [];
  for (var i = 0; i < sz; i++) {
    aug[i] = [];
    for (var j = 0; j < sz; j++) aug[i][j] = M[i][j];
    for (var j2 = 0; j2 < sz; j2++) aug[i][sz + j2] = (i === j2) ? 1 : 0;
  }
  for (var col = 0; col < sz; col++) {
    var maxRow = col;
    for (var row = col + 1; row < sz; row++) {
      if (Math.abs(aug[row][col]) > Math.abs(aug[maxRow][col])) maxRow = row;
    }
    var tmp = aug[col]; aug[col] = aug[maxRow]; aug[maxRow] = tmp;
    var pivot = aug[col][col];
    if (Math.abs(pivot) < 1e-12) return null;
    for (var j3 = 0; j3 < 2 * sz; j3++) aug[col][j3] /= pivot;
    for (var row2 = 0; row2 < sz; row2++) {
      if (row2 !== col) {
        var factor = aug[row2][col];
        for (var j4 = 0; j4 < 2 * sz; j4++) aug[row2][j4] -= factor * aug[col][j4];
      }
    }
  }
  var inv = [];
  for (var i2 = 0; i2 < sz; i2++) {
    inv[i2] = [];
    for (var j5 = 0; j5 < sz; j5++) inv[i2][j5] = aug[i2][sz + j5];
  }
  return inv;
}

// ===== ESTIMAÇÃO OLS: b = (X'X)^-1 X'Y =====
var Xmat = buildDesignMatrix();
var Xt = transpose(Xmat);
var XtX = matMul(Xt, Xmat);
var XtXinv = invertMatrix(XtX);
var XtY = matVecMul(Xt, Y);
var betas = matVecMul(XtXinv, XtY);

var b0 = betas[0], b1 = betas[1], b2 = betas[2], b3 = betas[3], b4 = betas[4];

// ===== PREDITOS & RESÍDUOS =====
var Yhat = [];
var residuals = [];
for (var i = 0; i < n; i++) {
  Yhat[i] = b0 + b1*X1[i] + b2*X2[i] + b3*X3[i] + b4*X4[i];
  residuals[i] = Y[i] - Yhat[i];
}

// ===== SST, SSR, SSE =====
var SST = 0, SSR = 0, SSE = 0;
for (var i2 = 0; i2 < n; i2++) {
  SST += Math.pow(Y[i2] - mY, 2);
  SSR += Math.pow(Yhat[i2] - mY, 2);
  SSE += Math.pow(residuals[i2], 2);
}

var R2 = SSR / SST;
var R2adj = 1 - ((1 - R2) * (n - 1)) / (n - k - 1);

// ===== TESTE F =====
var MSR = SSR / k;
var MSE = SSE / (n - k - 1);
var Fstat = MSR / MSE;

// ===== ERROS PADRÃO & TESTES t =====
var seBetas = [];
for (var j = 0; j < (k + 1); j++) {
  seBetas[j] = Math.sqrt(MSE * XtXinv[j][j]);
}
var tBetas = [];
for (var j2b = 0; j2b < (k + 1); j2b++) {
  tBetas[j2b] = betas[j2b] / seBetas[j2b];
}

// ===== BETAS PADRONIZADOS =====
function stdev(arr) {
  var m = mean(arr);
  var ss = 0;
  for (var i = 0; i < arr.length; i++) ss += Math.pow(arr[i] - m, 2);
  return Math.sqrt(ss / (arr.length - 1));
}
var sdX1 = stdev(X1), sdX2 = stdev(X2), sdX3 = stdev(X3), sdX4 = stdev(X4), sdY = stdev(Y);
var betaStd1 = b1 * sdX1 / sdY;
var betaStd2 = b2 * sdX2 / sdY;
var betaStd3 = b3 * sdX3 / sdY;
var betaStd4 = b4 * sdX4 / sdY;

// ===== MATRIZ DE CORRELAÇÃO (para VIF) =====
function pearsonR(a, b) {
  var ma = mean(a), mb = mean(b);
  var num = 0, da2 = 0, db2 = 0;
  for (var i = 0; i < a.length; i++) {
    var da = a[i] - ma, db = b[i] - mb;
    num += da * db;
    da2 += da * da;
    db2 += db * db;
  }
  return num / Math.sqrt(da2 * db2);
}

var r12 = pearsonR(X1, X2);
var r13 = pearsonR(X1, X3);
var r14 = pearsonR(X1, X4);
var r23 = pearsonR(X2, X3);
var r24 = pearsonR(X2, X4);
var r34 = pearsonR(X3, X4);

// VIF via regressões auxiliares
function calcVIF(target, others) {
  var nt = target.length;
  var Xa = [];
  for (var i = 0; i < nt; i++) {
    Xa[i] = [1];
    for (var j = 0; j < others.length; j++) Xa[i].push(others[j][i]);
  }
  var Xat = transpose(Xa);
  var XatXa = matMul(Xat, Xa);
  var XatXaInv = invertMatrix(XatXa);
  if (!XatXaInv) return 999;
  var XatYa = matVecMul(Xat, target);
  var ba = matVecMul(XatXaInv, XatYa);
  var mt = mean(target);
  var sst = 0, sse = 0;
  for (var i2 = 0; i2 < nt; i2++) {
    var pred = 0;
    for (var j2 = 0; j2 < ba.length; j2++) pred += ba[j2] * Xa[i2][j2];
    sst += Math.pow(target[i2] - mt, 2);
    sse += Math.pow(target[i2] - pred, 2);
  }
  var r2a = 1 - sse / sst;
  return 1 / (1 - r2a);
}

var VIF1 = calcVIF(X1, [X2, X3, X4]);
var VIF2 = calcVIF(X2, [X1, X3, X4]);
var VIF3 = calcVIF(X3, [X1, X2, X4]);
var VIF4 = calcVIF(X4, [X1, X2, X3]);

// ===== APROXIMAÇÃO DO P-VALOR =====
function gammln(x) {
  var c = [76.18009172947146,-86.50532032941677,24.01409824083091,
    -1.231739572450155,0.001208650973866179,-0.000005395239384953];
  var y = x, tmp2 = x + 5.5;
  tmp2 -= (x+0.5)*Math.log(tmp2);
  var ser = 1.000000000190015;
  for(var j=0;j<6;j++) ser += c[j]/(++y);
  return -tmp2 + Math.log(2.5066282746310005*ser/x);
}

function tPDF(x, df) {
  var coeff = Math.exp(gammln((df+1)/2) - gammln(df/2)) / Math.sqrt(df * Math.PI);
  return coeff * Math.pow(1 + x*x/df, -(df+1)/2);
}

function tCDF(t, df) {
  var lower = -30;
  var steps = 4000;
  var h = (t - lower) / steps;
  var s = tPDF(lower, df) + tPDF(t, df);
  for (var i = 1; i < steps; i++) {
    var xi = lower + i * h;
    s += (i % 2 === 0 ? 2 : 4) * tPDF(xi, df);
  }
  return Math.max(0, Math.min(1, (h/3) * s));
}

function pValueTwoTailed(t, df) {
  var cdf = tCDF(Math.abs(t), df);
  return 2 * (1 - cdf);
}

function fPDF(x, d1, d2) {
  if (x <= 0) return 0;
  var num = Math.pow(d1 * x, d1) * Math.pow(d2, d2);
  var den = Math.pow(d1 * x + d2, d1 + d2);
  var ratio = Math.sqrt(num / den);
  var beta = Math.exp(gammln(d1/2) + gammln(d2/2) - gammln((d1+d2)/2));
  return ratio / (x * beta);
}

function fCDF(f, d1, d2) {
  if (f <= 0) return 0;
  var steps = 5000;
  var h = f / steps;
  var s = fPDF(0.0001, d1, d2) + fPDF(f, d1, d2);
  for (var i = 1; i < steps; i++) {
    var xi = 0.0001 + i * h;
    s += (i % 2 === 0 ? 2 : 4) * fPDF(xi, d1, d2);
  }
  return Math.max(0, Math.min(1, (h/3) * s));
}

var pF = 1 - fCDF(Fstat, k, n - k - 1);
var dfBetas = n - k - 1;
var pBetas = [];
for (var jP = 0; jP < (k+1); jP++) {
  pBetas[jP] = pValueTwoTailed(tBetas[jP], dfBetas);
}

// ===== HELPER DE DIÁLOGO =====
function dialogue(character, name, text) {
  return '<div class="dialogue-box ' + character + '">' +
    '<div class="char-name ' + character + '">' + name + '</div>' +
    '<div class="dialogue-text">' + text + '</div>' +
  '</div>';
}

// ===== SVG: GRÁFICO DE RESÍDUOS =====
function buildResidualPlot() {
  var w = 680, h = 320;
  var pad = { top: 30, right: 30, bottom: 50, left: 60 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  var yMin = -15, yMax = 15;
  var xMin2 = 30, xMax2 = 100;
  function sx(v) { return pad.left + (v - xMin2) / (xMax2 - xMin2) * pw; }
  function sy(v) { return pad.top + ph - (v - yMin) / (yMax - yMin) * ph; }

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

  for (var gy = -10; gy <= 10; gy += 5) {
    svg += '<line x1="' + pad.left + '" y1="' + sy(gy) + '" x2="' + (pad.left + pw) + '" y2="' + sy(gy) + '" stroke="#30363d" stroke-width="0.5" opacity="0.5"/>';
  }

  svg += '<line x1="' + pad.left + '" y1="' + sy(0) + '" x2="' + (pad.left + pw) + '" y2="' + sy(0) + '" stroke="#f0c040" stroke-width="1.5" stroke-dasharray="6,4"/>';

  svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (pad.left + pw) + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';
  svg += '<line x1="' + pad.left + '" y1="' + pad.top + '" x2="' + pad.left + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1.5"/>';

  svg += '<text x="' + (pad.left + pw/2) + '" y="' + (h - 5) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker">Predito (Y-chapéu)</text>';
  svg += '<text x="15" y="' + (pad.top + ph/2) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker" transform="rotate(-90,15,' + (pad.top + ph/2) + ')">Resíduo</text>';

  for (var gx = 40; gx <= 90; gx += 10) {
    svg += '<text x="' + sx(gx) + '" y="' + (pad.top + ph + 20) + '" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">' + gx + '</text>';
  }
  for (var gy2 = -10; gy2 <= 10; gy2 += 5) {
    svg += '<text x="' + (pad.left - 10) + '" y="' + (sy(gy2) + 4) + '" fill="#8b949e" font-size="11" text-anchor="end" font-family="Patrick Hand">' + gy2 + '</text>';
  }

  for (var i = 0; i < n; i++) {
    svg += '<circle cx="' + sx(Yhat[i]) + '" cy="' + sy(residuals[i]) + '" r="6" fill="#58a6ff" stroke="#0d1117" stroke-width="1.5" opacity="0.9"/>';
  }

  svg += '</svg>';
  return svg;
}

// ===== SVG: GRÁFICO DE VIF =====
function buildVIFChart() {
  var w = 680, h = 260;
  var pad = { top: 30, right: 30, bottom: 50, left: 80 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  var vifs = [VIF1, VIF2, VIF3, VIF4];
  var labels = ['Guerreiros', 'Provisões', 'Terreno', 'Moral'];
  var colors = ['#58a6ff', '#3fb950', '#bc8cff', '#f85149'];
  var barH = ph / 5;
  var maxVIF = Math.max(10, Math.max.apply(null, vifs) * 1.2);

  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

  var dangerX = pad.left + (10 / maxVIF) * pw;
  svg += '<rect x="' + dangerX + '" y="' + pad.top + '" width="' + (pad.left + pw - dangerX) + '" height="' + ph + '" fill="rgba(248,81,73,0.06)" />';
  svg += '<line x1="' + dangerX + '" y1="' + pad.top + '" x2="' + dangerX + '" y2="' + (pad.top + ph) + '" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,3"/>';
  svg += '<text x="' + (dangerX + 5) + '" y="' + (pad.top + 15) + '" fill="#f85149" font-size="11" font-family="Permanent Marker">VIF = 10 (Perigo!)</text>';

  for (var i = 0; i < 4; i++) {
    var by = pad.top + i * barH + barH * 0.2;
    var bw = (vifs[i] / maxVIF) * pw;
    var bh = barH * 0.6;
    svg += '<rect x="' + pad.left + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="' + colors[i] + '" opacity="0.8" rx="4"/>';
    svg += '<text x="' + (pad.left - 8) + '" y="' + (by + bh/2 + 5) + '" fill="' + colors[i] + '" font-size="12" text-anchor="end" font-family="Permanent Marker">' + labels[i] + '</text>';
    svg += '<text x="' + (pad.left + bw + 6) + '" y="' + (by + bh/2 + 5) + '" fill="' + colors[i] + '" font-size="13" font-family="Bangers">' + rf(vifs[i], 2) + '</text>';
  }

  svg += '<line x1="' + pad.left + '" y1="' + (pad.top + ph) + '" x2="' + (pad.left + pw) + '" y2="' + (pad.top + ph) + '" stroke="#8b949e" stroke-width="1"/>';
  for (var gx = 2; gx <= maxVIF; gx += 2) {
    var xp = pad.left + (gx / maxVIF) * pw;
    svg += '<text x="' + xp + '" y="' + (pad.top + ph + 18) + '" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Patrick Hand">' + gx + '</text>';
  }
  svg += '<text x="' + (pad.left + pw/2) + '" y="' + (h - 5) + '" fill="#8b949e" font-size="13" text-anchor="middle" font-family="Permanent Marker">VIF</text>';

  svg += '</svg>';
  return svg;
}

    '<div class="comparison-grid">' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--odin-blue)">R²</div>' +

        '<p style="font-size:0.85rem;margin-top:6px">Penalizado por k = ' + k + ' preditores</p>' +

        '<div class="comparison-title" style="color:var(--thor-red)">Encolhimento</div>' +

    '<div class="formula">' +
      '<div class="formula-label">Fórmula do R² Ajustado</div>' +
      'R²<sub>adj</sub> = 1 \x96 [(1 \x96 R²)(n \x96 1) / (n \x96 k \x96 1)]' +
    '</div>' +

    '<p>Substituindo: R²<sub>adj</sub> = 1 \x96 [(1 \x96 ' + rf(R2,4) + ')(' + n + ' \x96 1) / (' + n + ' \x96 ' + k + ' \x96 1)] = 1 \x96 [' + rf(1-R2,4) + ' × ' + (n-1) + ' / ' + (n-k-1) + '] = <span class="hl-gold">' + rf(R2adj,4) + '</span></p>' +

    dialogue('odin', '🛡️ Odin Dinho', 'O R² Ajustado penaliza pelo número de preditores. Se um preditor adiciona ruído em vez de sinal, o R² Ajustado pode realmente <em>diminuir</em> quando você o inclui. Por isso reportamos ambos.') +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ Armadilha de ThorMento: Inflação do R²</div>' +
      '<p>Adicionar qualquer preditor \x96 até um gerador de números aleatórios \x96 vai aumentar o R². Com n = 12 e k = 4, a diferença entre R² e R² Ajustado é ' + rf((R2 - R2adj)*100,1) + ' pontos percentuais. Com amostras pequenas e muitos preditores, essa lacuna pode ser enorme. <strong>Sempre reporte o R² Ajustado.</strong></p>' +
    '</div>' +

    dialogue('corvo', '🪶 Huginn provoca:', 'R² de ' + rf(R2,2) + ' parece impressionante. Mas com apenas ' + n + ' observações e ' + k + ' preditores, estamos perigosamente perto do sobreajuste. Regra geral: ao menos 10 a 15 observações por preditor. Temos ' + n + '/' + k + ' = ' + rf(n/k,0) + '. Apertado.');
}

function step5() {
  return '<div class="step-title">Passo 5: Teste F \x96 O Modelo Geral É Significativo?</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Antes de examinar preditores individuais, perguntamos: este modelo, <em>como um todo</em>, explica significativamente mais variância do que um modelo sem preditores? Esse é o teste F.') +

    '<div class="formula">' +
      '<div class="formula-label">Fórmula do Teste F</div>' +
      'F = (R² / k) / [(1 \x96 R²) / (n \x96 k \x96 1)] = QMR / QME' +
    '</div>' +

    '<table class="data-table">' +
    '<tr><th>Fonte</th><th>SQ</th><th>gl</th><th>QM</th><th>F</th></tr>' +
    '<tr><td>Regressão (SQR)</td><td>' + rf(SSR,2) + '</td><td>' + k + '</td><td>' + rf(MSR,2) + '</td><td rowspan="2" style="font-size:1.3rem;color:var(--gold)">' + rf(Fstat,2) + '</td></tr>' +
    '<tr><td>Resíduo (SQE)</td><td>' + rf(SSE,2) + '</td><td>' + (n-k-1) + '</td><td>' + rf(MSE,2) + '</td></tr>' +
    '<tr><td>Total (SQT)</td><td>' + rf(SST,2) + '</td><td>' + (n-1) + '</td><td>\x96</td><td>\x96</td></tr>' +
    '</table>' +

    '<div class="formula">' +
      '<div class="formula-label">Cálculo</div>' +
      'F(' + k + ', ' + (n-k-1) + ') = ' + rf(MSR,2) + ' / ' + rf(MSE,2) + ' = <span style="color:var(--gold);font-size:1.3rem">' + rf(Fstat,2) + '</span>, p ' + (pF < .001 ? '< ,001' : '= ' + rf(pF,3)) +
    '</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'A hipótese nula é H₀: β₁ = β₂ = β₃ = β₄ = 0 (nenhum preditor está relacionado a Y). Com F = ' + rf(Fstat,2) + ' e p ' + (pF < .001 ? '< ,001' : '= ' + rf(pF,3)) + ', rejeitamos H₀. O modelo é significativo: <strong>pelo menos um preditor</strong> está relacionado ao Escore de Vitória.') +

    dialogue('thor', '🔨 ThorMento', 'Ótimo! Então todos os quatro preditores são significativos?') +

    dialogue('odin', '🛡️ Odin Dinho', 'Não! O teste F diz que o <em>modelo como um todo</em> é significativo. Preditores individuais são testados separadamente com testes t. Um F significativo com t individuais não significativos é perfeitamente possível \x96 frequentemente sinaliza multicolinearidade.') +

    dialogue('corvo', '🪶 Muninn sussurra:', 'Pense no teste F como um porteiro: ele diz se <em>alguém</em> no grupo é importante. Mas ele não aponta o dedo para indivíduos específicos. Para isso, precisamos do Passo 6.');
}

function step6() {
  return '<div class="step-title">Passo 6: Testes t para Preditores Individuais \x96 Quem Importa?</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Agora testamos cada coeficiente individualmente. O teste t para cada bⱼ pergunta: a contribuição única deste preditor é significativamente diferente de zero, após contabilizar todos os outros preditores?') +

    '<div class="formula">' +
      '<div class="formula-label">Teste t para Coeficientes Individuais</div>' +
      't = bⱼ / EP(bⱼ), &emsp; gl = n \x96 k \x96 1 = ' + (n-k-1) +
    '</div>' +

    '<table class="data-table">' +
    '<tr><th>Preditor</th><th>b</th><th>EP</th><th>t(' + (n-k-1) + ')</th><th>p</th><th>Significativo?</th></tr>' +
    '<tr><td>Guerreiros (b₁)</td><td>' + rf(b1,4) + '</td><td>' + rf(seBetas[1],4) + '</td><td>' + rf(tBetas[1],2) + '</td><td>' + (pBetas[1] < .001 ? '< ,001' : rf(pBetas[1],3)) + '</td><td>' + (pBetas[1] < .05 ? '<span class="hl-green">✓ Sim</span>' : '<span class="hl-red">✗ Não</span>') + '</td></tr>' +
    '<tr><td>Provisões (b₂)</td><td>' + rf(b2,4) + '</td><td>' + rf(seBetas[2],4) + '</td><td>' + rf(tBetas[2],2) + '</td><td>' + (pBetas[2] < .001 ? '< ,001' : rf(pBetas[2],3)) + '</td><td>' + (pBetas[2] < .05 ? '<span class="hl-green">✓ Sim</span>' : '<span class="hl-red">✗ Não</span>') + '</td></tr>' +
    '<tr><td>Terreno (b₃)</td><td>' + rf(b3,4) + '</td><td>' + rf(seBetas[3],4) + '</td><td>' + rf(tBetas[3],2) + '</td><td>' + (pBetas[3] < .001 ? '< ,001' : rf(pBetas[3],3)) + '</td><td>' + (pBetas[3] < .05 ? '<span class="hl-green">✓ Sim</span>' : '<span class="hl-red">✗ Não</span>') + '</td></tr>' +
    '<tr><td>Moral (b₄)</td><td>' + rf(b4,4) + '</td><td>' + rf(seBetas[4],4) + '</td><td>' + rf(tBetas[4],2) + '</td><td>' + (pBetas[4] < .001 ? '< ,001' : rf(pBetas[4],3)) + '</td><td>' + (pBetas[4] < .05 ? '<span class="hl-green">✓ Sim</span>' : '<span class="hl-red">✗ Não</span>') + '</td></tr>' +
    '</table>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Um preditor pode estar <em>significativamente correlacionado com Y</em> numa análise bivariada, mas se tornar <em>não significativo</em> no modelo completo. Por quê? Porque sua contribuição se sobrepõe a outros preditores. O teste t aqui mede apenas a variância <strong>única</strong> explicada.') +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ Armadilha de ThorMento: Efeitos Supressores</div>' +
      dialogue('thor', '🔨 ThorMento', 'Se um preditor não é significativo, joga fora!') +
      '<p>Calma lá. Às vezes uma variável que tem baixa correlação com Y pode ainda ser significativa no modelo porque suprime variância irrelevante em outro preditor. Removê-la cegamente pode tornar o modelo <em>pior</em>. Significância estatística não é o único critério para manter uma variável \x96 teoria importa.</p>' +
    '</div>' +

    dialogue('corvo', '🪶 Huginn provoca:', 'Lembre-se: com apenas ' + (n-k-1) + ' graus de liberdade para o erro, temos poder muito baixo. Um resultado não significativo <em>não</em> significa que o preditor não é importante \x96 pode significar que não temos dados suficientes para detectar seu efeito.');
}

function step7() {
  return '<div class="step-title">Passo 7: Multicolinearidade \x96 Quando Preditores São Próximos Demais</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Multicolinearidade ocorre quando dois ou mais preditores são <strong>altamente correlacionados</strong> entre si. A regressão ainda funciona matematicamente, mas os coeficientes ficam instáveis, os erros padrão inflam e a interpretação desmorona.') +

    '<div class="visual-container">' +
      buildVennDiagram() +
    '</div>' +

    '<p>Quando preditores se sobrepõem demais, fica impossível atribuir crédito a qualquer um individualmente. O modelo explica Y bem coletivamente, mas os b individuais podem trocar de sinal, mudar de magnitude ou se tornar não significativos.</p>' +

    '<div class="formula">' +
      '<div class="formula-label">Fator de Inflação da Variância (VIF)</div>' +
      'VIFⱼ = 1 / (1 \x96 R²ⱼ), onde R²ⱼ é o R² da regressão de Xⱼ sobre todos os outros preditores' +
    '</div>' +

    '<div class="visual-container">' +
      buildVIFChart() +
    '</div>' +

    '<table class="data-table">' +
    '<tr><th>Preditor</th><th>VIF</th><th>Tolerância (1/VIF)</th><th>Status</th></tr>' +
    '<tr><td>Guerreiros</td><td>' + rf(VIF1,2) + '</td><td>' + rf(1/VIF1,3) + '</td><td>' + (VIF1 > 10 ? '<span class="hl-red">⚠ Perigo</span>' : VIF1 > 5 ? '<span class="hl-gold">⚠ Cautela</span>' : '<span class="hl-green">✓ OK</span>') + '</td></tr>' +
    '<tr><td>Provisões</td><td>' + rf(VIF2,2) + '</td><td>' + rf(1/VIF2,3) + '</td><td>' + (VIF2 > 10 ? '<span class="hl-red">⚠ Perigo</span>' : VIF2 > 5 ? '<span class="hl-gold">⚠ Cautela</span>' : '<span class="hl-green">✓ OK</span>') + '</td></tr>' +
    '<tr><td>Terreno</td><td>' + rf(VIF3,2) + '</td><td>' + rf(1/VIF3,3) + '</td><td>' + (VIF3 > 10 ? '<span class="hl-red">⚠ Perigo</span>' : VIF3 > 5 ? '<span class="hl-gold">⚠ Cautela</span>' : '<span class="hl-green">✓ OK</span>') + '</td></tr>' +
    '<tr><td>Moral</td><td>' + rf(VIF4,2) + '</td><td>' + rf(1/VIF4,3) + '</td><td>' + (VIF4 > 10 ? '<span class="hl-red">⚠ Perigo</span>' : VIF4 > 5 ? '<span class="hl-gold">⚠ Cautela</span>' : '<span class="hl-green">✓ OK</span>') + '</td></tr>' +
    '</table>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--success)">VIF < 5</h4>' +
        '<p>Geralmente aceitável. Coeficientes estáveis.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">VIF 5 a 10</h4>' +
        '<p>Preocupação moderada. Investigue e considere remédios.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--thor-red)">VIF > 10</h4>' +
        '<p>Problema sério. Coeficientes não confiáveis. Ação necessária.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">Remédios</h4>' +
        '<p>Remover preditor redundante, combinar preditores colineares ou usar regressão ridge.</p>' +
      '</div>' +
    '</div>' +

    dialogue('thor', '🔨 ThorMento', 'Por que não só jogar tudo dentro e ver o que gruda?') +

    dialogue('corvo', '🪶 Huginn provoca:', 'Porque com multicolinearidade, o que "gruda" muda de amostra para amostra. Os b viram catavento: uma amostra ligeiramente diferente pode inverter seus sinais completamente. Estabilidade é o objetivo, não apenas significância.');
}

function step8() {
  return '<div class="step-title">Passo 8: Seleção de Variáveis \x96 Enter, Stepwise ou Hierárquica?</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Como decidimos quais preditores incluir? Existem três abordagens principais, e cada uma tem implicações filosóficas.') +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">Enter (Entrada Forçada)</h4>' +
        '<p>Todos os preditores são incluídos simultaneamente. O pesquisador decide quais variáveis incluir com base na <strong>teoria</strong>.</p>' +
        '<p style="margin-top:8px;color:var(--success)"><strong>Prós:</strong> Baseado em teoria, transparente, reproduzível.</p>' +
        '<p style="color:var(--thor-red)"><strong>Contras:</strong> Pode incluir variáveis irrelevantes.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">Stepwise (Forward/Backward)</h4>' +
        '<p>Variáveis são adicionadas ou removidas automaticamente com base em critérios estatísticos (F-para-entrar, F-para-remover).</p>' +
        '<p style="margin-top:8px;color:var(--success)"><strong>Prós:</strong> Parcimonioso, automatizado.</p>' +
        '<p style="color:var(--thor-red)"><strong>Contras:</strong> Capitaliza o acaso, infla erro Tipo I, resultados podem não replicar.</p>' +
      '</div>' +
      '<div class="concept-card" style="grid-column:1/-1">' +
        '<h4 style="color:var(--corvo-purple)">Hierárquica (Sequencial)</h4>' +
        '<p>Preditores são incluídos em <strong>blocos</strong>, ordenados por prioridade teórica. O Bloco 1 pode ser demográfico, o Bloco 2 as variáveis-chave de interesse. A mudança em R² a cada bloco mostra a contribuição <em>incremental</em>.</p>' +
        '<p style="margin-top:8px;color:var(--success)"><strong>Prós:</strong> Testa questões teóricas sobre predição incremental.</p>' +
        '<p style="color:var(--thor-red)"><strong>Contras:</strong> A ordem de entrada importa \x96 o pesquisador precisa justificá-la.</p>' +
      '</div>' +
    '</div>' +

    dialogue('thor', '🔨 ThorMento', 'Stepwise parece ótimo! Deixa o computador escolher o melhor modelo pra mim!') +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ Armadilha de ThorMento: Ilusão do Stepwise</div>' +
      '<p>A regressão stepwise é amplamente criticada na estatística moderna:</p>' +
      '<ul style="margin-top:8px;padding-left:20px">' +
      '<li>Explora o erro amostral: as "melhores" variáveis numa amostra podem não ser as melhores em outra.</li>' +
      '<li>Valores de R² são inflados porque o procedimento busca o melhor ajuste.</li>' +
      '<li>P-valores não são mais válidos porque assumem hipóteses pré-especificadas.</li>' +
      '<li>Frank Harrell: "<em>Stepwise regression is one of the worst things you can do.</em>"</li>' +
      '</ul>' +
    '</div>' +

    '<div class="correct-box">' +
      '<div class="correct-title">✅ Boa Prática</div>' +
      '<p>Use <strong>entrada forçada</strong> guiada por teoria. Se precisar explorar, use entrada hierárquica para testar blocos significativos. Reserve stepwise apenas para estudos exploratórios com validação cruzada explícita. <strong>Sempre reporte qual método você usou e por quê.</strong></p>' +
    '</div>' +

    dialogue('corvo', '🪶 Muninn sussurra:', 'No nosso exemplo de batalha, a teoria diz que todos os quatro fatores importam. Usamos entrada forçada (método Enter) para incluir todos os quatro simultaneamente e deixar os testes t resolverem a significância.');
}

function step9() {
  return '<div class="step-title">Passo 9: Pressupostos \x96 O Protocolo LINE + Sem Multicolinearidade</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'A regressão múltipla herda os pressupostos LINE da regressão simples, mais um adicional sobre multicolinearidade. Viole-os, e seus coeficientes, p-valores e intervalos de confiança se tornam não confiáveis.') +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">L \x96 Linearidade</h4>' +
        '<p>A relação entre cada X e Y (dados os outros X) deve ser linear. Verifique gráficos de regressão parcial (cada X vs. resíduos dos outros preditores).</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">I \x96 Independência</h4>' +
        '<p>Resíduos devem ser independentes entre si. Violado em séries temporais, dados agrupados ou medidas repetidas. Verifique Durbin-Watson (≈ 2 é ideal).</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--success)">N \x96 Normalidade dos Resíduos</h4>' +
        '<p>Resíduos devem ser aproximadamente normais. Verifique Q-Q plots e teste de Shapiro-Wilk. Robusto com n grande (≥ 30).</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">E \x96 Variância Igual (Homocedasticidade)</h4>' +
        '<p>A dispersão dos resíduos deve ser constante ao longo dos valores preditos. Forma de funil = heterocedasticidade. Verifique gráfico de resíduos vs. preditos.</p>' +
      '</div>' +
    '</div>' +

    '<p class="step-subtitle">Gráfico de Resíduos vs. Valores Preditos</p>' +

    '<div class="visual-container">' +
      buildResidualPlot() +
    '</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'Queremos uma <strong>dispersão aleatória</strong> ao redor de zero \x96 sem padrões, sem funis, sem curvas. Se os pontos formam uma curva, o pressuposto de linearidade falha. Se se abrem em leque, a homocedasticidade falha.') +

    '<p class="step-subtitle">Diagnósticos Adicionais</p>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--thor-red)">Distância de Cook</h4>' +
        '<p>Mede a influência de cada observação na regressão. Valores > 1 (ou > 4/n = ' + rf(4/n,2) + ') sinalizam casos influentes.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">Alavancagem (hᵢᵢ)</h4>' +
        '<p>Quão longe os valores de X de uma observação estão do centroide. Alta alavancagem + resíduo grande = alta influência.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">Resíduos Studentizados</h4>' +
        '<p>Resíduos divididos pelo EP estimado. Valores > |3| são potenciais outliers.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">Multicolinearidade (VIF)</h4>' +
        '<p>Já abordado no Passo 7. VIF < 10 para todos os preditores. Este é o pressuposto "extra" além do LINE.</p>' +
      '</div>' +
    '</div>' +

    dialogue('corvo', '🪶 Huginn provoca:', 'Verificar pressupostos não é opcional. É a diferença entre ciência e feitiçaria. Quantos artigos publicados reportam uma regressão sem um único gráfico diagnóstico? Muitos. Não seja um deles.');
}

function step10() {
  return '<div class="step-title">Passo 10: Variáveis Dummy \x96 Codificando Preditores Categóricos</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'E se um dos nossos preditores for <em>categórico</em> em vez de contínuo? Por exemplo, <strong>tipo de terreno</strong>: Planície, Floresta ou Montanhas. Não podemos simplesmente codificá-los como 1, 2, 3 \x96 isso implica uma ordem e espaçamento igual que não existem.') +

    '<div class="formula">' +
      '<div class="formula-label">Codificação Dummy (k \x96 1 dummies para k categorias)</div>' +
      'Para 3 tipos de terreno, criamos 2 variáveis dummy:' +
    '</div>' +

    '<table class="data-table">' +
    '<tr><th>Tipo de Terreno</th><th>D₁ (Floresta)</th><th>D₂ (Montanhas)</th></tr>' +
    '<tr><td><strong>Planície</strong> (referência)</td><td>0</td><td>0</td></tr>' +
    '<tr><td><strong>Floresta</strong></td><td>1</td><td>0</td></tr>' +
    '<tr><td><strong>Montanhas</strong></td><td>0</td><td>1</td></tr>' +
    '</table>' +

    '<p>A regressão fica:</p>' +

    '<div class="formula">' +
      'ŷ = b₀ + b₁(Guerreiros) + b₂(D₁<sub>Floresta</sub>) + b₃(D₂<sub>Montanhas</sub>) + ...' +
    '</div>' +

    '<div class="concept-grid">' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--odin-blue)">Categoria de Referência</h4>' +
        '<p>A categoria codificada como todos zeros. Todas as comparações são <em>relativas a este grupo</em>. Aqui, Planície é a referência.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--gold)">b de uma Dummy</h4>' +
        '<p>O coeficiente de D₁ = a diferença na média de Y entre Floresta e Planície, controlando os outros preditores.</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--success)">Número de Dummies</h4>' +
        '<p>Sempre <strong>k \x96 1</strong> dummies para k categorias. Incluir todas as k cria multicolinearidade perfeita (a "armadilha da variável dummy").</p>' +
      '</div>' +
      '<div class="concept-card">' +
        '<h4 style="color:var(--corvo-purple)">Outros Esquemas</h4>' +
        '<p><strong>Codificação de efeitos</strong> (\x961, 0, 1): compara cada grupo à média geral. <strong>Codificação de contraste</strong>: testa hipóteses específicas.</p>' +
      '</div>' +
    '</div>' +

    dialogue('thor', '🔨 ThorMento', 'Por que não só colocar Planície = 1, Floresta = 2, Montanhas = 3 e pronto?') +

    '<div class="warning-box">' +
      '<div class="warning-title">⚠️ Armadilha de ThorMento: Codificação Numérica de Categorias</div>' +
      '<p>Codificar categorias como 1/2/3 implica que a diferença entre Planície e Floresta é a mesma que entre Floresta e Montanhas, <em>e</em> que Montanhas é "três vezes" Planície. Isso é absurdo para variáveis nominais. <strong>Sempre use codificação dummy (ou de efeitos) para preditores categóricos.</strong></p>' +
    '</div>' +

    dialogue('corvo', '🪶 Muninn sussurra:', 'Para testar o efeito <em>geral</em> de uma variável categórica com k categorias, use o teste F de mudança ao adicionar todas as k\x961 dummies como um bloco. Os testes t individuais das dummies apenas comparam cada categoria à referência.');
}

function step11() {
  return '<div class="step-title">Passo 11: Lição dos Corvos</div>' +

    '<div class="licao-box">' +
      '<div class="licao-title">🪶 Lição dos Corvos: Regressão Linear Múltipla</div>' +

      dialogue('corvo', '🪶 Muninn (Memória) resume:', '<strong>Pontos-chave deste reino:</strong>' +
        '<ul style="margin-top:8px;padding-left:20px">' +
        '<li><strong>RLM estende a regressão simples</strong> para múltiplos preditores: ŷ = b₀ + b₁x₁ + ... + bₖxₖ.</li>' +
        '<li><strong>Coeficientes parciais (bⱼ)</strong> medem o efeito de Xⱼ mantendo todos os outros preditores constantes.</li>' +
        '<li><strong>Betas padronizados (β)</strong> permitem comparar a importância relativa entre preditores.</li>' +
        '<li><strong>R²</strong> = variância total explicada. <strong>R² Ajustado</strong> penaliza pelo número de preditores.</li>' +
        '<li><strong>Teste F</strong> avalia o modelo geral. <strong>Testes t</strong> avaliam preditores individuais.</li>' +
        '<li><strong>VIF > 10</strong> sinaliza multicolinearidade perigosa. Verifique o VIF antes de interpretar os b.</li>' +
        '<li><strong>Variáveis dummy</strong> codificam preditores categóricos usando k\x961 indicadores binários.</li>' +
        '<li><strong>Pressupostos</strong>: LINE + sem multicolinearidade. Sempre verifique gráficos de resíduos.</li>' +
        '</ul>') +

      dialogue('corvo', '🪶 Huginn (Pensamento) desafia:', '<strong>Nunca esqueça:</strong>' +
        '<ul style="margin-top:8px;padding-left:20px">' +
        '<li>Um F significativo com t não significativos geralmente significa multicolinearidade.</li>' +
        '<li>Regressão stepwise é uma armadilha \x96 use métodos de entrada guiados por teoria.</li>' +
        '<li>Tamanho amostral importa: mire em pelo menos 10 a 15 observações por preditor.</li>' +
        '<li>R² sempre aumenta com mais preditores \x96 R² Ajustado é a métrica honesta.</li>' +
        '<li>Verifique a Distância de Cook para observações influentes \x96 um caso ruim pode mudar tudo.</li>' +
        '</ul>') +
    '</div>' +

    '<p class="step-subtitle">Formato de Relato APA</p>' +

    '<div class="apa-box">' +
      '<div class="apa-label">📝 Formato APA: Regressão Linear Múltipla</div>' +
      '<p>Uma regressão linear múltipla foi conduzida para predizer escores de vitória em batalha a partir do número de guerreiros, provisões, escore de terreno e moral. O modelo geral foi significativo, <em>F</em>(' + k + ', ' + (n-k-1) + ') = ' + rf(Fstat,2) + ', <em>p</em> ' + (pF < .001 ? '< ,001' : '= ' + rf(pF,3)) + ', <em>R</em>² = ' + rf(R2,2) + ', <em>R</em>²<sub>adj</sub> = ' + rf(R2adj,2) + '. O modelo explicou ' + rf(R2adj*100,1) + '% da variância nos escores de vitória (ajustado). ' +
      'Guerreiros (β = ' + rf(betaStd1,2) + ', <em>p</em> ' + (pBetas[1] < .05 ? (pBetas[1] < .001 ? '< ,001' : '= ' + rf(pBetas[1],3)) : '= ' + rf(pBetas[1],3)) + '), ' +
      'Provisões (β = ' + rf(betaStd2,2) + ', <em>p</em> ' + (pBetas[2] < .05 ? (pBetas[2] < .001 ? '< ,001' : '= ' + rf(pBetas[2],3)) : '= ' + rf(pBetas[2],3)) + '), ' +
      'Terreno (β = ' + rf(betaStd3,2) + ', <em>p</em> ' + (pBetas[3] < .05 ? (pBetas[3] < .001 ? '< ,001' : '= ' + rf(pBetas[3],3)) : '= ' + rf(pBetas[3],3)) + ') e ' +
      'Moral (β = ' + rf(betaStd4,2) + ', <em>p</em> ' + (pBetas[4] < .05 ? (pBetas[4] < .001 ? '< ,001' : '= ' + rf(pBetas[4],3)) : '= ' + rf(pBetas[4],3)) + ') foram examinados como preditores individuais. Todos os VIFs ficaram abaixo de 10, indicando níveis aceitáveis de multicolinearidade.</p>' +
    '</div>' +

    '<p class="step-subtitle">Armadilhas Comuns</p>' +

    '<div class="trap-grid">' +
      '<div class="trap-card">' +
        '<h4>⚠️ Confundir b e β</h4>' +
        '<p>Comparar b não padronizados entre preditores com escalas diferentes não tem sentido. Use β padronizado para importância relativa.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Ignorar multicolinearidade</h4>' +
        '<p>Altas correlações entre preditores inflam erros padrão e podem inverter sinais. Sempre reporte o VIF.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Cegueira stepwise</h4>' +
        '<p>Deixar o computador escolher variáveis capitaliza o erro amostral. Resultados raramente replicam. Use teoria.</p>' +
      '</div>' +
      '<div class="trap-card">' +
        '<h4>⚠️ Sobreajuste com n pequeno</h4>' +
        '<p>Com n/k = ' + rf(n/k,0) + ', o modelo pode ajustar ruído. Faça validação cruzada ou colete mais dados.</p>' +
      '</div>' +
    '</div>' +

    '<div class="comparison-grid" style="margin-top:24px">' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--odin-blue)">R²</div>' +
        '<div class="comparison-result" style="color:var(--odin-blue)">' + rf(R2,4) + '</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--gold)">R² Adj.</div>' +
        '<div class="comparison-result" style="color:var(--gold)">' + rf(R2adj,4) + '</div>' +
      '</div>' +
      '<div class="comparison-card">' +
        '<div class="comparison-title" style="color:var(--success)">F(' + k + ',' + (n-k-1) + ')</div>' +
        '<div class="comparison-result" style="color:var(--success)">' + rf(Fstat,2) + '</div>' +
      '</div>' +
    '</div>' +

    dialogue('odin', '🛡️ Odin Dinho', 'O conselho de guerra agora enxerga: a vitória não é determinada por um único fator. Múltiplas forças moldam o resultado, e entender suas contribuições <em>únicas</em> \x96 levando em conta sua sobreposição \x96 é o poder da regressão múltipla. Adiante para o próximo reino!');
}

// ===== REGISTRO DE PASSOS =====
var stepFunctions = [step0, step1, step2, step3, step4, step5, step6, step7, step8, step9, step10, step11];

var stepNames = [
  'Introdução',
  'Simples a Múltipla',
  'Os Dados',
  'Coeficientes Parciais',
  'R² e R² Ajustado',
  'Teste F (Geral)',
  'Testes t (Individuais)',
  'Multicolinearidade',
  'Seleção de Variáveis',
  'Pressupostos (LINE)',
  'Variáveis Dummy',
  'Lição dos Corvos'
];

var totalSteps = 12;
var currentStep = 0;

// ===== NAVEGAÇÃO =====
function renderStep() {
  var content = document.getElementById('stepContent');
  content.innerHTML = stepFunctions[currentStep]();
  content.style.animation = 'none';
  content.offsetHeight;
  content.style.animation = 'fadeIn 0.4s ease';

  document.getElementById('progressLabel').textContent = 'Passo ' + currentStep + ' de ' + (totalSteps - 1) + ' \x96 ' + stepNames[currentStep];
  document.getElementById('progressFill').style.width = (currentStep / (totalSteps - 1) * 100) + '%';

  document.getElementById('btnBack').disabled = currentStep === 0;
  document.getElementById('btnNext').textContent = currentStep === totalSteps - 1 ? 'Reiniciar ↻' : 'Próximo ▶';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  if (currentStep >= totalSteps - 1) {
    currentStep = 0;
  } else {
    currentStep++;
  }
  renderStep();
}

function goBack() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

// Navegação por teclado
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
});

// Inicializar
renderStep();
</script>
</body>
</html>
